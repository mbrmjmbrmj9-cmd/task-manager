<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | التقارير</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        body { min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .page-desc { font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .view-nav { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 0.75rem; overflow-x: auto; }
        .view-nav a { padding: 0.5rem 0.85rem; font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
        .view-nav a:hover { color: var(--primary); }
        .view-nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .toolbar select, .toolbar button { height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0 0.5rem; font-family: inherit; font-size: 0.8rem; background: var(--bg); color: var(--text); cursor: pointer; }
        .toolbar button { font-weight: 600; display: flex; align-items: center; gap: 0.25rem; }
        .toolbar button:hover { background: var(--secondary-light); }
        .spacer { flex: 1; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .kpi-card { padding: 1.5rem; border-radius: var(--radius); display: flex; align-items: center; gap: 1rem; transition: transform var(--transition); }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .kpi-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .kpi-icon.blue { background: var(--primary-light); color: var(--primary); }
        .kpi-icon.green { background: var(--success-light); color: var(--success); }
        .kpi-icon.red { background: var(--danger-light); color: var(--danger); }
        .kpi-icon.purple { background: #F5F3FF; color: #7C3AED; }
        .kpi-info { flex: 1; }
        .kpi-label { font-size: 0.78rem; font-weight: 600; color: var(--text-light); margin-bottom: 0.2rem; }
        .kpi-value { font-size: 1.8rem; font-weight: 800; line-height: 1; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .chart-card { padding: 1.5rem; }
        .chart-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; }
        .bar-chart { display: flex; align-items: flex-end; gap: 0.75rem; height: 180px; padding-top: 0.5rem; }
        .bar-item { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
        .bar-value { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.35rem; }
        .bar { width: 100%; max-width: 56px; border-radius: 6px 6px 0 0; transition: height 0.5s ease; min-height: 4px; }
        .bar-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.4rem; font-weight: 500; }
        .progress-bar { height: 8px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; flex: 1; min-width: 60px; }
        .progress-fill { height: 100%; border-radius: var(--radius-full); transition: width 0.5s ease; }
        .projects-table { width: 100%; border-collapse: collapse; }
        .projects-table th, .projects-table td { padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; text-align: right; }
        .projects-table th { color: var(--text-light); font-weight: 700; font-size: 0.75rem; background: var(--secondary-light); white-space: nowrap; }
        .projects-table tbody tr { transition: background var(--transition-fast); }
        .projects-table tbody tr:hover { background: var(--secondary-light); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } .charts-row { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 0.75rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; } .kpi-card { padding: 1rem; gap: 0.5rem; } .kpi-icon { width: 36px; height: 36px; font-size: 1.1rem; border-radius: var(--radius-xs); } .kpi-value { font-size: 1.4rem; } .projects-table { font-size: 0.7rem; } .projects-table th:nth-child(4), .projects-table td:nth-child(4) { display: none; } }
    </style>
<script src="js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js" defer></script>
</head>
<body data-ui="app">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <aside id="sidebar" class="shell-rail"></aside>

    <main class="main">
        <div class="topbar">
            <div><h1>التقارير</h1><p class="page-desc">نظرة شاملة على أداء المشاريع والمهام</p></div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <div style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;" onclick="window.location.href='profile.html'">
                    <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:var(--secondary-light);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:var(--text-light);overflow:hidden;"></div>
                    <span id="topUsername" style="font-size:0.8rem;font-weight:600;"></span>
                </div>
                <select id="projectFilter" onchange="loadReports()" style="height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);padding:0 0.5rem;font-family:inherit;font-size:0.8rem;background:var(--bg);color:var(--text);"><option value="">كل المشاريع</option></select>
                <!-- زر الإشعارات -->
<div style="position:relative;">
    <button class="btn btn-ghost btn-icon" onclick="toggleNotifications()" id="notifBtn" style="width:36px;height:36px;position:relative;">
        🔔
        <span id="notifBadge" style="display:none;position:absolute;top:2px;left:2px;background:var(--danger);color:#fff;font-size:0.6rem;font-weight:700;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;"></span>
    </button>
    <div id="notifDropdown" style="display:none;position:absolute;top:42px;left:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:320px;max-height:400px;overflow-y:auto;z-index:500;">
        <div style="padding:0.85rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:0.9rem;">الإشعارات</strong>
            <button onclick="markAllRead()" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:0.75rem;font-weight:600;">تعليم الكل</button>
        </div>
        <div id="notifList"></div>
    </div>
</div>
                <button class="btn btn-ghost btn-icon" onclick="toggleDark()" id="darkBtn" style="width:36px;height:36px;">🌙</button>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="view-nav">
            <a href="tasks.html">📋 قائمة</a>
            <a href="kanban.html">📌 أعمدة</a>
            <a href="gantt.html">📈 Gantt</a>
            <a href="calendar.html">📅 تقويم</a>
            <a href="reports.html" class="active">📉 إحصائيات</a>
        </div>

        <div class="toolbar">
            <span class="spacer"></span>
            <button onclick="loadReports()">🔄 تحديث</button>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>
        <div class="charts-row">
            <div class="card chart-card"><h3>📊 توزيع المهام حسب الحالة</h3><div class="bar-chart" id="barChart"></div></div>
            <div class="card chart-card"><h3>📁 ملخص المشاريع</h3><div id="projectsSummary"></div></div>
        </div>
    </main>

    <script src="js/components.js"></script>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = Nivora.apiBase;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }

        document.addEventListener('DOMContentLoaded', () => {
            const avatar = document.getElementById('topAvatar');
            const username = document.getElementById('topUsername');
            if (username) username.textContent = user.fullName || user.username || 'مستخدم';
            if (avatar) {
                if (user.avatar) avatar.innerHTML = `<img src="${safeImageUrl(user.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                else avatar.textContent = getInitials(user.fullName || user.username);
            }
        });

        async function loadProjects() {
            const res = await fetch(Nivora.url('/projects', null, true), { headers: { 'Authorization': `Bearer ${token}` } });
            const projects = await res.json();
            const sel = document.getElementById('projectFilter');
            sel.innerHTML = '<option value="">كل المشاريع</option>' + projects.map(p => `<option value="${p._id}">${escapeHtml(p.name)}</option>`).join('');
        }

        async function loadReports() {
            showSkeleton('kpiGrid', 'card', 4);
            document.getElementById('barChart').innerHTML = '<div class="skeleton" style="height:180px;width:100%;"></div>';
            document.getElementById('projectsSummary').innerHTML = '<div class="skeleton" style="height:200px;width:100%;"></div>';
            try {
                const pid = document.getElementById('projectFilter').value;
                const [tRes, pRes] = await Promise.all([
                    fetch(Nivora.url('/tasks', { projectId: pid }, true), { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(Nivora.url('/projects', null, true), { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                const tasks = await tRes.json();
                const projects = await pRes.json();
                renderKPIs(tasks);
                renderBarChart(tasks);
                renderProjectsSummary(projects, tasks);
            } catch (err) {
                showError('kpiGrid', 'تعذر تحميل البيانات', loadReports);
            }
        }

        function renderKPIs(tasks) {
            const total = tasks.length;
            const done = tasks.filter(t => t.status === 'done').length;
            const overdue = tasks.filter(t => t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done').length;
            const rate = total > 0 ? Math.round((done / total) * 100) : 0;
            const cards = [
                { icon: '📋', cls: 'blue', label: 'إجمالي المهام', value: total },
                { icon: '✅', cls: 'green', label: 'المهام المكتملة', value: done },
                { icon: '⏰', cls: 'red', label: 'المهام المتأخرة', value: overdue },
                { icon: '📈', cls: 'purple', label: 'نسبة الإنجاز', value: rate + '%' }
            ];
            document.getElementById('kpiGrid').innerHTML = cards.map(c => `
                <div class="card kpi-card">
                    <div class="kpi-icon ${c.cls}">${escapeHtml(c.icon)}</div>
                    <div class="kpi-info"><div class="kpi-label">${escapeHtml(c.label)}</div><div class="kpi-value">${c.value}</div></div>
                </div>`).join('');
        }

        function renderBarChart(tasks) {
            const statusCounts = {};
            tasks.forEach(t => { statusCounts[t.status] = (statusCounts[t.status] || 0) + 1; });
            const allStatuses = Object.entries(statusCounts);
            if (allStatuses.length === 0) {
                document.getElementById('barChart').innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>لا توجد بيانات للعرض</p></div>';
                return;
            }
            const statusLabels = { 'new': 'جديدة', 'in-progress': 'قيد التنفيذ', 'review': 'مراجعة', 'done': 'مكتملة', 'blocked': 'متعثرة', 'archived': 'مؤرشفة' };
            const statusColors = { 'new': '#3B82F6', 'in-progress': '#D97706', 'review': '#8B5CF6', 'done': '#22C55E', 'blocked': '#EF4444', 'archived': '#64748B' };
            const maxVal = Math.max(...allStatuses.map(([, c]) => c), 1);
            document.getElementById('barChart').innerHTML = allStatuses.map(([status, count]) => `
                <div class="bar-item">
                    <div class="bar-value">${count}</div>
                    <div class="bar" style="height:${(count / maxVal) * 150}px;background:${statusColors[status] || '#94A3B8'};"></div>
                    <div class="bar-label">${statusLabels[status] || status}</div>
                </div>`).join('');
        }

        function renderProjectsSummary(projects, tasks) {
            if (projects.length === 0) {
                document.getElementById('projectsSummary').innerHTML = '<div class="empty-state"><div class="empty-icon">📁</div><p>لا توجد مشاريع</p></div>';
                return;
            }
            const summary = projects.map(p => {
                const pTasks = tasks.filter(t => t.projectId === p._id);
                const total = pTasks.length;
                const done = pTasks.filter(t => t.status === 'done').length;
                const rate = total > 0 ? Math.round((done / total) * 100) : 0;
                const statusBadge = p.status === 'completed' ? 'badge-success' : p.status === 'archived' ? 'badge-neutral' : 'badge-success';
                const statusText = p.status === 'completed' ? 'مكتمل' : p.status === 'archived' ? 'مؤرشف' : 'نشط';
                const progressColor = rate >= 70 ? 'var(--success)' : rate >= 40 ? 'var(--primary)' : 'var(--warning)';
                return { ...p, total, done, rate, statusBadge, statusText, progressColor };
            });
            document.getElementById('projectsSummary').innerHTML = `
                <table class="projects-table">
                    <thead><tr><th>المشروع</th><th>المهام</th><th>مكتملة</th><th>نسبة الإنجاز</th><th>الحالة</th></tr></thead>
                    <tbody>${summary.map(s => `
                        <tr>
                            <td><strong>${escapeHtml(s.name)}</strong></td>
                            <td>${s.total}</td>
                            <td>${s.done}</td>
                            <td><div style="display:flex;align-items:center;gap:0.5rem;"><div class="progress-bar"><div class="progress-fill" style="width:${s.rate}%;background:${s.progressColor};"></div></div><span style="font-size:0.8rem;font-weight:600;">${s.rate}%</span></div></td>
                            <td><span class="badge ${s.statusBadge}">${s.statusText}</span></td>
                        </tr>`).join('')}</tbody>
                </table>`;
        }
// ========== نظام الإشعارات ==========
let notifications = [];

async function loadNotifications() {
    try {
        const res = await fetch(`${API_BASE}/notifications?limit=100`, { headers: { 'Authorization': `Bearer ${token}` } });
        const response = await res.json();
        // ✅ التعامل مع paginatedResponse
        notifications = response.data || response.notifications || response;
        renderNotifications();
        updateNotifBadge();
    } catch (err) {}
}

function renderNotifications() {
    const container = document.getElementById('notifList');
    if (!notifications.length) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">لا توجد إشعارات</p>';
        return;
    }
    container.innerHTML = notifications.slice(0, 20).map(n => `
        <div style="padding:0.75rem 1rem;border-bottom:1px solid var(--border-light);cursor:pointer;${n.isRead ? '' : 'background:var(--primary-light);'}" onclick="readNotification('${n._id}')">
            <div style="font-size:0.85rem;font-weight:600;">${escapeHtml(n.message)}</div>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.2rem;">${timeAgo(n.createdAt)}</div>
        </div>
    `).join('');
}

function updateNotifBadge() {
    const unread = notifications.filter(n => !n.isRead).length;
    const badge = document.getElementById('notifBadge');
    if (badge) {
        if (unread > 0) {
            badge.textContent = unread > 9 ? '9+' : unread;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }
}

function toggleNotifications() {
    const dd = document.getElementById('notifDropdown');
    if (!dd) return;
    const isVisible = dd.style.display === 'block';
    dd.style.display = isVisible ? 'none' : 'block';
    if (!isVisible) loadNotifications();
}

async function readNotification(id) {
    await fetch(`${API_BASE}/notifications/${id}/read`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } });
    loadNotifications();
}

async function markAllRead() {
    await fetch(`${API_BASE}/notifications/read-all`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } });
    loadNotifications();
}

// إغلاق الـ Dropdown عند النقر خارجه
document.addEventListener('click', function(e) {
    const dd = document.getElementById('notifDropdown');
    const btn = document.getElementById('notifBtn');
    if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) {
        dd.style.display = 'none';
    }
});

// تحميل الإشعارات عند فتح الصفحة
loadNotifications();
        loadProjects().then(() => loadReports());
    </script>
</body>
</html>
