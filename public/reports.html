<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | التقارير</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .page-desc { font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .view-nav { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 0.75rem; overflow-x: auto; }
        .view-nav a { padding: 0.5rem 0.85rem; font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
        .view-nav a:hover { color: var(--primary); }
        .view-nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .toolbar select { height: 34px; border-radius: 8px; border: 1px solid var(--border); padding: 0 0.5rem; font-family: inherit; font-size: 0.8rem; background: var(--card); color: var(--text); }
        .toolbar button { height: 34px; border-radius: 8px; border: 1px solid var(--border); padding: 0 0.6rem; font-family: inherit; font-size: 0.8rem; background: var(--card); color: var(--text); cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.25rem; }
        .toolbar button:hover { background: #F1F5F9; }
        .spacer { flex: 1; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .kpi-card { padding: 1.5rem; border-radius: 14px; display: flex; align-items: center; gap: 1rem; transition: transform 0.15s; }
        .kpi-card:hover { transform: translateY(-2px); }
        .kpi-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .kpi-icon.blue { background: #EFF6FF; color: #2563EB; }
        .kpi-icon.green { background: #DCFCE7; color: #16A34A; }
        .kpi-icon.red { background: #FEE2E2; color: #DC2626; }
        .kpi-icon.purple { background: #F5F3FF; color: #7C3AED; }
        .kpi-info { flex: 1; }
        .kpi-label { font-size: 0.78rem; font-weight: 600; color: var(--text-light); margin-bottom: 0.2rem; }
        .kpi-value { font-size: 2rem; font-weight: 800; line-height: 1; }

        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .chart-card { padding: 1.5rem; }
        .chart-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; }
        .bar-chart { display: flex; align-items: flex-end; gap: 0.75rem; height: 180px; padding-top: 0.5rem; }
        .bar-item { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
        .bar-value { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.35rem; }
        .bar { width: 100%; max-width: 56px; border-radius: 6px 6px 0 0; transition: height 0.5s ease; position: relative; min-height: 4px; }
        .bar-label { font-size: 0.7rem; color: var(--text-light); margin-top: 0.4rem; font-weight: 500; }

        .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; flex: 1; min-width: 60px; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

        .projects-table { width: 100%; border-collapse: collapse; }
        .projects-table th, .projects-table td { padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; text-align: right; }
        .projects-table th { color: var(--text-light); font-weight: 700; font-size: 0.75rem; background: #F8FAFC; white-space: nowrap; }
        body.dark .projects-table th { background: #0F172A; }
        .projects-table tbody tr { transition: background 0.1s; }
        .projects-table tbody tr:hover { background: #F8FAFC; }
        body.dark .projects-table tbody tr:hover { background: #1A2332; }
        .badge-status { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 10px; font-weight: 600; white-space: nowrap; }
        .badge-active { background: #DCFCE7; color: #16A34A; }
        .badge-completed { background: #EFF6FF; color: #2563EB; }
        .badge-archived { background: #F1F5F9; color: #64748B; }

        .skeleton { background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        body.dark .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-light); }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .error-state { text-align: center; padding: 2rem; color: #DC2626; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #16A34A; color: #fff; padding: 0.75rem 1.5rem; border-radius: 12px; z-index: 9999; font-weight: 600; font-size: 0.9rem; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } .kpi-grid { grid-template-columns: repeat(2, 1fr); } .charts-row { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 0.75rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; } .kpi-card { padding: 1rem; gap: 0.5rem; } .kpi-icon { width: 36px; height: 36px; font-size: 1.1rem; border-radius: 8px; } .kpi-value { font-size: 1.5rem; } .projects-table { font-size: 0.7rem; } .projects-table th:nth-child(4), .projects-table td:nth-child(4) { display: none; } }
    </style>
</head>
<body>

                <h1>📊 التقارير</h1>
                <p class="page-desc">نظرة شاملة على أداء المشاريع والمهام</p>
            </div>
            <div style="display:flex;gap:0.5rem;">
                <!-- أيقونة المستخدم في الـ Topbar -->
<div style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;" onclick="window.location.href='profile.html'">
    <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#64748B;overflow:hidden;"></div>
    <span id="topUsername" style="font-size:0.8rem;font-weight:600;"></span>
</div>
                <select id="projectFilter" onchange="loadReports()" style="height:36px;border-radius:8px;border:1px solid var(--border);padding:0 0.5rem;font-family:inherit;font-size:0.8rem;background:var(--card);color:var(--text);"><option value="">كل المشاريع</option></select>
                <button class="btn btn-outline" onclick="toggleLang()" id="langBtn" style="height:36px;">🌐 EN</button>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" onclick="logout()" style="height:36px;">خروج</button>
            </div>
        </div>
        <div class="view-nav">
            <a href="tasks.html">📋 قائمة</a><a href="kanban.html">📌 أعمدة</a><a href="tasks.html">📊 جدول</a><a href="gantt.html">📈 Gantt</a><a href="calendar.html">📅 تقويم</a><a href="reports.html" class="active">📉 إحصائيات</a><a href="chat.html">💬 محادثة</a>
        </div>
        <div class="toolbar">
            <span class="spacer"></span>
            <button onclick="loadReports()">🔄 تحديث</button>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>
        <div class="charts-row">
            <div class="card chart-card"><h3>📊 توزيع المهام حسب الحالة</h3><div class="bar-chart" id="barChart"></div></div>
            <div class="card chart-card"><h3>📁 ملخص المشاريع</h3><div id="projectsSummary"></div></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

        function showSkeleton() {
            document.getElementById('kpiGrid').innerHTML = Array(4).fill('<div class="card kpi-card"><div class="kpi-icon skeleton" style="width:50px;height:50px;"></div><div class="kpi-info"><div class="skeleton" style="height:12px;width:60%;margin-bottom:6px;"></div><div class="skeleton" style="height:28px;width:40%;"></div></div></div>').join('');
            document.getElementById('barChart').innerHTML = '<div class="skeleton" style="height:180px;width:100%;"></div>';
            document.getElementById('projectsSummary').innerHTML = '<div class="skeleton" style="height:200px;width:100%;"></div>';
        }

        async function loadProjects() {
            const res = await fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } });
            const projects = await res.json();
            const sel = document.getElementById('projectFilter');
            sel.innerHTML = '<option value="">كل المشاريع</option>' + projects.map(p => `<option value="${p._id}">${p.name}</option>`).join('');
        }

        async function loadReports() {
            showSkeleton();
            try {
                const pid = document.getElementById('projectFilter').value;
                const [tRes, pRes] = await Promise.all([
                    fetch(`${API_BASE}/tasks${pid ? '?projectId=' + pid : ''}`, { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } })
                ]);
                const tasks = await tRes.json();
                const projects = await pRes.json();

                renderKPIs(tasks);
                renderBarChart(tasks);
                renderProjectsSummary(projects, tasks);
            } catch (err) {
                document.getElementById('kpiGrid').innerHTML = '<div class="error-state">❌ تعذر تحميل البيانات</div>';
            }
        }

        function renderKPIs(tasks) {
            const total = tasks.length;
            const done = tasks.filter(t => t.status === 'done').length;
            const overdue = tasks.filter(t => t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done').length;
            const rate = total > 0 ? Math.round((done / total) * 100) : 0;

            const cards = [
                { icon: '📋', cls: 'blue', label: 'إجمالي المهام', value: total },
                { icon: '✅', cls: 'green', label: 'المهام المكتملة', value: done },
                { icon: '⏰', cls: 'red', label: 'المهام المتأخرة', value: overdue },
                { icon: '📈', cls: 'purple', label: 'نسبة الإنجاز', value: rate + '%' }
            ];

            document.getElementById('kpiGrid').innerHTML = cards.map(c => `
                <div class="card kpi-card">
                    <div class="kpi-icon ${c.cls}">${c.icon}</div>
                    <div class="kpi-info">
                        <div class="kpi-label">${c.label}</div>
                        <div class="kpi-value" style="color:${c.cls === 'blue' ? '#2563EB' : c.cls === 'green' ? '#16A34A' : c.cls === 'red' ? '#DC2626' : '#7C3AED'}">${c.value}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderBarChart(tasks) {
            // استخدام جميع الحالات الموجودة فعليًا
            const statusCounts = {};
            tasks.forEach(t => { statusCounts[t.status] = (statusCounts[t.status] || 0) + 1; });
            const allStatuses = Object.entries(statusCounts);
            
            if (allStatuses.length === 0) {
                document.getElementById('barChart').innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>لا توجد بيانات للعرض</p></div>';
                return;
            }

            const statusLabels = { 'new': 'جديدة', 'in-progress': 'قيد التنفيذ', 'review': 'مراجعة', 'done': 'مكتملة', 'blocked': 'متعثرة', 'archived': 'مؤرشفة' };
            const statusColors = { 'new': '#3B82F6', 'in-progress': '#D97706', 'review': '#8B5CF6', 'done': '#22C55E', 'blocked': '#EF4444', 'archived': '#64748B' };
            const maxVal = Math.max(...allStatuses.map(([, c]) => c), 1);

            document.getElementById('barChart').innerHTML = allStatuses.map(([status, count]) => `
                <div class="bar-item">
                    <div class="bar-value">${count}</div>
                    <div class="bar" style="height:${(count / maxVal) * 150}px;background:${statusColors[status] || '#94A3B8'};"></div>
                    <div class="bar-label">${statusLabels[status] || status}</div>
                </div>
            `).join('');
        }

        function renderProjectsSummary(projects, tasks) {
            if (projects.length === 0) {
                document.getElementById('projectsSummary').innerHTML = '<div class="empty-state"><div class="icon">📁</div><p>لا توجد مشاريع</p></div>';
                return;
            }

            const summary = projects.map(p => {
                const pTasks = tasks.filter(t => t.projectId === p._id);
                const total = pTasks.length;
                const done = pTasks.filter(t => t.status === 'done').length;
                const rate = total > 0 ? Math.round((done / total) * 100) : 0;
                const statusBadge = p.status === 'completed' ? 'badge-completed' : p.status === 'archived' ? 'badge-archived' : 'badge-active';
                const statusText = p.status === 'completed' ? '✅ مكتمل' : p.status === 'archived' ? '📦 مؤرشف' : '🟢 نشط';
                const progressColor = rate >= 70 ? '#22C55E' : rate >= 40 ? '#2563EB' : '#D97706';
                
                return { ...p, total, done, rate, statusBadge, statusText, progressColor };
            });

            document.getElementById('projectsSummary').innerHTML = `
                <table class="projects-table">
                    <thead><tr><th>المشروع</th><th>المهام</th><th>مكتملة</th><th>نسبة الإنجاز</th><th>الحالة</th></tr></thead>
                    <tbody>${summary.map(s => `
                        <tr>
                            <td><strong>${s.name}</strong></td>
                            <td>${s.total}</td>
                            <td>${s.done}</td>
                            <td>
                                <div style="display:flex;align-items:center;gap:0.5rem;">
                                    <div class="progress-bar"><div class="progress-fill" style="width:${s.rate}%;background:${s.progressColor};"></div></div>
                                    <span style="font-size:0.8rem;font-weight:600;">${s.rate}%</span>
                                </div>
                            </td>
                            <td><span class="badge-status ${s.statusBadge}">${s.statusText}</span></td>
                        </tr>
                    `).join('')}</tbody>
                </table>`;
        }
document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const avatar = document.getElementById('topAvatar');
    const username = document.getElementById('topUsername');
    
    if (username) {
        username.textContent = user.fullName || user.username || 'مستخدم';
    }
    
    if (avatar) {
        if (user.avatar) {
            avatar.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        } else {
            avatar.textContent = (user.fullName || user.username || 'م')[0];
        }
    }
});
        loadProjects().then(() => loadReports());
    </script>
