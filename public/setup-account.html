<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إنشاء حساب</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .container { width: 100%; max-width: 440px; }
        .back { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--card); padding: 0.5rem 1rem; border-radius: var(--radius-full); color: var(--text-light); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .card { background: var(--card); border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .card h1 { text-align: center; font-size: 1.3rem; margin-bottom: 0.3rem; }
        .card .sub { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .google-btn { width: 100%; height: 46px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; font-weight: 600; color: var(--text); margin-bottom: 1rem; }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="container">
        <a href="workspace.html" class="back">← رجوع</a>
        <div class="card">
            <h1>إنشاء حساب</h1>
            <p class="sub">أنشئ حسابك للبدء</p>
            <button class="google-btn" onclick="location.href='https://nivora-t9ov.onrender.com/api/auth/google'"><span style="font-weight:700;color:#4285F4;">G</span> المتابعة بـ Google</button>
            <div class="divider">أو</div>
            <div class="form-group"><input type="text" class="input" id="fullName" placeholder="الاسم الكامل"></div>
            <div class="form-group"><input type="email" class="input" id="email" placeholder="البريد الإلكتروني"></div>
            <div class="form-group"><input type="password" class="input" id="pass" placeholder="كلمة المرور"></div>
            <div class="form-group"><input type="password" class="input" id="passConfirm" placeholder="تأكيد كلمة المرور"></div>
            <button class="btn btn-primary btn-block" id="nextBtn" onclick="nextStep()">التالي</button>
        </div>
    </div>
    <script src="js/components.js"></script>
    <script>
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        async function nextStep() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value;
            const confirm = document.getElementById('passConfirm').value;
            if (!fullName || !email || !pass) { showToast('جميع الحقول مطلوبة', 'warning'); return; }
            if (pass !== confirm) { showToast('غير متطابقتين', 'warning'); return; }
            if (pass.length < 8) { showToast('8 أحرف على الأقل', 'warning'); return; }
            const btn = document.getElementById('nextBtn'); setButtonLoading(btn, true, 'جاري...');
            try {
                const res = await fetch('https://nivora-t9ov.onrender.com/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: email, password: pass, fullName }) });
                if (res.ok) {
                    const loginRes = await fetch('https://nivora-t9ov.onrender.com/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: email, password: pass }) });
                    const loginData = await loginRes.json();
                    if (loginRes.ok) { localStorage.setItem('token', loginData.token); localStorage.setItem('user', JSON.stringify(loginData.user)); window.location.href = 'setup-team.html'; }
                } else { const d = await res.json(); showToast(d.error, 'error'); }
            } catch (err) { showToast('خطأ', 'error'); }
            setButtonLoading(btn, false);
        }
    </script>
</body>
</html>
