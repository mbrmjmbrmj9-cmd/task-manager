<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مهامي</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========== CSS Variables ========== */
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --primary: #6C63FF;
            --secondary: #FF6584;
            --text: #e2e8f0;
            --text-light: #a0aec0;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* ========== Reset ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== Body ========== */
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        /* ========== Container ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ========== Header ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            color: white;
        }

        .header span {
            color: var(--primary);
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* ========== Stats Grid ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .stat-card .label {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .stat-card.users .number {
            color: var(--primary);
        }

        .stat-card.tasks .number {
            color: var(--warning);
        }

        .stat-card.completed .number {
            color: var(--success);
        }

        .stat-card.today .number {
            color: var(--secondary);
        }

        /* ========== Tables Section ========== */
        .tables {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .tables {
                grid-template-columns: 1fr;
            }
        }

        .table-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-card h2 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        /* ========== Table ========== */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.7rem 0.5rem;
            text-align: right;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-light);
            font-weight: 600;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.8rem;
        }

        /* ========== Login Card ========== */
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            background: var(--card);
            padding: 2rem;
            border-radius: var(--radius);
            text-align: center;
        }

        .login-card h1 {
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .login-card input {
            width: 100%;
            padding: 0.9rem;
            margin-bottom: 1rem;
            border-radius: 2rem;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
        }

        .login-card .btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
        }

        .login-card .btn:hover {
            background: #5a52d5;
        }

        /* ========== Error Message ========== */
        .error {
            color: #ef4444;
            margin-bottom: 1rem;
            display: none;
        }

        /* ========== Utilities ========== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ========== Login Section ========== -->
    <div id="loginSection" class="login-card">
        <h1>🔐 لوحة التحكم</h1>
        <p>الدخول مقصور على المدير</p>
        <div class="error" id="loginError">بيانات غير صحيحة</div>
        <input type="text" id="adminUsername" placeholder="اسم المستخدم" autocomplete="off">
        <input type="password" id="adminPassword" placeholder="كلمة المرور">
        <button class="btn" id="adminLoginBtn">دخول</button>
    </div>

    <!-- ========== Dashboard Section ========== -->
    <div id="dashboardSection" class="container hidden">
        <!-- Header -->
        <div class="header">
            <h1>📊 لوحة <span>التحكم</span></h1>
            <button class="logout-btn" id="adminLogoutBtn">تسجيل خروج</button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card users">
                <div class="icon">👥</div>
                <div class="number" id="totalUsers">0</div>
                <div class="label">مستخدم مسجل</div>
            </div>
            <div class="stat-card tasks">
                <div class="icon">📋</div>
                <div class="number" id="totalTasks">0</div>
                <div class="label">إجمالي المهام</div>
            </div>
            <div class="stat-card completed">
                <div class="icon">✅</div>
                <div class="number" id="completedTasks">0</div>
                <div class="label">مهمة مكتملة</div>
            </div>
            <div class="stat-card today">
                <div class="icon">🆕</div>
                <div class="number" id="usersToday">0</div>
                <div class="label">مستخدم جديد اليوم</div>
            </div>
        </div>

        <!-- Tables -->
        <div class="tables">
            <!-- Users Table -->
            <div class="table-card">
                <h2>👤 المستخدمون</h2>
                <table>
                    <thead>
                        <tr>
                            <th>المستخدم</th>
                            <th>المهام</th>
                            <th>تاريخ التسجيل</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>

            <!-- Recent Tasks Table -->
            <div class="table-card">
                <h2>🕒 آخر المهام</h2>
                <table>
                    <thead>
                        <tr>
                            <th>النص</th>
                            <th>الحالة</th>
                            <th>التصنيف</th>
                        </tr>
                    </thead>
                    <tbody id="recentTasksTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script>
        // ========== Configuration ==========
        const API_BASE = 'https://task-manager-production-6c02.up.railway.app/api';
        let adminToken = localStorage.getItem('adminToken');

        // ========== Auth Check ==========
        if (adminToken) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadStats();
        }

        // ========== Admin Login ==========
        document.getElementById('adminLoginBtn').addEventListener('click', async () => {
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadStats();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (err) {
                console.error('Login Error:', err);
                document.getElementById('loginError').textContent = 'تعذر الاتصال بالخادم';
                document.getElementById('loginError').style.display = 'block';
            }
        });

        // ========== Admin Logout ==========
        document.getElementById('adminLogoutBtn').addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            location.reload();
        });

        // ========== Load Stats ==========
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('adminToken');
                    location.reload();
                    return;
                }

                const data = await res.json();

                // Update stats cards
                document.getElementById('totalUsers').textContent = data.totalUsers;
                document.getElementById('totalTasks').textContent = data.totalTasks;
                document.getElementById('completedTasks').textContent = data.completedTasks;
                document.getElementById('usersToday').textContent = data.usersToday;

                // Update users table
                const usersTable = document.getElementById('usersTable');
                usersTable.innerHTML = data.users.map(u => `
                    <tr>
                        <td>${u.username}</td>
                        <td><span class="badge">${u.taskCount}</span></td>
                        <td>${new Date(u.createdAt).toLocaleDateString('ar-SA')}</td>
                    </tr>
                `).join('');

                // Update recent tasks table
                const recentTable = document.getElementById('recentTasksTable');
                recentTable.innerHTML = data.recentTasks.map(t => `
                    <tr>
                        <td>${t.text.substring(0, 30)}${t.text.length > 30 ? '...' : ''}</td>
                        <td>${t.completed ? '✅' : '⏳'}</td>
                        <td>${t.category || 'عادي'}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error('Stats Error:', err);
            }
        }
    </script>

</body>
</html>
