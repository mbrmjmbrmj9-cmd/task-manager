<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مهامي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: #1a1a2e; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #16213e; padding: 2rem; border-radius: 16px; width: 400px; text-align: center; }
    input { width: 100%; padding: 0.9rem; margin-bottom: 1rem; border-radius: 2rem; border: none; background: rgba(255,255,255,0.1); color: white; font-family: inherit; }
    button { width: 100%; padding: 0.9rem; background: #6C63FF; color: white; border: none; border-radius: 2rem; cursor: pointer; font-family: inherit; font-weight: 700; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loginBox" class="card">
    <h1>🔐 لوحة التحكم</h1>
    <p style="color:#a0aec0;margin-bottom:1rem;">admin / Admin@2025</p>
    <div id="errorMsg" style="color:#ef4444;display:none;margin-bottom:1rem;">بيانات غير صحيحة</div>
    <input type="text" id="user" placeholder="اسم المستخدم">
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
  </div>

  <div id="dashBox" class="card hidden" style="width:600px;">
    <h1>📊 لوحة التحكم</h1>
    <p>مرحباً مدير!</p>
    <p id="stats" style="margin:1rem 0;color:#a0aec0;">جاري التحميل...</p>
    <button onclick="logout()" style="background:#ef4444;margin-top:1rem;">تسجيل خروج</button>
  </div>

  <script>
    const API = 'https://task-manager-production-d3cf.up.railway.app/api';
    let adminToken = localStorage.getItem('adminToken');

    async function login() {
      const u = document.getElementById('user').value;
      const p = document.getElementById('pass').value;
      try {
        const res = await fetch(`${API}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('adminToken', data.token);
          adminToken = data.token;
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('dashBox').classList.remove('hidden');
          loadStats();
        } else {
          document.getElementById('errorMsg').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('errorMsg').textContent = 'تعذر الاتصال';
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await res.json();
        document.getElementById('stats').textContent = `المستخدمين: ${data.totalUsers} | المهام: ${data.totalTasks} | المكتملة: ${data.completedTasks}`;
      } catch (err) {
        document.getElementById('stats').textContent = 'تعذر تحميل الإحصائيات';
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    // إذا كان التوكن موجود، اعرض لوحة التحكم مباشرة
    if (adminToken) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashBox').classList.remove('hidden');
      loadStats();
    }
  </script>
</body>
</html>
