<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مهامي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a2e; --card: #16213e; --primary: #6C63FF; --secondary: #FF6584;
      --text: #e2e8f0; --text-light: #a0aec0; --success: #10b981; --warning: #f59e0b;
      --radius: 16px; --shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .header h1 { font-size: 2rem; color: white; }
    .header span { color: var(--primary); }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 2rem; cursor: pointer; font-family: inherit; font-weight: 700; }
    .logout-btn:hover { background: #dc2626; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
    .stat-card { background: var(--card); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.05); }
    .stat-card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .stat-card .number { font-size: 2.5rem; font-weight: 800; }
    .stat-card .label { color: var(--text-light); font-size: 0.9rem; }
    .stat-card.users .number { color: var(--primary); }
    .stat-card.tasks .number { color: var(--warning); }
    .stat-card.completed .number { color: var(--success); }
    .stat-card.today .number { color: var(--secondary); }
    .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .tables { grid-template-columns: 1fr; } }
    .table-card { background: var(--card); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.05); }
    .table-card h2 { margin-bottom: 1rem; font-size: 1.2rem; color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.7rem 0.5rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
    th { color: var(--text-light); font-weight: 600; }
    .badge { background: var(--primary); color: white; padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.8rem; }
    .hidden { display: none !important; }
    .login-card { max-width: 400px; margin: 100px auto; background: var(--card); padding: 2rem; border-radius: var(--radius); text-align: center; }
    .login-card h1 { margin-bottom: 0.5rem; }
    .login-card p { color: var(--text-light); margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 0.9rem; margin-bottom: 1rem; border-radius: 2rem; border: none; background: rgba(255,255,255,0.1); color: white; font-family: inherit; }
    .login-card .btn { width: 100%; padding: 0.9rem; background: var(--primary); color: white; border: none; border-radius: 2rem; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 1rem; }
    .login-card .btn:hover { background: #5a52d5; }
    .error { color: #ef4444; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="loginBox" class="login-card">
    <h1>🔐 لوحة التحكم</h1>
   <!-- <p>admin / Admin@2025</p>-->
    <div class="error" id="errorMsg">بيانات غير صحيحة</div>
    <input type="text" id="user" placeholder="اسم المستخدم">
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button class="btn" onclick="login()">دخول</button>
  </div>

  <!-- لوحة التحكم -->
  <div id="dashBox" class="container hidden">
    <div class="header">
      <h1>📊 لوحة <span>التحكم</span></h1>
      <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card users"><div class="icon">👥</div><div class="number" id="totalUsers">0</div><div class="label">مستخدم مسجل</div></div>
      <div class="stat-card tasks"><div class="icon">📋</div><div class="number" id="totalTasks">0</div><div class="label">إجمالي المهام</div></div>
      <div class="stat-card completed"><div class="icon">✅</div><div class="number" id="completedTasks">0</div><div class="label">مهمة مكتملة</div></div>
      <div class="stat-card today"><div class="icon">🆕</div><div class="number" id="usersToday">0</div><div class="label">مستخدم جديد اليوم</div></div>
    </div>
    <div class="tables">
      <div class="table-card">
        <h2>👤 المستخدمون</h2>
        <table><thead><tr><th>المستخدم</th><th>المهام</th><th>تاريخ التسجيل</th></tr></thead><tbody id="usersTable"></tbody></table>
      </div>
      <div class="table-card">
        <h2>🕒 آخر المهام</h2>
        <table><thead><tr><th>النص</th><th>الحالة</th><th>التصنيف</th></tr></thead><tbody id="recentTasksTable"></tbody></table>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://task-manager-production-d3cf.up.railway.app/api';
    let adminToken = localStorage.getItem('adminToken');

    async function login() {
      const u = document.getElementById('user').value;
      const p = document.getElementById('pass').value;
      try {
        const res = await fetch(`${API}/admin/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('adminToken', data.token);
          adminToken = data.token;
          document.getElementById('loginBox').classList.add('hidden');
          document.getElementById('dashBox').classList.remove('hidden');
          loadStats();
        } else {
          document.getElementById('errorMsg').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('errorMsg').textContent = 'تعذر الاتصال';
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await res.json();
        document.getElementById('totalUsers').textContent = data.totalUsers;
        document.getElementById('totalTasks').textContent = data.totalTasks;
        document.getElementById('completedTasks').textContent = data.completedTasks;
        document.getElementById('usersToday').textContent = data.usersToday;

        document.getElementById('usersTable').innerHTML = data.users.map(u => `
          <tr><td>${u.username}</td><td><span class="badge">${u.taskCount}</span></td><td>${new Date(u.createdAt).toLocaleDateString('ar-SA')}</td></tr>
        `).join('');

        document.getElementById('recentTasksTable').innerHTML = data.recentTasks.map(t => `
          <tr><td>${t.text.substring(0, 30)}${t.text.length > 30 ? '...' : ''}</td><td>${t.completed ? '✅' : '⏳'}</td><td>${t.category || 'عادي'}</td></tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    if (adminToken) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashBox').classList.remove('hidden');
      loadStats();
    }
  </script>
<footer style="text-align:center;padding:1rem;color:var(--text-light);font-size:0.85rem;opacity:0.6;">
  <p>© 2026 مهامي | تطوير: <strong>عبدالرقيب الخالدي</strong></p>
</footer>
</body>
</html>
