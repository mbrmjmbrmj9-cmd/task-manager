<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Nivora | إعدادات مساحة العمل</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <script>if (!localStorage.getItem('token')) location.replace('login.html');</script>
    <script src="js/config.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/workspace-settings.js" defer></script>
</head>
<body class="workspace-shell" data-ui="app">
    <main class="workspace-content">
        <nav class="breadcrumb" aria-label="مسار الصفحة">
            <a href="settings.html">الإعدادات</a>
            <a href="teams.html">فرق العمل</a>
        </nav>
        <header class="topbar"><div><h1>إعدادات مساحة العمل</h1><p class="page-desc" id="workspaceName" hidden></p></div></header>
        <p id="workspaceStatus" class="workspace-status" role="status">جارٍ تحميل مساحة العمل…</p>
        <button id="reloadWorkspace" class="workspace-button" type="button" hidden>إعادة المحاولة</button>
        <div id="workspacePanels" class="settings-layout" hidden>
            <section class="workspace-panel settings-panel" aria-labelledby="workspaceInfo">
                <h2 id="workspaceInfo">معلومات مساحة العمل</h2>
                <form id="workspaceForm" class="settings-form" method="post">
                    <label class="workspace-label">اسم الفريق
                        <input class="workspace-input" id="wsName" name="name" maxlength="120" required readonly>
                    </label>
                    <div><button id="saveWorkspace" class="workspace-button primary" type="submit" hidden>حفظ الاسم</button></div>
                </form>
                <div id="inviteSettings" class="settings-action-row" hidden>
                    <bdi id="inviteCode"></bdi>
                    <button id="rotateInvite" class="workspace-button" type="button">تغيير رمز الدعوة</button>
                </div>
            </section>
            <section class="workspace-panel settings-panel" aria-labelledby="usageHeading">
                <h2 id="usageHeading">الخطة وحدود الاستخدام</h2>
                <dl class="settings-details">
                    <div><dt>الخطة</dt><dd id="planName"></dd></div>
                    <div><dt>الأعضاء</dt><dd id="memberUsage"></dd></div>
                    <div><dt>المشاريع</dt><dd id="projectUsage"></dd></div>
                </dl>
                <a class="workspace-button" href="plans.html">عرض الخطط</a>
            </section>
            <section id="ownershipPanel" class="workspace-panel settings-panel" aria-labelledby="ownerHeading" hidden>
                <h2 id="ownerHeading">نقل الملكية</h2>
                <form id="transferForm" class="settings-form" method="post">
                    <label class="workspace-label">المالك الجديد
                        <select class="workspace-input" id="newOwner" required></select>
                    </label>
                    <div><button id="transferOwnership" class="workspace-button" type="submit">نقل الملكية</button></div>
                </form>
                <p id="membersStatus" role="status"></p>
            </section>
            <section id="archivePanel" class="workspace-panel settings-panel" aria-labelledby="archiveHeading" hidden>
                <h2 id="archiveHeading">أرشفة الفريق</h2>
                <p>تخفي الأرشفة مساحة العمل من الفرق النشطة. يمكن للمالك استعادتها من صفحة فرق العمل.</p>
                <div class="settings-action-row"><button class="workspace-button" id="archiveWorkspace" type="button">أرشفة مساحة العمل</button></div>
            </section>
        </div>
    </main>
</body>
</html>
