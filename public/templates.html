<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | القوالب</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; min-height: 100vh; background: var(--bg); }
        .sidebar { width: 240px; background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .template-card { padding: 1.5rem; cursor: pointer; transition: all 0.2s; }
        .template-card:hover { box-shadow: var(--shadow-md); }
        .template-card h3 { margin-bottom: 0.5rem; }
        .template-card .count { color: var(--text-light); font-size: 0.85rem; }
        .template-card .btn-sm { height: 32px; font-size: 0.8rem; margin-top: 0.75rem; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">📋 Nivora</div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>لوحة القيادة</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>المهام</a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>المشاريع</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>Gantt</a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>التقويم</a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>التقارير</a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>Workflows</a>
        <a href="templates.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>القوالب</a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>الأرشيف</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>الفريق</a>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>📄 القوالب</h1>
            <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-outline" onclick="toggleLang()" id="langBtn" style="height:36px;">🌐 EN</button>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-primary" onclick="saveCurrentTasks()">💾 حفظ المهام الحالية كقالب</button>
                <button class="btn btn-outline" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="grid" id="templateGrid"></div>
    </main>

    <script>
        const API = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        if (typeof currentLang !== 'undefined') { document.getElementById('langBtn').innerHTML = currentLang === 'ar' ? '🌐 EN' : '🌐 AR'; }

        function showToast(msg) { const div = document.createElement('div'); div.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22C55E;color:white;padding:0.75rem 1.5rem;border-radius:12px;z-index:9999;'; div.textContent = msg; document.body.appendChild(div); setTimeout(() => div.remove(), 3000); }

        async function loadTemplates() { const res = await fetch(`${API}/templates`, { headers: { 'Authorization': `Bearer ${token}` } }); const templates = await res.json(); document.getElementById('templateGrid').innerHTML = templates.map(t => `<div class="card template-card"><h3>${t.name}</h3><div class="count">${t.tasks.length} مهام</div><button class="btn btn-primary btn-sm" onclick="applyTemplate('${t._id}')">📋 تطبيق</button><button class="btn btn-outline btn-sm" onclick="deleteTemplate('${t._id}')">🗑️</button></div>`).join('') || '<p style="color:var(--text-light);">لا توجد قوالب. احفظ مهامك الحالية كقالب.</p>'; }
        async function saveCurrentTasks() { const name = prompt('اسم القالب:'); if (!name) return; const res = await fetch(`${API}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }); const tasks = await res.json(); if (tasks.length === 0) return alert('لا توجد مهام لحفظها'); await fetch(`${API}/templates`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ name, tasks }) }); loadTemplates(); showToast('✅ تم حفظ القالب'); }
        async function applyTemplate(id) { const res = await fetch(`${API}/templates/${id}/apply`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); if (res.ok) { showToast('✅ تم تطبيق القالب'); window.location.href = 'tasks.html'; } }
        async function deleteTemplate(id) { if (!confirm('حذف القالب؟')) return; await fetch(`${API}/templates/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadTemplates(); }

        loadTemplates();
    </script>
</body>
</html>
