<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المهام</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .add-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .task-table { width: 100%; border-collapse: collapse; }
        .task-table th, .task-table td { padding: 0.75rem 1rem; text-align: right; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .task-table th { color: var(--text-light); font-weight: 600; font-size: 0.8rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-new { background: #EFF6FF; color: #2563EB; }
        .badge-done { background: #F0FDF4; color: #22C55E; }
        .badge-progress { background: #FFF7ED; color: #F97316; }
        .badge-review { background: #F5F3FF; color: #7C3AED; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--card); border-radius: 16px; padding: 2rem; width: 100%; max-width: 560px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .modal h2 { margin-bottom: 1.5rem; font-size: 1.2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--text-light); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .modal-buttons { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
        textarea.input { height: auto; padding: 0.75rem; }
        .recurring-badge { display: inline-block; background: #FEF3C7; color: #92400E; padding: 0.1rem 0.4rem; border-radius: 10px; font-size: 0.65rem; margin-right: 0.3rem; }
        .modal-box { background: var(--card); border-radius: 16px; padding: 2rem; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-box h3 { margin-bottom: 0.5rem; }
        .modal-box p { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-cancel { background: #E2E8F0; color: #475569; }
        .btn-confirm { background: #EF4444; color: white; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">📋 Nivora</div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>لوحة القيادة</a>
        <a href="tasks.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>المهام</a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>المشاريع</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>Gantt</a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>التقويم</a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>التقارير</a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>Workflows</a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>القوالب</a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>الأرشيف</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>الفريق</a>
    </aside>

    <main class="main">
        <div class="topbar"><h1>المهام</h1><div style="display:flex;gap:0.5rem;"><button class="btn btn-outline" onclick="toggleLang()" id="langBtn" style="height:36px;">🌐 EN</button><button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button><button class="btn btn-outline" onclick="logout()">خروج</button></div></div>

        <div class="add-row" style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="openModal()">➕ مهمة جديدة</button>
            <button class="btn btn-outline" onclick="saveAsTemplate()">💾 حفظ كقالب</button>
            <select class="input" id="templateSelect" onchange="applyTemplate(this.value)" style="width:auto;height:42px;"><option value="">📋 تطبيق قالب...</option></select>
        </div>

        <table class="task-table"><thead><tr><th>العنوان</th><th>الحالة</th><th>الأولوية</th><th>المشروع</th><th>تاريخ الاستحقاق</th><th></th></tr></thead><tbody id="taskBody"></tbody></table>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal"><h2>➕ مهمة جديدة</h2>
            <div class="form-group"><label>العنوان *</label><input type="text" class="input" id="modalTitle" placeholder="أدخل عنوان المهمة"></div>
            <div class="form-group"><label>الوصف</label><textarea class="input" id="modalDesc" rows="3" placeholder="وصف تفصيلي..."></textarea></div>
            <div class="form-row"><div class="form-group"><label>الأولوية</label><select class="input" id="modalPriority"><option value="critical">🔴 حرجة</option><option value="high">🟠 عالية</option><option value="medium" selected>🟡 متوسطة</option><option value="low">🟢 منخفضة</option></select></div><div class="form-group"><label>المشروع</label><input type="text" class="input" id="modalProject" placeholder="اسم المشروع"></div></div>
            <div class="form-row"><div class="form-group"><label>تاريخ الاستحقاق</label><input type="date" class="input" id="modalDueDate"></div></div>
            <div class="form-row"><div class="form-group"><label>تكرار المهمة</label><select class="input" id="modalRecurring"><option value="">بدون تكرار</option><option value="daily">يومي</option><option value="weekly">أسبوعي</option><option value="monthly">شهري</option></select></div><div class="form-group"><label>عدد مرات التكرار</label><input type="number" class="input" id="modalInterval" value="1" min="1" placeholder="كل كم؟"></div></div>
            <div class="modal-buttons"><button class="btn btn-outline" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveTask()">حفظ</button></div>
        </div>
    </div>

    <div class="modal-overlay" id="logoutModal"><div class="modal-box"><h3>🚪 تأكيد الخروج</h3><p>هل أنت متأكد من تسجيل الخروج؟</p><div class="modal-buttons"><button class="btn-cancel" onclick="closeLogoutModal()">إلغاء</button><button class="btn-confirm" onclick="confirmLogout()">خروج</button></div></div></div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        function showToast(msg, type = 'success') { let container = document.getElementById('toastContainer'); if (!container) { container = document.createElement('div'); container.id = 'toastContainer'; container.className = 'toast-container'; document.body.appendChild(container); } const toast = document.createElement('div'); toast.className = `toast toast-${type}`; toast.textContent = msg; container.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
        function showLoading(){document.body.insertAdjacentHTML('beforeend','<div class="spinner-overlay" id="loadingOverlay"><div class="spinner"></div></div>');}
        function hideLoading(){const e=document.getElementById('loadingOverlay');if(e)e.remove();}
        function logout() { document.getElementById('logoutModal').classList.add('active'); }
        function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('active'); }
        function confirmLogout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        if (typeof currentLang !== 'undefined') { document.getElementById('langBtn').innerHTML = currentLang === 'ar' ? '🌐 EN' : '🌐 AR'; }

        function openModal() { document.getElementById('modalOverlay').classList.add('active'); }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        async function saveTask() { const title = document.getElementById('modalTitle').value.trim(); if (!title) return alert('العنوان مطلوب'); await fetch(`${API_BASE}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ title, description: document.getElementById('modalDesc').value.trim(), priority: document.getElementById('modalPriority').value, project: document.getElementById('modalProject').value.trim(), dueDate: document.getElementById('modalDueDate').value || null, isRecurring: document.getElementById('modalRecurring').value !== '', recurringType: document.getElementById('modalRecurring').value || null, recurringInterval: parseInt(document.getElementById('modalInterval').value) || 1 }) }); closeModal(); document.getElementById('modalTitle').value = ''; document.getElementById('modalDesc').value = ''; loadTasks(); }

        function statusBadge(status) { const map = { 'new': '<span class="badge badge-new">جديدة</span>', 'done': '<span class="badge badge-done">مكتملة</span>', 'in-progress': '<span class="badge badge-progress">قيد التنفيذ</span>', 'review': '<span class="badge badge-review">مراجعة</span>' }; return map[status] || '<span class="badge badge-new">جديدة</span>'; }

        async function loadTasks() {
            showLoading();
            try {
                const res = await fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }); const tasks = await res.json(); const tbody = document.getElementById('taskBody');
                if (tasks.length === 0) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-light);"><div style="font-size:3rem;margin-bottom:1rem;">📝</div><h3 style="color:var(--text);">لا توجد مهام بعد</h3><p>اضغط على زر "مهمة جديدة" للبدء</p></td></tr>`; hideLoading(); return; }
                tbody.innerHTML = tasks.map(t => `<tr><td><a href="task.html?id=${t._id}" style="color:var(--text);text-decoration:none;"><strong>${t.title}</strong></a>${t.isRecurring ? '<span class="recurring-badge">🔁 ' + (t.recurringType === 'daily' ? 'يومي' : t.recurringType === 'weekly' ? 'أسبوعي' : 'شهري') + '</span>' : ''}${t.description ? '<br><small style="color:#64748B;">' + t.description.substring(0, 50) + '</small>' : ''}</td><td><select class="input status-select" style="height:32px;font-size:0.8rem;width:130px;" data-id="${t._id}"><option value="new" ${t.status === 'new' ? 'selected' : ''}>🆕 جديدة</option><option value="in-progress" ${t.status === 'in-progress' ? 'selected' : ''}>🔄 قيد التنفيذ</option><option value="review" ${t.status === 'review' ? 'selected' : ''}>👁️ مراجعة</option><option value="done" ${t.status === 'done' ? 'selected' : ''}>✅ مكتملة</option></select></td><td>${t.priority === 'critical' ? '🔴' : t.priority === 'high' ? '🟠' : t.priority === 'medium' ? '🟡' : '🟢'}</td><td>${t.project || '-'}</td><td>${t.dueDate ? new Date(t.dueDate).toLocaleDateString('ar-SA') : '-'}</td><td><button class="btn btn-outline" style="height:32px;font-size:0.7rem;" onclick="archiveTask('${t._id}')">📦</button><button class="btn btn-outline" style="height:32px;font-size:0.75rem;" onclick="deleteTask('${t._id}')">🗑️</button></td></tr>`).join('');
                document.querySelectorAll('.status-select').forEach(select => { select.addEventListener('change', async function() { await fetch(`${API_BASE}/tasks/${this.dataset.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status: this.value }) }); }); });
            } catch (e) {}
            hideLoading();
        }

        async function deleteTask(id) { if (!confirm('حذف المهمة؟')) return; await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadTasks(); }
        async function archiveTask(id) { await fetch(`${API_BASE}/tasks/${id}/archive`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } }); loadTasks(); showToast('📦 تم الأرشفة'); }
        async function loadTemplateOptions() { const res = await fetch(`${API_BASE}/templates`, { headers: { 'Authorization': `Bearer ${token}` } }); const templates = await res.json(); const select = document.getElementById('templateSelect'); select.innerHTML = '<option value="">📋 تطبيق قالب...</option>' + templates.map(t => `<option value="${t._id}">${t.name} (${t.tasks.length})</option>`).join(''); }
        async function saveAsTemplate() { const name = prompt('اسم القالب:'); if (!name) return; const res = await fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }); const tasks = await res.json(); if (tasks.length === 0) return alert('لا توجد مهام'); await fetch(`${API_BASE}/templates`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ name, tasks }) }); loadTemplateOptions(); showToast('✅ تم حفظ القالب'); }
        async function applyTemplate(id) { if (!id) return; if (!confirm('تطبيق القالب سيضيف مهام جديدة. متابعة؟')) return; const res = await fetch(`${API_BASE}/templates/${id}/apply`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); if (res.ok) { showToast('✅ تم تطبيق القالب'); loadTasks(); } }

        loadTasks(); loadTemplateOptions();
    </script>
</body>
</html>
