<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهامي | تطبيق المهام</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6C63FF">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6C63FF; --secondary: #FF6584;
      --bg-start: #a8c0ff; --bg-end: #3f2b96;
      --card-bg: rgba(255, 255, 255, 0.65); --card-border: rgba(255,255,255,0.5);
      --text-dark: #2d3748; --text-light: #4a5568; --input-bg: rgba(255,255,255,0.8);
      --task-bg: white; --filter-bg: white; --filter-border: #cbd5e0; --divider: #cbd5e0;
      --cat-high: #ef4444; --cat-medium: #f59e0b; --cat-low: #10b981; --cat-personal: #8b5cf6; --cat-default: #6b7280;
    }
    body.dark {
      --bg-start: #1a1a2e; --bg-end: #16213e; --card-bg: rgba(30, 30, 50, 0.8); --card-border: rgba(255,255,255,0.1);
      --text-dark: #e2e8f0; --text-light: #a0aec0; --input-bg: rgba(255,255,255,0.1);
      --task-bg: rgba(40, 40, 60, 0.9); --filter-bg: rgba(40,40,60,0.9); --filter-border: #4a5568; --divider: #4a5568;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; transition: background 0.5s;
    }
    .app-card {
      background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 20px; padding: 2rem 2rem 1.5rem;
      width: 100%; max-width: 600px; border: 1px solid var(--card-border); transition: all 0.5s;
    }
    .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: 600; color: var(--text-dark); }
    .user-bar-left { display: flex; align-items: center; gap: 0.8rem; }
    .dark-toggle { background: none; border: none; cursor: pointer; font-size: 1.5rem; }
    .logout-btn { background: none; border: 2px solid #ef4444; color: #ef4444; padding: 0.4rem 1.2rem; border-radius: 2rem; cursor: pointer; font-weight: 700; font-family: inherit; }
    .logout-btn:hover { background: #ef4444; color: white; }
    h1 { text-align: center; font-weight: 800; font-size: 2rem; color: var(--text-dark); margin-bottom: 1.5rem; }
    .add-task-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    #taskInput { flex: 2; min-width: 150px; padding: 0.9rem 1.2rem; border: 2px solid transparent; border-radius: 3rem; background: var(--input-bg); color: var(--text-dark); font-family: inherit; font-size: 1rem; }
    #taskInput:focus { outline: none; border-color: var(--primary); }
    #categorySelect { padding: 0.9rem 1rem; border-radius: 3rem; background: var(--input-bg); color: var(--text-dark); font-family: inherit; cursor: pointer; }
    .btn { background: linear-gradient(135deg, var(--secondary), #ff8e9e); border: none; color: white; font-weight: 700; padding: 0 1.5rem; border-radius: 3rem; cursor: pointer; font-family: inherit; font-size: 1rem; }
    .btn:hover { transform: translateY(-2px); }
    .filter-row { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; justify-content: center; }
    .filter-btn { padding: 0.4rem 1.2rem; border-radius: 2rem; border: 1px solid var(--filter-border); background: var(--filter-bg); color: var(--text-dark); cursor: pointer; font-family: inherit; font-weight: 600; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    #taskList { list-style: none; margin-bottom: 1.5rem; max-height: 350px; overflow-y: auto; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: var(--task-bg); padding: 0.8rem 1rem; margin-bottom: 0.6rem; border-radius: 1rem; border-right: 5px solid var(--cat-default); color: var(--text-dark); }
    .task-item.cat-high { border-right-color: var(--cat-high); } .task-item.cat-medium { border-right-color: var(--cat-medium); }
    .task-item.cat-low { border-right-color: var(--cat-low); } .task-item.cat-personal { border-right-color: var(--cat-personal); }
    .task-item.completed .task-text { text-decoration: line-through; opacity: 0.5; }
    .task-text { flex: 1; margin: 0 0.5rem; font-weight: 500; cursor: pointer; }
    .edit-input { flex: 1; margin: 0 0.5rem; padding: 0.4rem; border: 2px solid var(--primary); border-radius: 0.5rem; font-family: inherit; font-size: 1rem; }
    .task-actions { display: flex; gap: 0.3rem; }
    .btn-icon { background: none; border: none; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; }
    .complete-btn { color: #10b981; } .delete-btn { color: #ef4444; } .edit-btn { color: #3b82f6; }
    .task-footer { display: flex; justify-content: space-between; color: var(--text-light); font-weight: 500; border-top: 1px dashed var(--divider); padding-top: 1rem; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: white; border-radius: 20px; padding: 2rem; text-align: center; max-width: 350px; width: 90%; }
    .modal-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
    .modal-buttons button { padding: 0.6rem 1.8rem; border-radius: 2rem; border: none; cursor: pointer; font-family: inherit; font-weight: 700; }
    .modal-cancel { background: #e2e8f0; color: #4a5568; } .modal-confirm { background: #ef4444; color: white; }
    .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2000; }
    .toast { background: #10b981; color: white; padding: 0.8rem 1.5rem; border-radius: 3rem; font-weight: 600; animation: toastIn 0.4s ease, toastOut 0.4s ease 2s forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }
  </style>
</head>
<body>
  <div class="modal-overlay" id="deleteModal"><div class="modal-box"><h3>🗑️ تأكيد الحذف</h3><p id="deleteModalText"></p><div class="modal-buttons"><button class="modal-cancel" id="modalCancel">إلغاء</button><button class="modal-confirm" id="modalConfirm">حذف</button></div></div></div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="app-card">
    <div class="user-bar"><span>👤 <strong id="currentUser"></strong></span><div class="user-bar-left"><button class="dark-toggle" id="darkToggle" title="الوضع الليلي">🌙</button><button class="logout-btn" id="logoutBtn">تسجيل خروج</button></div></div>
    <h1>📋 مهامي</h1>
    <div class="add-task-row">
      <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة..." autocomplete="off">
      <select id="categorySelect"><option value="default">⚪ عادي</option><option value="high">🔴 عالي</option><option value="medium">🟡 متوسط</option><option value="low">🟢 منخفض</option><option value="personal">🟣 شخصي</option></select>
      <button class="btn" id="addBtn">➕ إضافة</button>
    </div>
    <div class="filter-row"><button class="filter-btn active" data-filter="all">الكل</button><button class="filter-btn" data-filter="active">النشطة</button><button class="filter-btn" data-filter="completed">المكتملة</button></div>
    <ul id="taskList"></ul>
    <div class="task-footer"><span>المهام المتبقية: <strong id="remainingCount">0</strong></span></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js'); }); }
    const API_BASE = 'https://task-manager-production-d3cf.up.railway.app/api';
    const token = localStorage.getItem('taskToken');
    const user = JSON.parse(localStorage.getItem('taskUser') || '{}');
    let currentFilter = 'all', allTasks = [], pendingDeleteId = null;
    if (!token) window.location.href = 'login.html';
    document.getElementById('currentUser').textContent = user.username || 'مستخدم';

    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const remainingSpan = document.getElementById('remainingCount');
    const logoutBtn = document.getElementById('logoutBtn');
    const darkToggle = document.getElementById('darkToggle');
    const deleteModal = document.getElementById('deleteModal');
    const deleteModalText = document.getElementById('deleteModalText');

    if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark'); darkToggle.textContent = '☀️'; }
    darkToggle.addEventListener('click', () => { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('darkMode', isDark); darkToggle.textContent = isDark ? '☀️' : '🌙'; });

    function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.getElementById('toastContainer').appendChild(t); setTimeout(() => t.remove(), 2500); }

    logoutBtn.addEventListener('click', () => { localStorage.removeItem('taskToken'); localStorage.removeItem('taskUser'); window.location.href = 'login.html'; });

    document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.dataset.filter; renderTasks(allTasks); }); });

    async function fetchTasks() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401 || res.status === 403) { logoutBtn.click(); return; }
        allTasks = await res.json(); renderTasks(allTasks);
      } catch (err) { console.error('خطأ في جلب المهام'); }
    }

    function renderTasks(tasks) {
      let filtered = tasks;
      if (currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
      else if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);
      taskList.innerHTML = ''; filtered.forEach(task => { taskList.appendChild(createTaskElement(task)); }); updateRemaining();
    }

    function createTaskElement(task) {
      const li = document.createElement('li'); li.className = `task-item cat-${task.category || 'default'} ${task.completed ? 'completed' : ''}`; li.dataset.id = task._id;
      const span = document.createElement('span'); span.className = 'task-text'; span.textContent = task.text; span.addEventListener('dblclick', () => startEdit(task, span));
      const div = document.createElement('div'); div.className = 'task-actions';
      const editBtn = document.createElement('button'); editBtn.className = 'btn-icon edit-btn'; editBtn.innerHTML = '✎'; editBtn.addEventListener('click', () => startEdit(task, span));
      const completeBtn = document.createElement('button'); completeBtn.className = 'btn-icon complete-btn'; completeBtn.innerHTML = '✓'; completeBtn.addEventListener('click', () => toggleTask(task._id, !task.completed));
      const deleteBtn = document.createElement('button'); deleteBtn.className = 'btn-icon delete-btn'; deleteBtn.innerHTML = '✕'; deleteBtn.addEventListener('click', () => { pendingDeleteId = task._id; deleteModalText.textContent = `هل أنت متأكد من حذف "${task.text}"؟`; deleteModal.classList.add('active'); });
      div.appendChild(editBtn); div.appendChild(completeBtn); div.appendChild(deleteBtn); li.appendChild(span); li.appendChild(div);
      return li;
    }

    document.getElementById('modalCancel').addEventListener('click', () => { deleteModal.classList.remove('active'); pendingDeleteId = null; });
    document.getElementById('modalConfirm').addEventListener('click', async () => { if (pendingDeleteId) { await deleteTaskConfirmed(pendingDeleteId); deleteModal.classList.remove('active'); pendingDeleteId = null; } });

    function startEdit(task, spanElement) {
      const input = document.createElement('input'); input.type = 'text'; input.value = task.text; input.className = 'edit-input'; spanElement.replaceWith(input); input.focus(); input.select();
      const save = async () => { const newText = input.value.trim(); if (newText && newText !== task.text) { await fetch(`${API_BASE}/tasks/${task._id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ text: newText }) }); showToast('✅ تم تعديل المهمة'); fetchTasks(); } else { input.replaceWith(spanElement); } };
      input.addEventListener('blur', save); input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); if (e.key === 'Escape') input.replaceWith(spanElement); });
    }

    async function addTask() { const text = taskInput.value.trim(); if (!text) return; await fetch(`${API_BASE}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ text, category: document.getElementById('categorySelect').value }) }); taskInput.value = ''; showToast('✅ تمت إضافة المهمة'); fetchTasks(); }
    async function toggleTask(id, completed) { await fetch(`${API_BASE}/tasks/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ completed }) }); if (completed) showToast('🎉 مهمة مكتملة!'); fetchTasks(); }
    async function deleteTaskConfirmed(id) { await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); showToast('🗑️ تم حذف المهمة'); fetchTasks(); }
    function updateRemaining() { const remaining = allTasks.filter(t => !t.completed).length; remainingSpan.textContent = remaining; }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
    fetchTasks();
  </script>
</body>
</html>
