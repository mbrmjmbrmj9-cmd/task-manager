<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المهام</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; --primary: #2563EB; --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --text-light: #64748B; --border: #E2E8F0; }
        body.dark { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --text-light: #94A3B8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }

        .main { margin-right: var(--sidebar-w); padding: 2rem; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .add-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }

        .task-table { width: 100%; border-collapse: collapse; }
        .task-table th, .task-table td { padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; text-align: right; }
        .task-table th { color: var(--text-light); font-weight: 600; font-size: 0.8rem; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-new { background: #EFF6FF; color: #2563EB; }
        .badge-done { background: #DCFCE7; color: #16A34A; }
        .badge-progress { background: #FFF7ED; color: #D97706; }
        .badge-review { background: #F5F3FF; color: #7C3AED; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }

        @media (max-width: 1024px) {
            :root { --sidebar-w: 72px; }
            .sidebar { padding: 1rem 0.5rem; }
            .sidebar .logo { font-size: 1rem; text-align: center; }
            .sidebar .label, .sidebar .logo span { display: none; }
            .sidebar a { justify-content: center; padding: 0.5rem; }
        }
        @media (max-width: 768px) {
            :root { --sidebar-w: 0; }
            .sidebar { right: -260px; width: 260px; }
            .sidebar.open { right: 0; }
            .sidebar .label { display: inline; }
            .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; }
            .overlay.show { display: block; }
            .main { margin-right: 0; padding: 1rem; padding-bottom: 5rem; }
            .bottom-nav { display: flex; }
            .task-table { font-size: 0.75rem; }
            .task-table th:nth-child(3), .task-table td:nth-child(3),
            .task-table th:nth-child(4), .task-table td:nth-child(4) { display: none; }
        }
        /* ✅ Modal Styles */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}
.modal-overlay.show {
    display: flex;
}
.modal-content {
    background: var(--card);
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    animation: modalIn 0.25s ease;
}
@keyframes modalIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
}
.modal-header h2 {
    font-size: 1.1rem;
    font-weight: 800;
}
.modal-close {
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--text-light);
    padding: 0.25rem;
}
.modal-close:hover {
    color: var(--text);
}
.modal-body {
    padding: 1.5rem;
}
.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
}
.form-group {
    margin-bottom: 1rem;
}
.form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
    color: var(--text-light);
}
.form-group .input {
    width: 100%;
}

@media (max-width: 480px) {
    .modal-content {
        margin: 0.5rem;
        border-radius: 12px;
    }
    .modal-body {
        padding: 1rem;
    }
    .modal-body > div {
        grid-template-columns: 1fr !important;
    }
}
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo"><span>📋 Nivora</span></div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
        <a href="tasks.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg><span class="label">Workflows</span></a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">القوالب</span></a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">الأرشيف</span></a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>المهام</h1>
            <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" onclick="logout()" style="height:36px;">خروج</button>
            </div>
        </div>

        <div class="add-row">
            <!-- استبدال هذا السطر -->
<button class="btn btn-primary" onclick="openModal()">➕ مهمة جديدة</button>
            <button class="btn btn-outline" onclick="saveAsTemplate()">💾 حفظ كقالب</button>
            <select class="input" id="templateSelect" onchange="applyTemplate(this.value)" style="width:auto;height:42px;"><option value="">📋 تطبيق قالب...</option></select>
        </div>

        <table class="task-table">
            <thead><tr><th>العنوان</th><th>الحالة</th><th>الأولوية</th><th>المشروع</th><th>التاريخ</th><th></th></tr></thead>
            <tbody id="taskBody"></tbody>
        </table>
    </main>

    <nav class="bottom-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        function showToast(msg) { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#16A34A;color:white;padding:0.75rem 1.5rem;border-radius:12px;z-index:9999;font-weight:600;'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }

        async function loadTasks() {
            const res = await fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } });
            const tasks = await res.json();
            const tbody = document.getElementById('taskBody');
            if (tasks.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;">لا توجد مهام</td></tr>'; return; }
            tbody.innerHTML = tasks.map(t => `<tr>
                <td><a href="task.html?id=${t._id}" style="color:var(--text);text-decoration:none;"><strong>${t.title}</strong></a></td>
                <td><span class="badge badge-${t.status === 'done' ? 'done' : t.status === 'in-progress' ? 'progress' : t.status === 'review' ? 'review' : 'new'}">${t.status === 'done' ? 'مكتملة' : t.status === 'in-progress' ? 'قيد التنفيذ' : t.status === 'review' ? 'مراجعة' : 'جديدة'}</span></td>
                <td>${t.priority === 'critical' ? '🔴' : t.priority === 'high' ? '🟠' : t.priority === 'medium' ? '🟡' : '🟢'}</td>
                <td>${t.project || '-'}</td>
                <td>${t.dueDate ? new Date(t.dueDate).toLocaleDateString('ar-SA') : '-'}</td>
                <td><button class="btn btn-outline" style="height:28px;font-size:0.7rem;" onclick="deleteTask('${t._id}')">🗑️</button></td>
            </tr>`).join('');
        }

        async function deleteTask(id) { if (!confirm('حذف المهمة؟')) return; await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadTasks(); }
        async function loadTemplateOptions() { const res = await fetch(`${API_BASE}/templates`, { headers: { 'Authorization': `Bearer ${token}` } }); const templates = await res.json(); const select = document.getElementById('templateSelect'); select.innerHTML = '<option value="">📋 تطبيق قالب...</option>' + templates.map(t => `<option value="${t._id}">${t.name}</option>`).join(''); }
        async function saveAsTemplate() { const name = prompt('اسم القالب:'); if (!name) return; const res = await fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }); const tasks = await res.json(); if (tasks.length === 0) return alert('لا توجد مهام'); await fetch(`${API_BASE}/templates`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ name, tasks }) }); loadTemplateOptions(); showToast('✅ تم حفظ القالب'); }
        async function applyTemplate(id) { if (!id) return; if (!confirm('تطبيق القالب؟')) return; const res = await fetch(`${API_BASE}/templates/${id}/apply`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); if (res.ok) { showToast('✅ تم تطبيق القالب'); loadTasks(); } }
        function openModal() { alert('Modal إنشاء مهمة - سيتم تطويره'); }
        // ========== Modal إنشاء مهمة ==========
function openModal() {
    document.getElementById('taskModal').classList.add('show');
    document.getElementById('modalTaskTitle').focus();
    loadProjectOptions();
}

function closeTaskModal(e) {
    if (e && e.target !== document.getElementById('taskModal')) return;
    document.getElementById('taskModal').classList.remove('show');
    // مسح الحقول
    document.getElementById('modalTaskTitle').value = '';
    document.getElementById('modalTaskDesc').value = '';
    document.getElementById('modalTaskPriority').value = 'medium';
    document.getElementById('modalTaskStatus').value = 'new';
    document.getElementById('modalTaskDueDate').value = '';
}

async function loadProjectOptions() {
    try {
        const res = await fetch(`${API_BASE}/projects`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const projects = await res.json();
        const data = projects.data || projects; // دعم Pagination
        document.getElementById('modalTaskProject').innerHTML = 
            '<option value="">بدون مشروع</option>' + 
            data.map(p => `<option value="${p._id}">${p.name}</option>`).join('');
    } catch (err) {}
}

async function createTask() {
    const title = document.getElementById('modalTaskTitle').value.trim();
    if (!title) return alert('العنوان مطلوب');
    
    const btn = document.getElementById('modalSaveBtn');
    btn.disabled = true;
    btn.textContent = '⏳ جارٍ الإنشاء...';
    
    const body = {
        title,
        description: document.getElementById('modalTaskDesc').value.trim(),
        priority: document.getElementById('modalTaskPriority').value,
        status: document.getElementById('modalTaskStatus').value,
        dueDate: document.getElementById('modalTaskDueDate').value || null,
        project: document.getElementById('modalTaskProject').options[document.getElementById('modalTaskProject').selectedIndex]?.text || '',
        projectId: document.getElementById('modalTaskProject').value || null
    };
    
    try {
        const res = await fetch(`${API_BASE}/tasks`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(body)
        });
        
        if (res.ok) {
            closeTaskModal();
            showToast('✅ تم إنشاء المهمة بنجاح');
            loadTasks();
        } else {
            const data = await res.json();
            alert('❌ ' + (data.error || 'خطأ في إنشاء المهمة'));
        }
    } catch (err) {
        alert('❌ تعذر الاتصال بالخادم');
    }
    
    btn.disabled = false;
    btn.textContent = '✅ إنشاء';
}
        loadTasks(); loadTemplateOptions();
    </script>
    <!-- ✅ Modal إنشاء مهمة -->
<div class="modal-overlay" id="taskModal" onclick="closeTaskModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2>➕ مهمة جديدة</h2>
            <button class="modal-close" onclick="closeTaskModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>العنوان *</label>
                <input type="text" class="input" id="modalTaskTitle" placeholder="عنوان المهمة">
            </div>
            <div class="form-group">
                <label>الوصف</label>
                <textarea class="input" id="modalTaskDesc" placeholder="وصف المهمة" rows="3" style="height:auto;padding:0.75rem;"></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>الأولوية</label>
                    <select class="input" id="modalTaskPriority">
                        <option value="medium">🟡 متوسطة</option>
                        <option value="high">🟠 عالية</option>
                        <option value="critical">🔴 حرجة</option>
                        <option value="low">🟢 منخفضة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الحالة</label>
                    <select class="input" id="modalTaskStatus">
                        <option value="new">📥 جديدة</option>
                        <option value="in-progress">🔄 قيد التنفيذ</option>
                        <option value="review">👁️ مراجعة</option>
                        <option value="done">✅ مكتملة</option>
                    </select>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                    <label>المشروع</label>
                    <select class="input" id="modalTaskProject">
                        <option value="">بدون مشروع</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تاريخ الاستحقاق</label>
                    <input type="date" class="input" id="modalTaskDueDate">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeTaskModal()">إلغاء</button>
            <button class="btn btn-primary" id="modalSaveBtn" onclick="createTask()">✅ إنشاء</button>
        </div>
    </div>
</div>
</body>
</html>
