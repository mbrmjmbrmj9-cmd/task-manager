<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | لوحة القيادة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/style.css">
    <style>
    :root { --sidebar-w: 240px; }
    body { min-height: 100vh; overflow-x: hidden; }

    /* ========== Sidebar ========== */
    .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; transition: right 0.3s ease; }
    .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
    .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
    .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: var(--primary); }
    .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar .label { transition: opacity 0.2s; }

    /* ========== Main ========== */
    .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; transition: margin-right 0.3s ease; }

    /* ========== Topbar ========== */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
    .topbar h1 { font-size: 1.5rem; font-weight: 800; }
    .welcome-text { font-size: 0.9rem; color: var(--text-light); }
    .welcome-text strong { color: var(--text); }
    .topbar-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

    /* ========== Quick Actions ========== */
    .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .quick-action { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition); font-family: inherit; font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .quick-action:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .quick-action .qa-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; background: var(--primary-light); color: var(--primary); font-size: 1.1rem; flex-shrink: 0; }

    /* ========== KPI ========== */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi-card { padding: 1.5rem; border-radius: var(--radius); display: flex; align-items: center; gap: 1rem; transition: all var(--transition); cursor: default; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .kpi-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.3rem; }
    .kpi-icon.blue { background: var(--primary-light); color: var(--primary); }
    .kpi-icon.green { background: var(--success-light); color: var(--success); }
    .kpi-icon.orange { background: var(--warning-light); color: var(--warning); }
    .kpi-icon.red { background: var(--danger-light); color: var(--danger); }
    .kpi-icon.purple { background: #F5F3FF; color: #7C3AED; }
    .kpi-info { flex: 1; min-width: 0; }
    .kpi-label { font-size: 0.78rem; font-weight: 600; color: var(--text-light); margin-bottom: 0.2rem; }
    .kpi-value { font-size: 1.8rem; font-weight: 800; line-height: 1; }

    /* ========== Dashboard Grid ========== */
    .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .section-card { padding: 1.5rem; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .section-header h3 { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .section-link { font-size: 0.8rem; color: var(--primary); text-decoration: none; font-weight: 600; }
    .section-link:hover { text-decoration: underline; }

    /* ========== Task List Mini ========== */
    .task-list-mini { display: flex; flex-direction: column; gap: 0.4rem; }
    .task-item-mini { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 0.6rem; padding: 0.65rem 0.7rem; border-radius: var(--radius-sm); background: var(--secondary-light); font-size: 0.82rem; cursor: pointer; transition: all var(--transition-fast); }
    .task-item-mini:hover { background: var(--primary-light); }
    .task-item-mini .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .task-item-mini .title { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-item-mini .meta { font-size: 0.7rem; color: var(--text-light); white-space: nowrap; }

    /* ========== Activity ========== */
    .activity-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .activity-item { padding: 0.6rem 0.7rem; border-radius: var(--radius-sm); font-size: 0.8rem; border-right: 3px solid transparent; background: var(--secondary-light); transition: background var(--transition-fast); }
    .activity-item:hover { background: var(--primary-light); }
    .activity-item.create { border-right-color: var(--primary); }
    .activity-item.complete { border-right-color: var(--success); }
    .activity-item.comment { border-right-color: #8B5CF6; }
    .activity-item.file { border-right-color: var(--warning); }
    .activity-item .act-user { font-weight: 700; }
    .activity-item .act-time { font-size: 0.65rem; color: var(--text-light); display: block; margin-top: 0.1rem; }

    /* ========== Notifications ========== */
    .notif-dropdown { display: none; position: absolute; top: 42px; left: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 320px; max-height: 400px; overflow-y: auto; z-index: 500; }

    /* ========== Overlay ========== */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }

    /* ========== Bottom Nav ========== */
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
    .bottom-nav a.active { color: var(--primary); }
    .bottom-nav a svg { width: 22px; height: 22px; }

    /* ========== Tablet (768px - 1024px) ========== */
    @media (max-width: 1024px) {
        :root { --sidebar-w: 72px; }
        .sidebar { padding: 1rem 0.5rem; }
        .sidebar .logo { font-size: 1rem; text-align: center; }
        .sidebar .label, .sidebar .logo span { display: none; }
        .sidebar a { justify-content: center; padding: 0.5rem; }
        .main { padding: 1rem; }
        .dashboard-grid { grid-template-columns: 1fr; }
        .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        .quick-actions { grid-template-columns: repeat(2, 1fr); }
    }

    /* ========== Mobile (أقل من 768px) ========== */
    @media (max-width: 768px) {
        :root { --sidebar-w: 0; }
        
        .sidebar { right: -260px; width: 260px; z-index: 200; }
        .sidebar.open { right: 0; }
        .sidebar .label { display: inline; }
        .sidebar .logo span { display: inline; }
        .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; }
        
        .overlay.show { display: block; }
        
        .main { margin-right: 0; padding: 0.5rem; padding-bottom: 5rem; width: 100%; max-width: 100vw; }
        
        .topbar { flex-direction: column; align-items: stretch; margin-bottom: 0.75rem; }
        .topbar h1 { font-size: 1.1rem; }
        .welcome-text { font-size: 0.75rem; }
        .topbar-actions { width: 100%; justify-content: space-between; gap: 0.35rem; }
        .topbar-actions select { flex: 1; min-width: 0; height: 32px; font-size: 0.75rem; }
        .topbar-actions .btn-sm { height: 32px; font-size: 0.7rem; padding: 0 0.5rem; }
        .topbar-actions .btn-icon { width: 32px; height: 32px; }
        
        .quick-actions { grid-template-columns: 1fr 1fr; gap: 0.35rem; margin-bottom: 0.75rem; }
        .quick-action { padding: 0.6rem 0.5rem; font-size: 0.75rem; gap: 0.4rem; border-radius: var(--radius-sm); }
        .quick-action .qa-icon { width: 28px; height: 28px; font-size: 0.9rem; }
        
        .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 0.35rem; margin-bottom: 0.75rem; }
        .kpi-card { padding: 0.75rem 0.5rem; gap: 0.4rem; flex-direction: column; text-align: center; border-radius: var(--radius-sm); }
        .kpi-icon { width: 32px; height: 32px; font-size: 0.9rem; }
        .kpi-value { font-size: 1.2rem; }
        .kpi-label { font-size: 0.65rem; }
        
        .dashboard-grid { grid-template-columns: 1fr; gap: 0.5rem; margin-bottom: 0.75rem; }
        .section-card { padding: 0.75rem; }
        .section-header { flex-direction: column; align-items: flex-start; gap: 0.25rem; margin-bottom: 0.5rem; }
        .section-header h3 { font-size: 0.8rem; }
        .section-link { font-size: 0.7rem; }
        
        .task-item-mini { padding: 0.5rem; font-size: 0.75rem; gap: 0.4rem; }
        .task-item-mini .meta { font-size: 0.65rem; }
        .activity-item { padding: 0.5rem; font-size: 0.72rem; }
        .activity-item .act-time { font-size: 0.6rem; }
        
        .notif-dropdown { min-width: 100vw; left: -1rem; right: -1rem; top: 36px; border-radius: 0; }
        
        .bottom-nav { display: flex; }
    }

    /* ========== Small Mobile (أقل من 400px) ========== */
    @media (max-width: 400px) {
        .quick-actions { grid-template-columns: 1fr; }
        .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        .topbar-actions { flex-wrap: wrap; }
    }
</style>
<script src="js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script src="js/dashboard.js" defer></script>
</head>
<body data-ui="app">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <aside id="sidebar" class="shell-rail"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1>لوحة القيادة</h1>
                <p class="welcome-text">مرحبًا <strong id="usernameDisplay"></strong>، إليك نظرة عامة على أعمالك</p>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <div style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;" onclick="window.location.href='profile.html'">
                    <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:var(--secondary-light);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:var(--text-light);overflow:hidden;"></div>
                    <span id="topUsername" style="font-size:0.8rem;font-weight:600;"></span>
                </div>
                <select id="projectFilter" style="height:36px;border-radius:8px;border:1px solid var(--border);padding:0 0.5rem;font-family:inherit;font-size:0.8rem;background:var(--bg);color:var(--text);"><option value="">كل المشاريع</option></select>
                <!-- زر الإشعارات -->
<div style="position:relative;">
    <button class="btn btn-ghost btn-icon" id="notifBtn" style="width:36px;height:36px;position:relative;">
        🔔
        <span id="notifBadge" style="display:none;position:absolute;top:2px;left:2px;background:var(--danger);color:#fff;font-size:0.6rem;font-weight:700;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;"></span>
    </button>
    <div id="notifDropdown" style="display:none;position:absolute;top:42px;left:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:320px;max-height:400px;overflow-y:auto;z-index:500;">
        <div style="padding:0.85rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:0.9rem;">الإشعارات</strong>
            <button data-mark-all style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:0.75rem;font-weight:600;">تعليم الكل</button>
        </div>
        <div id="notifList"></div>
    </div>
</div>
                <button class="btn btn-ghost btn-icon" onclick="toggleDark()" id="darkBtn" style="width:36px;height:36px;">🌙</button>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="quick-actions">
            <button class="quick-action" onclick="window.location.href='tasks.html'">
                <span class="qa-icon">➕</span> مهمة جديدة
            </button>
            <button class="quick-action" onclick="window.location.href='projects.html'">
                <span class="qa-icon">📁</span> مشروع جديد
            </button>
            <button class="quick-action" onclick="window.location.href='kanban.html'">
                <span class="qa-icon">📌</span> فتح Kanban
            </button>
            <button class="quick-action" onclick="window.location.href='reports.html'">
                <span class="qa-icon">📊</span> عرض التقارير
            </button>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="dashboard-grid">
            <div class="card section-card">
                <div class="section-header">
                    <h3>عملي اليوم</h3>
                    <a href="tasks.html?mine=1" class="section-link">كل مهامي ←</a>
                </div>
                <div class="task-list-mini" id="upcomingTasks"></div>
            </div>
            <div class="card section-card">
                <div class="section-header">
                    <h3>📜 النشاط الأخير</h3>
                    <a href="reports.html" class="section-link">عرض الكل ←</a>
                </div>
                <div class="activity-list" id="recentActivity"></div>
            </div>
        </div>
    </main>

    <script src="js/components.js"></script>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = Nivora.apiBase;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        document.getElementById('usernameDisplay').textContent = user.fullName || user.username || 'مستخدم';

        document.addEventListener('DOMContentLoaded', () => {
            const avatar = document.getElementById('topAvatar');
            const username = document.getElementById('topUsername');
            if (username) username.textContent = user.fullName || user.username || 'مستخدم';
            if (avatar) {
                if (user.avatar) avatar.innerHTML = `<img src="${safeImageUrl(user.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                else avatar.textContent = getInitials(user.fullName || user.username);
            }
        });

    </script>
</body>
</html>
