<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المشاريع</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .project-card { border-radius: 12px; padding: 1.25rem; border-right: 4px solid #2563EB; transition: all var(--transition); }
        .project-card:hover { box-shadow: var(--shadow-md); }
        .project-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .project-card .meta { font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.75rem; }
        .project-card .progress { height: 6px; background: #E2E8F0; border-radius: 3px; margin-bottom: 0.5rem; }
        .project-card .progress div { height: 100%; border-radius: 3px; background: #2563EB; }
        .project-card .stats { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--text-light); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--card); border-radius: 16px; padding: 2rem; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .modal h2 { margin-bottom: 1.5rem; font-size: 1.2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--text-light); }
        .modal-buttons { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
        .color-options { display: flex; gap: 0.5rem; }
        .color-option { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-option.selected { border-color: var(--text); }
        .modal-box { background: var(--card); border-radius: 16px; padding: 2rem; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .modal-box h3 { margin-bottom: 0.5rem; }
        .modal-box p { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .btn-cancel { background: #E2E8F0; color: #475569; }
        .btn-confirm { background: #EF4444; color: white; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">📋 Nivora</div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>لوحة القيادة</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>المهام</a>
        <a href="projects.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>المشاريع</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>Gantt</a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>التقويم</a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>التقارير</a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>Workflows</a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>القوالب</a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>الأرشيف</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>الفريق</a>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>المشاريع</h1>
            <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-primary" onclick="openModal()">➕ مشروع جديد</button>
                <button class="btn btn-outline" onclick="toggleLang()" id="langBtn" style="height:36px;">🌐 EN</button>
                <button class="btn btn-outline" onclick="toggleDark()" style="height:36px;" id="darkBtn">🌙</button>
                <button class="btn btn-outline" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="project-grid" id="projectGrid"></div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal"><h2>➕ مشروع جديد</h2>
            <div class="form-group"><label>اسم المشروع *</label><input type="text" class="input" id="modalName" placeholder="أدخل اسم المشروع"></div>
            <div class="form-group"><label>الوصف</label><textarea class="input" id="modalDesc" rows="2" placeholder="وصف المشروع..." style="height:auto;padding:0.75rem;"></textarea></div>
            <div class="form-group"><label>اللون</label><div class="color-options"><span class="color-option selected" style="background:#2563EB;" data-color="#2563EB"></span><span class="color-option" style="background:#22C55E;" data-color="#22C55E"></span><span class="color-option" style="background:#EF4444;" data-color="#EF4444"></span><span class="color-option" style="background:#F97316;" data-color="#F97316"></span><span class="color-option" style="background:#7C3AED;" data-color="#7C3AED"></span></div></div>
            <div class="modal-buttons"><button class="btn btn-outline" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="saveProject()">حفظ</button></div>
        </div>
    </div>

    <div class="modal-overlay" id="logoutModal"><div class="modal-box"><h3>🚪 تأكيد الخروج</h3><p>هل أنت متأكد من تسجيل الخروج؟</p><div class="modal-buttons"><button class="btn-cancel" onclick="closeLogoutModal()">إلغاء</button><button class="btn-confirm" onclick="confirmLogout()">خروج</button></div></div></div>

    <script>
        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        function showToast(msg, type = 'success') { let container = document.getElementById('toastContainer'); if (!container) { container = document.createElement('div'); container.id = 'toastContainer'; container.className = 'toast-container'; document.body.appendChild(container); } const toast = document.createElement('div'); toast.className = `toast toast-${type}`; toast.textContent = msg; container.appendChild(toast); setTimeout(() => toast.remove(), 3000); }
        function showLoading(){document.body.insertAdjacentHTML('beforeend','<div class="spinner-overlay" id="loadingOverlay"><div class="spinner"></div></div>');}
        function hideLoading(){const e=document.getElementById('loadingOverlay');if(e)e.remove();}
        function logout() { document.getElementById('logoutModal').classList.add('active'); }
        function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('active'); }
        function confirmLogout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        if (typeof currentLang !== 'undefined') { document.getElementById('langBtn').innerHTML = currentLang === 'ar' ? '🌐 EN' : '🌐 AR'; }

        let selectedColor = '#2563EB';
        function openModal() { document.getElementById('modalOverlay').classList.add('active'); }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.querySelectorAll('.color-option').forEach(el => { el.addEventListener('click', function() { document.querySelectorAll('.color-option').forEach(e => e.classList.remove('selected')); this.classList.add('selected'); selectedColor = this.dataset.color; }); });

        async function saveProject() {
            const name = document.getElementById('modalName').value.trim(); if (!name) return alert('الاسم مطلوب');
            await fetch(`${API_BASE}/projects`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ name, description: document.getElementById('modalDesc').value.trim(), color: selectedColor }) });
            closeModal(); document.getElementById('modalName').value = ''; document.getElementById('modalDesc').value = ''; loadProjects();
        }

        async function loadProjects() {
            showLoading();
            try {
                const res = await fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } }); const projects = await res.json(); const grid = document.getElementById('projectGrid');
                if (projects.length === 0) { grid.innerHTML = `<div class="card" style="text-align:center;padding:3rem;color:var(--text-light);grid-column:1/-1;"><div style="font-size:3rem;margin-bottom:1rem;">📁</div><h3 style="color:var(--text);">لا توجد مشاريع بعد</h3><p>أنشئ مشروعك الأول لتنظيم مهامك</p></div>`; hideLoading(); return; }
                grid.innerHTML = projects.map(p => { const percent = p.taskCount > 0 ? Math.round((p.doneCount / p.taskCount) * 100) : 0; return `<div class="card project-card" style="border-right-color:${p.color};"><h3>${p.name}</h3><p class="meta">${p.description || 'بدون وصف'}</p><div class="progress"><div style="width:${percent}%;background:${p.color};"></div></div><div class="stats"><span>✅ ${p.doneCount}/${p.taskCount} مهام</span><span>${percent}%</span><button class="btn btn-outline" style="height:28px;font-size:0.7rem;margin-right:auto;" onclick="deleteProject('${p._id}')">🗑️</button></div></div>`; }).join('');
            } catch (e) {}
            hideLoading();
        }

        async function deleteProject(id) { if (!confirm('حذف المشروع؟')) return; await fetch(`${API_BASE}/projects/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadProjects(); }

        loadProjects();
    </script>
</body>
</html>
