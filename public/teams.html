<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | فرق العمل</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; min-height: 100vh; background: var(--bg); }
        .sidebar { width: 240px; background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .team-card { padding: 1.5rem; transition: all 0.2s; }
        .team-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .team-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .team-card .meta { display: flex; gap: 1rem; color: var(--text-light); font-size: 0.85rem; margin-bottom: 1rem; }
        .team-card .current { background: #DCFCE7; color: #16A34A; padding: 0.1rem 0.5rem; border-radius: 10px; font-size: 0.75rem; }
        .team-card .plan-badge { background: #EFF6FF; color: #2563EB; padding: 0.2rem 0.6rem; border-radius: 10px; font-size: 0.75rem; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">📋 Nivora</div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>لوحة القيادة</a>
        <a href="teams.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>فرق العمل</a>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>🏢 فرق العمل</h1>
            <div style="display:flex;gap:0.5rem;">
                <a href="workspace.html" class="btn btn-primary" id="btnNewTeam" style="display:none;">➕ فريق جديد</a>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" onclick="logout()">خروج</button>
            </div>
        </div>
        <div class="teams-grid" id="teamsList"></div>
    </main>

    <script>
        const API = 'http://localhost:3000/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }

        const currentWsId = localStorage.getItem('workspaceId');

        async function getUserRole() {
            const wsId = localStorage.getItem('workspaceId');
            if (!wsId) return 'member';
            try {
                const res = await fetch(`${API}/workspaces/${wsId}/members`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return 'member';
                const members = await res.json();
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const current = members.find(m => (m.userId?._id || m.userId) === user.id);
                return current?.role || 'member';
            } catch (e) { return 'member'; }
        }

        async function loadTeams() {
            const res = await fetch(`${API}/workspaces`, { headers: { 'Authorization': `Bearer ${token}` } });
            const teams = await res.json();
            document.getElementById('teamsList').innerHTML = teams.map(t => `
                <div class="card team-card">
                    <h3>${t.name} ${t._id === currentWsId ? '<span class="current">الحالي</span>' : ''}</h3>
                    <div class="meta">
                        <span>👥 ${t.members?.length || 0} أعضاء</span>
                        <span class="plan-badge">${t.plan || 'free'}</span>
                    </div>
                    <button class="btn btn-primary" onclick="switchTeam('${t._id}', '${t.inviteCode || ''}')">دخول</button>
                </div>
            `).join('') || '<p style="color:var(--text-light);">لا توجد فرق. أنشئ فريقك الأول!</p>';
        }

        function switchTeam(id, code) {
            localStorage.setItem('workspaceId', id);
            localStorage.setItem('inviteCode', code);
            window.location.href = 'index.html';
        }

        async function checkPermission() {
            const role = await getUserRole();
            if (role === 'owner' || role === 'admin') {
                document.getElementById('btnNewTeam').style.display = 'inline-flex';
            }
        }

        loadTeams();
        checkPermission();
    </script>
</body>
</html>
