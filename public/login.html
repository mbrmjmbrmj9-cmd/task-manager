<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | تسجيل الدخول</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563EB; --primary-hover: #1D4ED8; --bg: #F8FAFC; --card: #FFFFFF; --text: #1E293B; --text-light: #64748B; --border: #E2E8F0; --danger: #DC2626; --success: #16A34A; }
        body.dark { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --text-light: #94A3B8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; transition: background 0.3s; padding: 1rem; }
        .container { width: 100%; max-width: 440px; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .logo p { color: var(--text-light); font-size: 0.9rem; margin-top: 0.25rem; }
        .card { background: var(--card); border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.06); border: 1px solid var(--border); }
        .card h2 { font-size: 1.3rem; font-weight: 800; text-align: center; margin-bottom: 1.5rem; }
        .google-btn { width: 100%; height: 46px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 1rem; transition: all 0.2s; }
        .google-btn:hover { background: var(--bg); }
        .divider { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0; color: #94A3B8; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .input-group { position: relative; margin-bottom: 1rem; }
        .input-group .icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94A3B8; width: 20px; height: 20px; pointer-events: none; z-index: 1; }
        .input-group input { width: 100%; height: 48px; padding: 0 2.5rem; border-radius: 12px; border: 1px solid var(--border); font-family: inherit; font-size: 0.9rem; background: var(--bg); color: var(--text); transition: all 0.2s; }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .input-group .toggle-password { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94A3B8; font-size: 1.1rem; background: none; border: none; }
        .options-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; }
        .options-row label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-light); }
        .options-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
        .options-row a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .options-row a:hover { text-decoration: underline; }
        .btn { width: 100%; height: 48px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 1rem; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .switch-text { text-align: center; margin-top: 1.25rem; color: var(--text-light); font-size: 0.85rem; }
        .switch-text a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .switch-text a:hover { text-decoration: underline; }
        .error-msg { background: #FEE2E2; color: #DC2626; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
        .success-msg { background: #DCFCE7; color: #16A34A; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
        .hidden { display: none !important; }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.2rem; }
        .password-strength { height: 4px; border-radius: 2px; margin-top: 0.4rem; transition: all 0.3s; }
        .strength-weak { background: #DC2626; width: 33%; }
        .strength-medium { background: #F59E0B; width: 66%; }
        .strength-strong { background: #16A34A; width: 100%; }
    </style>
</head>
<body>
<button class="btn btn-outline" onclick="toggleLang()" id="langBtn" style="position:fixed;top:1rem;right:1rem;height:36px;z-index:10;">🌐 EN</button>    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="container">
        <div class="logo"><h1>Nivora</h1><p>نظّم مهامك، أدر فريقك، وأنجز أكثر</p></div>
        <div class="card">
            <div id="loginForm">
                <h2>تسجيل الدخول</h2>
                <div class="error-msg" id="loginError"></div>
                <button class="google-btn" onclick="location.href='https://nivora-t9ov.onrender.com/api/auth/google'"><span style="font-size:1.2rem;font-weight:700;color:#4285F4;">G</span> المتابعة باستخدام Google</button>
                <div class="divider">أو الدخول باستخدام البريد</div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg><input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="email" autofocus></div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password"><button class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</button></div>
                <div class="options-row"><label><input type="checkbox" id="rememberMe"> تذكرني</label><a href="#" onclick="showForgotPassword()">نسيت كلمة المرور؟</a></div>
                <button class="btn btn-primary" id="loginBtn" onclick="login()">تسجيل الدخول</button>
                <p class="switch-text">ليس لديك حساب؟ <a href="#" id="showRegister">إنشاء حساب</a></p>
            </div>
            <div id="registerForm" class="hidden">
                <h2>إنشاء حساب</h2>
                <div class="error-msg" id="registerError"></div>
                <button class="google-btn" onclick="location.href='https://nivora-t9ov.onrender.com/api/auth/google'"><span style="font-size:1.2rem;font-weight:700;color:#4285F4;">G</span> التسجيل بـ Google</button>
                <div class="divider">أو</div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><input type="text" id="regFullName" placeholder="الاسم الكامل"></div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg><input type="email" id="regEmail" placeholder="البريد الإلكتروني"></div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="regPassword" placeholder="كلمة المرور" oninput="checkStrength()"><button class="toggle-password" onclick="togglePassword('regPassword', this)">👁️</button><div class="password-strength" id="strengthBar"></div></div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="regConfirm" placeholder="تأكيد كلمة المرور"></div>
                <button class="btn btn-primary" onclick="register()">إنشاء حساب</button>
                <p class="switch-text">لديك حساب؟ <a href="#" id="showLogin">سجّل دخولك</a></p>
            </div>
            <div id="forgotForm" class="hidden">
                <h2>استعادة كلمة المرور</h2>
                <div class="success-msg" id="forgotSuccess"></div>
                <div class="error-msg" id="forgotError"></div>
                <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg><input type="email" id="forgotEmail" placeholder="البريد الإلكتروني"></div>
                <button class="btn btn-primary" onclick="forgotPassword()">إرسال رابط الاستعادة</button>
                <p class="switch-text"><a href="#" id="showLoginFromForgot">العودة لتسجيل الدخول</a></p>
            </div>
        </div>
    </div>
    <script src="js/i18n.js"></script>
    <script>
        const API = 'https://nivora-t9ov.onrender.com/api/auth';
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        const urlParams = new URLSearchParams(window.location.search);
        const googleToken = urlParams.get('token'); const googleUser = urlParams.get('username');
        if (googleToken) { localStorage.setItem('token', googleToken); localStorage.setItem('user', JSON.stringify({ username: googleUser || 'مستخدم' })); checkWorkspace(googleToken); }
        document.getElementById('showRegister').addEventListener('click', e => { e.preventDefault(); toggleForms('register'); });
        document.getElementById('showLogin').addEventListener('click', e => { e.preventDefault(); toggleForms('login'); });
        document.getElementById('showLoginFromForgot').addEventListener('click', e => { e.preventDefault(); toggleForms('login'); });
        function toggleForms(form) { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.add('hidden'); document.getElementById('forgotForm').classList.add('hidden'); if (form === 'login') document.getElementById('loginForm').classList.remove('hidden'); if (form === 'register') document.getElementById('registerForm').classList.remove('hidden'); if (form === 'forgot') document.getElementById('forgotForm').classList.remove('hidden'); }
        function showForgotPassword() { toggleForms('forgot'); }
        function togglePassword(inputId, btn) { const input = document.getElementById(inputId); const isPassword = input.type === 'password'; input.type = isPassword ? 'text' : 'password'; btn.textContent = isPassword ? '🙈' : '👁️'; }
        function checkStrength() { const p = document.getElementById('regPassword').value; const bar = document.getElementById('strengthBar'); bar.className = 'password-strength'; if (p.length === 0) return; let score = 0; if (p.length >= 8) score++; if (/[A-Z]/.test(p)) score++; if (/[0-9]/.test(p)) score++; if (/[^A-Za-z0-9]/.test(p)) score++; if (score <= 2) bar.classList.add('strength-weak'); else if (score === 3) bar.classList.add('strength-medium'); else bar.classList.add('strength-strong'); }
        
        async function checkWorkspace(token) {
            const res = await fetch('https://nivora-t9ov.onrender.com/api/workspaces', { headers: { 'Authorization': `Bearer ${token}` } });
            const workspaces = await res.json();
            if (workspaces.length > 0) {
                localStorage.setItem('workspaceId', workspaces[0]._id);
                localStorage.setItem('inviteCode', workspaces[0].inviteCode || '');
                window.location.href = 'index.html';
            } else {
                window.location.href = 'workspace.html';
            }
        }
        
        async function login() { const email = document.getElementById('loginEmail').value.trim(); const password = document.getElementById('loginPassword').value; const err = document.getElementById('loginError'); const btn = document.getElementById('loginBtn'); if (!email || !password) { err.textContent = 'املأ جميع الحقول'; err.style.display = 'block'; return; } btn.disabled = true; btn.textContent = '⟳ جارٍ تسجيل الدخول...'; try { const res = await fetch(`${API}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: email, password }) }); const data = await res.json(); if (res.ok) { localStorage.setItem('token', data.token); localStorage.setItem('user', JSON.stringify(data.user)); checkWorkspace(data.token); } else { err.textContent = data.error || 'البريد الإلكتروني أو كلمة المرور غير صحيحة'; err.style.display = 'block'; } } catch (e) { err.textContent = 'تعذر الاتصال بالخادم'; err.style.display = 'block'; } btn.disabled = false; btn.textContent = 'تسجيل الدخول'; }
        async function register() { const fullName = document.getElementById('regFullName').value.trim(); const email = document.getElementById('regEmail').value.trim(); const password = document.getElementById('regPassword').value; const confirm = document.getElementById('regConfirm').value; const err = document.getElementById('registerError'); if (!fullName || !email || !password || !confirm) { err.textContent = 'املأ جميع الحقول'; err.style.display = 'block'; return; } if (password !== confirm) { err.textContent = 'كلمتا المرور غير متطابقتين'; err.style.display = 'block'; return; } if (password.length < 8) { err.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل'; err.style.display = 'block'; return; } try { const res = await fetch(`${API}/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: email, password, fullName }) }); const data = await res.json(); if (res.ok) { alert('تم إنشاء الحساب! سجّل دخولك.'); toggleForms('login'); document.getElementById('loginEmail').value = email; } else { err.textContent = data.error; err.style.display = 'block'; } } catch (e) { err.textContent = 'تعذر الاتصال بالخادم'; err.style.display = 'block'; } }
        async function forgotPassword() { const email = document.getElementById('forgotEmail').value.trim(); const err = document.getElementById('forgotError'); const success = document.getElementById('forgotSuccess'); if (!email) { err.textContent = 'أدخل البريد الإلكتروني'; err.style.display = 'block'; return; } try { const res = await fetch(`${API}/forgot-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) }); if (res.ok) { success.textContent = 'تم إرسال رابط الاستعادة إلى بريدك الإلكتروني'; success.style.display = 'block'; err.style.display = 'none'; } else { const data = await res.json(); err.textContent = data.error; err.style.display = 'block'; } } catch (e) { err.textContent = 'تعذر الاتصال بالخادم'; err.style.display = 'block'; } }
        document.querySelectorAll('input').forEach(input => { input.addEventListener('input', () => { document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none'); }); });
    </script>
</body>
</html>
