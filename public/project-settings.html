<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إعدادات المشروع</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }

        .main { margin-right: var(--sidebar-w); padding: 2rem; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .back-link { color: var(--primary); text-decoration: none; font-size: 0.9rem; margin-bottom: 1rem; display: inline-block; }

        .settings-section { margin-bottom: 2rem; }
        .settings-section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); }
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); }
        .setting-info h3 { font-size: 0.95rem; font-weight: 600; }
        .setting-info p { font-size: 0.8rem; color: var(--text-light); margin-top: 0.25rem; }

        .toggle-switch { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
        .toggle-switch input { display: none; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #CBD5E0; transition: 0.3s; border-radius: 28px; }
        .toggle-slider:before { position: absolute; content: ""; height: 22px; width: 22px; right: 3px; bottom: 3px; background-color: white; transition: 0.3s; border-radius: 50%; }
        .toggle-switch input:checked + .toggle-slider { background-color: #2563EB; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(-24px); }

        select.setting-select { height: 36px; padding: 0 0.75rem; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; background: var(--card); color: var(--text); font-size: 0.85rem; }

        .save-bar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 1rem 0; margin-top: 2rem; display: flex; gap: 0.75rem; justify-content: flex-end; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #16A34A; color: white; padding: 0.75rem 1.5rem; border-radius: 12px; z-index: 9999; font-weight: 600; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }

        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 1rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .setting-row { flex-direction: column; align-items: flex-start; gap: 0.5rem; } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo"><span>📋 Nivora</span></div>
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
    <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
    <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
    <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
    <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
    <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
    <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
    <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg><span class="label">Workflows</span></a>
    <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">القوالب</span></a>
    <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg><span class="label">الأرشيف</span></a>
    <a href="chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="label">المحادثة</span></a>
    <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
    <a href="teams.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">فرق العمل</span></a>
</aside>

    <!-- Main Content -->
    <main class="main">
        <a href="projects.html" class="back-link">← العودة للمشاريع</a>
        <div class="topbar">
            <h1 id="pageTitle">⚙️ إعدادات المشروع</h1>
            <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" onclick="logout()" style="height:36px;">خروج</button>
            </div>
        </div>

        <div id="settingsContent">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- Bottom Nav (Mobile) -->
    <nav class="bottom-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        if (!projectId) window.location.href = 'projects.html';

        let currentSettings = {};

        async function loadSettings() {
            try {
                const res = await fetch(`${API_BASE}/projects/${projectId}/settings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                currentSettings = data.settings;

                document.getElementById('pageTitle').textContent = `⚙️ إعدادات: ${data.projectName}`;

                document.getElementById('settingsContent').innerHTML = `
                    <div class="card settings-section">
                        <h2>🔧 الميزات والأدوات</h2>
                        ${createToggle('enableChat', '💬 المحادثة', 'تفعيل المحادثة الفورية داخل المشروع')}
                        ${createToggle('enableFiles', '📁 الملفات والمجلدات', 'تفعيل إدارة الملفات والمجلدات داخل المشروع')}
                        ${createToggle('enableGantt', '📈 Gantt Chart', 'تفعيل عرض المخطط الزمني')}
                        ${createToggle('enableCalendar', '📅 التقويم', 'تفعيل عرض التقويم')}
                        ${createToggle('enableWorkflows', '🔄 سير العمل', 'تفعيل مسارات العمل المخصصة')}
                        ${createToggle('enableBudget', '💰 الميزانية', 'تفعيل متابعة الميزانية والمصروفات')}
                    </div>

                    <div class="card settings-section">
                        <h2>⚙️ إعدادات العرض</h2>
                        <div class="setting-row">
                            <div class="setting-info">
                                <h3>العرض الافتراضي</h3>
                                <p>طريقة العرض التي تظهر عند فتح المشروع</p>
                            </div>
                            <select class="setting-select" id="settingDefaultView" onchange="updateSetting('defaultView', this.value)">
                                <option value="kanban" ${currentSettings.defaultView === 'kanban' ? 'selected' : ''}>📌 Kanban</option>
                                <option value="list" ${currentSettings.defaultView === 'list' ? 'selected' : ''}>📋 قائمة</option>
                                <option value="gantt" ${currentSettings.defaultView === 'gantt' ? 'selected' : ''}>📈 Gantt</option>
                                <option value="calendar" ${currentSettings.defaultView === 'calendar' ? 'selected' : ''}>📅 تقويم</option>
                                <option value="table" ${currentSettings.defaultView === 'table' ? 'selected' : ''}>📊 جدول</option>
                            </select>
                        </div>
                    </div>

                    <div class="card settings-section">
                        <h2>🔒 الصلاحيات والمشاركة</h2>
                        ${createToggle('isPublic', '🌐 مشروع عام', 'السماح للأعضاء خارج الفريق بمشاهدة المشروع')}
                    </div>

                    <div class="save-bar">
                        <button class="btn btn-outline" onclick="window.location.href='projects.html'">إلغاء</button>
                        <button class="btn btn-primary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
                    </div>
                `;
            } catch (err) {
                document.getElementById('settingsContent').innerHTML = '<p style="text-align:center;color:#DC2626;">خطأ في تحميل الإعدادات</p>';
            }
        }

        function createToggle(key, title, description) {
            const checked = currentSettings[key] ? 'checked' : '';
            return `
                <div class="setting-row">
                    <div class="setting-info">
                        <h3>${title}</h3>
                        <p>${description}</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" ${checked} onchange="updateSetting('${key}', this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            `;
        }

        function updateSetting(key, value) {
            currentSettings[key] = value;
        }

        async function saveSettings() {
            try {
                const res = await fetch(`${API_BASE}/projects/${projectId}/settings`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(currentSettings)
                });
                
                if (res.ok) {
                    showToast('✅ تم حفظ الإعدادات بنجاح');
                } else {
                    showToast('❌ خطأ في حفظ الإعدادات');
                }
            } catch (err) {
                showToast('❌ تعذر الاتصال بالخادم');
            }
        }

        loadSettings();
    </script>
</body>
</html>
