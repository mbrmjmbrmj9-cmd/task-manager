<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إنشاء فريق</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .container { width: 100%; max-width: 440px; }
        .back { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--card); padding: 0.5rem 1rem; border-radius: var(--radius-full); color: var(--text-light); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .card { background: var(--card); border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .card h1 { text-align: center; font-size: 1.3rem; margin-bottom: 0.3rem; }
        .card .sub { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="container">
        <a href="setup-account.html" class="back">← رجوع</a>
        <div class="card">
            <h1>إنشاء فريق</h1>
            <p class="sub">بيانات الفريق</p>
            <div class="form-group"><input type="text" class="input" id="teamName" placeholder="اسم الفريق"></div>
            <div class="form-group"><input type="text" class="input" id="managerName" placeholder="اسم المدير"></div>
            <button class="btn btn-primary btn-block" id="createBtn" onclick="createTeam()">إنشاء</button>
        </div>
    </div>
    <script src="js/components.js"></script>
    <script>
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        async function createTeam() {
            const team = document.getElementById('teamName').value.trim();
            if (!team) { showToast('اسم الفريق مطلوب', 'warning'); return; }
            const btn = document.getElementById('createBtn'); setButtonLoading(btn, true, 'جاري...');
            try {
                const res = await fetch('https://nivora-t9ov.onrender.com/api/workspaces', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ name: team }) });
                const ws = await res.json();
                if (res.ok) { localStorage.setItem('workspaceId', ws._id); localStorage.setItem('inviteCode', ws.inviteCode); window.location.href = 'setup-members.html'; }
                else { showToast(ws.error, 'error'); }
            } catch (err) { showToast('خطأ', 'error'); }
            setButtonLoading(btn, false);
        }
    </script>
</body>
</html>
