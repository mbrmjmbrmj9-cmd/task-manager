<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إنشاء فريق</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #F1F5F9; font-family: 'Cairo', sans-serif; }
        .card { width: 90%; max-width: 480px; background: #FFFFFF; border-radius: 32px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .back { display: inline-block; background: #F1F5F9; padding: 0.4rem 1rem; border-radius: 20px; color: #64748B; text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .card h1 { font-size: 1.4rem; font-weight: 800; color: #1E293B; text-align: center; margin-bottom: 0.5rem; }
        .card .sub { text-align: center; color: #64748B; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .input-group { position: relative; margin-bottom: 1rem; }
        .input-group .icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94A3B8; width: 20px; height: 20px; pointer-events: none; }
        .input-group input { padding-right: 2.5rem; }
        .btn-full { width: 100%; height: 48px; border-radius: 12px; font-size: 1rem; }
        .btn-success { background: #22C55E; color: white; border: none; cursor: pointer; font-family: inherit; font-weight: 700; }
        .btn-success:hover { background: #16A34A; }
    </style>
</head>
<body>
    <div class="card">
        <a href="setup-account.html" class="back">← رجوع</a>
        <h1>Create Team</h1>
        <p class="sub">أدخل بيانات الفريق الأساسية</p>

        <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><input type="text" class="input" id="managerName" placeholder="اسم مدير الفريق"></div>
        <div class="input-group"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><input type="text" class="input" id="teamName" placeholder="اسم الفريق أو الشركة"></div>

        <button class="btn-full btn-success" onclick="createTeam()">Create Team</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function createTeam() {
            const manager = document.getElementById('managerName').value.trim();
            const team = document.getElementById('teamName').value.trim();
            if (!manager || !team) return alert('جميع الحقول مطلوبة');

            const res = await fetch('http://localhost:3000/api/workspaces', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name: team })
            });
            const ws = await res.json();
            localStorage.setItem('workspaceId', ws._id);
            localStorage.setItem('inviteCode', ws.inviteCode);
            window.location.href = 'setup-members.html';
        }
    </script>
</body>
</html>
