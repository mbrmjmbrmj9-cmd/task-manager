<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="أرسل استفسارك إلى فريق دعم Nivora.">
    <title>Nivora | تواصل معنا</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workspace.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/information.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <script src="js/theme.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/contact.js" defer></script>
</head>
<body class="workspace-shell" data-ui="legal">
    <header class="workspace-top">
        <a class="workspace-brand" href="index.html" aria-label="الصفحة الرئيسية لـ Nivora"><img src="img/logo.svg" alt="" width="34" height="34"><span>Nivora</span></a>
        <nav aria-label="الخصوصية والدعم">
            <a href="privacy.html">سياسة الخصوصية</a>
            <a href="terms.html">شروط الاستخدام</a>
            <a href="contact.html" aria-current="page">تواصل معنا</a>
        </nav>
    </header>
    <main class="workspace-content information-content">
        <section class="workspace-panel information-panel" aria-labelledby="contactHeading">
            <h1 id="contactHeading">تواصل معنا</h1>
            <p>أرسل استفسارك إلى فريق الدعم. سنستخدم بريدك الإلكتروني للرد.</p>
            <p>يمكنك أيضًا مراسلتنا على <a href="mailto:nivorasystem@gmail.com" dir="ltr">nivorasystem@gmail.com</a>.</p>
            <form id="contactForm" class="information-form" method="post" action="/api/contact">
                <div class="dialog-row">
                    <label class="workspace-label">الاسم
                        <input class="workspace-input" name="name" autocomplete="name" required maxlength="120">
                    </label>
                    <label class="workspace-label">الجوال (اختياري)
                        <input class="workspace-input" name="phone" type="tel" dir="ltr" autocomplete="tel" maxlength="40">
                    </label>
                </div>
                <label class="workspace-label">البريد الإلكتروني
                    <input class="workspace-input" name="email" type="email" dir="ltr" autocomplete="email" required maxlength="254">
                </label>
                <label class="workspace-label">الرسالة
                    <textarea class="workspace-input" name="message" rows="6" required maxlength="5000"></textarea>
                </label>
                <p>توضّح <a href="privacy.html">سياسة الخصوصية</a> كيف نعالج بيانات التواصل.</p>
                <div><button type="submit" class="workspace-button primary">إرسال الرسالة</button></div>
                <p id="contactStatus" class="workspace-status" role="status" hidden></p>
            </form>
        </section>
    </main>
</body>
</html>
