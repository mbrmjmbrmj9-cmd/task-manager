<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | Gantt</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .toolbar button { height: 32px; font-size: 0.8rem; padding: 0 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; cursor: pointer; }
        .toolbar button.active { background: var(--primary); color: white; }
        .gantt-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .gantt-table th, .gantt-table td { padding: 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; text-align: right; }
        .gantt-table th { background: #F1F5F9; font-weight: 700; }
        .gantt-bar-wrap { position: relative; height: 24px; }
        .gantt-bar { position: absolute; top: 4px; height: 16px; border-radius: 4px; min-width: 4px; }
        .gantt-bar.done { background: #22C55E; }
        .gantt-bar.progress { background: #2563EB; }
        .gantt-bar.new { background: #E2E8F0; }
        .gantt-bar.overdue { background: #EF4444; }
        .today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #EF4444; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 1rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .gantt-table { font-size: 0.7rem; } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="logo"><span>📋 Nivora</span></div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
        <a href="gantt.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg><span class="label">Workflows</span></a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">القوالب</span></a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">الأرشيف</span></a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
    </aside>
    <main class="main">
        <div class="topbar"><h1>📈 Gantt Chart</h1><div style="display:flex;gap:0.5rem;"><button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button><button class="btn btn-outline" onclick="logout()" style="height:36px;">خروج</button></div></div>
        <div class="toolbar"><button onclick="setZoom(20)">يوم</button><button onclick="setZoom(28)" class="active">أسبوع</button><button onclick="setZoom(40)">شهر</button><span style="flex:1;"></span><button onclick="exportPDF()">📥 PDF</button></div>
        <div style="overflow-x:auto;"><table class="gantt-table"><thead id="ganttHead"></thead><tbody id="ganttBody"></tbody></table></div>
    </main>
    <nav class="bottom-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        let DAY_WIDTH = 28, allTasks = [];
        function setZoom(w) { DAY_WIDTH = w; document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active')); if (w===20) document.querySelector('.toolbar button:nth-child(1)').classList.add('active'); if (w===28) document.querySelector('.toolbar button:nth-child(2)').classList.add('active'); if (w===40) document.querySelector('.toolbar button:nth-child(3)').classList.add('active'); renderGantt(); }
        async function loadGantt() { const res = await fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }); allTasks = await res.json(); renderGantt(); }
        function renderGantt() {
            const tasks = allTasks.filter(t => t.dueDate || t.startDate);
            if (!tasks.length) { document.getElementById('ganttBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;">لا توجد مهام</td></tr>'; return; }
            const dates = []; tasks.forEach(t => { if (t.startDate) dates.push(new Date(t.startDate)); if (t.dueDate) dates.push(new Date(t.dueDate)); });
            const min = new Date(Math.min(...dates)); min.setDate(min.getDate()-1);
            const max = new Date(Math.max(...dates)); max.setDate(max.getDate()+2);
            const days = Math.ceil((max-min)/(86400000));
            let head = '<tr><th>المهمة</th><th>الحالة</th>';
            for (let i=0; i<days; i++) { const d = new Date(min); d.setDate(d.getDate()+i); head += `<th style="width:${DAY_WIDTH}px;text-align:center;font-size:0.6rem;">${d.getDate()}/${d.getMonth()+1}</th>`; }
            head += '</tr>'; document.getElementById('ganttHead').innerHTML = head;
            let body = ''; const today = new Date();
            tasks.forEach(t => {
                const start = t.startDate ? new Date(t.startDate) : new Date(t.createdAt);
                const end = new Date(t.dueDate);
                const left = Math.floor((start-min)/86400000) * DAY_WIDTH;
                const w = Math.max(Math.ceil((end-start)/86400000), 1) * DAY_WIDTH;
                const cls = t.status==='done'?'done':t.status==='in-progress'?'progress':new Date(t.dueDate)<today?'overdue':'new';
                body += `<tr><td>${t.title}</td><td>${t.status==='done'?'✅':'🔄'}</td><td colspan="${days}" style="position:relative;"><div class="gantt-bar-wrap"><div class="gantt-bar ${cls}" style="left:${left}px;width:${w}px;"></div>`;
                const todayLeft = Math.floor((today-min)/86400000) * DAY_WIDTH;
                if (todayLeft>=0 && todayLeft<days*DAY_WIDTH) body += `<div class="today-line" style="left:${todayLeft}px;"></div>`;
                body += `</div></td></tr>`;
            });
            document.getElementById('ganttBody').innerHTML = body;
        }
        function exportPDF() { window.print(); }
        loadGantt();
    </script>
</body>
</html>
