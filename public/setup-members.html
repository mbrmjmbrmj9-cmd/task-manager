<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إضافة أعضاء</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563EB; --bg: #F8FAFC; --card: #FFFFFF; --text: #1E293B; --text-light: #64748B; --border: #E2E8F0; }
        body.dark { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --text-light: #94A3B8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; transition: background 0.3s; }
        .container { width: 100%; max-width: 500px; }
        .back { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--card); padding: 0.5rem 1rem; border-radius: 20px; color: var(--text-light); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .card { background: var(--card); border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.06); border: 1px solid var(--border); }
        .card h1 { font-size: 1.3rem; font-weight: 800; text-align: center; margin-bottom: 0.3rem; }
        .card .sub { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .card .invite-box { background: #EFF6FF; border-radius: 12px; padding: 1rem; text-align: center; margin-bottom: 1.5rem; }
        .card .invite-box .code { font-size: 1.5rem; font-weight: 800; letter-spacing: 3px; color: var(--primary); }
        .card .invite-box .label { font-size: 0.8rem; color: var(--text-light); margin-top: 0.25rem; }
        .add-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .add-row input { flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--border); padding: 0 0.75rem; font-family: inherit; font-size: 0.85rem; background: var(--bg); color: var(--text); }
        .btn-add { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; color: var(--primary); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        th, td { padding: 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; text-align: right; }
        th { color: var(--text-light); font-weight: 600; font-size: 0.75rem; }
        .btn-remove { background: none; border: none; cursor: pointer; color: #EF4444; font-size: 1rem; }
        .buttons { display: flex; gap: 1rem; }
        .btn-full { flex: 1; height: 46px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.95rem; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #1D4ED8; }
        .btn-outline { background: var(--card); color: var(--text-light); border: 2px solid var(--border); }
        .btn-outline:hover { background: var(--bg); }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="container">
        <a href="setup-team.html" class="back">← رجوع</a>
        <div class="card">
            <h1>إضافة أعضاء الفريق</h1>
            <p class="sub">أضف أعضاء فريقك أو شارك رمز الدعوة</p>
            <div class="invite-box">
                <div class="code" id="inviteCodeDisplay">---</div>
                <div class="label">رمز الدعوة - شاركه مع فريقك</div>
            </div>
            <div class="add-row">
                <input type="text" id="memberName" placeholder="اسم العضو">
                <input type="email" id="memberEmail" placeholder="البريد الإلكتروني">
                <button class="btn-add" onclick="addMember()">+</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>البريد</th><th></th></tr></thead><tbody id="memberBody"></tbody></table>
            <div class="buttons">
                <button class="btn-full btn-outline" onclick="finish()">تخطي</button>
                <button class="btn-full btn-primary" onclick="finish()">✅ إنهاء</button>
            </div>
        </div>
    </div>
    <script>
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        document.getElementById('inviteCodeDisplay').textContent = localStorage.getItem('inviteCode') || '---';
        let members = [];
        function addMember() { const name = document.getElementById('memberName').value.trim(); const email = document.getElementById('memberEmail').value.trim(); if (!name || !email) return; members.push({ name, email }); document.getElementById('memberName').value = ''; document.getElementById('memberEmail').value = ''; renderMembers(); }
        function renderMembers() { document.getElementById('memberBody').innerHTML = members.map((m, i) => `<tr><td>${m.name}</td><td>${m.email}</td><td><button class="btn-remove" onclick="members.splice(${i},1);renderMembers();">✕</button></td></tr>`).join(''); }
        function finish() { window.location.href = 'dashboard.html'; }
    </script>
</body>
</html>
