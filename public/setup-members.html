<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إضافة أعضاء</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #F1F5F9; font-family: 'Cairo', sans-serif; }
        .card { width: 90%; max-width: 520px; background: #FFFFFF; border-radius: 32px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .back { display: inline-block; background: #F1F5F9; padding: 0.4rem 1rem; border-radius: 20px; color: #64748B; text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .card h1 { font-size: 1.4rem; font-weight: 800; color: #1E293B; text-align: center; margin-bottom: 0.5rem; }
        .card .sub { text-align: center; color: #64748B; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .add-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .add-row input { flex: 1; }
        .btn-add { width: 48px; height: 48px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; cursor: pointer; font-size: 1.4rem; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { padding: 0.5rem; border-bottom: 1px solid #E2E8F0; font-size: 0.85rem; text-align: right; }
        th { color: #64748B; font-weight: 600; }
        .btn-remove { background: none; border: none; cursor: pointer; color: #EF4444; font-size: 1rem; }
        .buttons { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .btn-full { flex: 1; height: 48px; border-radius: 12px; font-size: 1rem; cursor: pointer; font-family: inherit; font-weight: 700; }
        .btn-success { background: #22C55E; color: white; border: none; }
        .btn-success:hover { background: #16A34A; }
        .btn-outline { background: #FFFFFF; color: #64748B; border: 2px solid #E2E8F0; }
    </style>
</head>
<body>
    <div class="card">
        <a href="setup-team.html" class="back">← رجوع</a>
        <h1>Add Team Members</h1>
        <p class="sub">أضف أعضاء فريقك أو تخطَّ هذه الخطوة</p>
        <div class="add-row"><input type="email" class="input" id="memberEmail" placeholder="البريد الإلكتروني"><input type="text" class="input" id="memberName" placeholder="اسم العضو"><button class="btn-add" onclick="addMember()">+</button></div>
        <table><thead><tr><th>الاسم</th><th>البريد</th><th></th></tr></thead><tbody id="memberBody"></tbody></table>
        <div class="buttons"><button class="btn-full btn-outline" onclick="finish()">تخطي</button><button class="btn-full btn-success" onclick="finish()">التالي</button></div>
    </div>

    <script>
        let members = [];
        function addMember() { const email = document.getElementById('memberEmail').value.trim(); const name = document.getElementById('memberName').value.trim(); if (!email || !name) return; members.push({ email, name }); document.getElementById('memberEmail').value = ''; document.getElementById('memberName').value = ''; render(); }
        function render() { document.getElementById('memberBody').innerHTML = members.map((m, i) => `<tr><td>${m.name}</td><td>${m.email}</td><td><button class="btn-remove" onclick="members.splice(${i},1);render();">✕</button></td></tr>`).join(''); }
        function finish() { alert(`تم الإعداد! رمز الدعوة: ${localStorage.getItem('inviteCode')}`); window.location.href = 'index.html'; }
    </script>
</body>
</html>
