<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إضافة أعضاء</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .container { width: 100%; max-width: 500px; }
        .back { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--card); padding: 0.5rem 1rem; border-radius: var(--radius-full); color: var(--text-light); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .card { background: var(--card); border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .card h1 { text-align: center; font-size: 1.3rem; margin-bottom: 0.3rem; }
        .card .sub { text-align: center; color: var(--text-light); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .invite-box { background: var(--primary-light); border-radius: var(--radius); padding: 1rem; text-align: center; margin-bottom: 1.5rem; }
        .invite-box .code { font-size: 1.5rem; font-weight: 800; letter-spacing: 3px; color: var(--primary); }
        .add-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .btn-add { width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; color: var(--primary); flex-shrink: 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        th, td { padding: 0.5rem; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; text-align: right; }
        th { color: var(--text-light); font-size: 0.75rem; }
        .btn-remove { background: none; border: none; cursor: pointer; color: var(--danger); font-size: 1rem; }
        .buttons { display: flex; gap: 1rem; }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="container">
        <a href="setup-team.html" class="back">← رجوع</a>
        <div style="text-align:center;margin-bottom:1.5rem;">
    <img src="img/logo.svg" alt="Nivora" style="width:60px;height:60px;">
</div>
        <div class="card">
            <h1>إضافة أعضاء</h1>
            <p class="sub">أضف أعضاء أو شارك الرمز</p>
            <div class="invite-box"><div class="code" id="inviteCodeDisplay">---</div><p style="font-size:0.8rem;color:var(--text-muted);margin-top:0.25rem;">رمز الدعوة</p></div>
            <div class="add-row">
                <input type="text" class="input" id="memberName" placeholder="الاسم" style="flex:1;">
                <input type="email" class="input" id="memberEmail" placeholder="البريد" style="flex:1;">
                <button class="btn-add" onclick="addMember()">+</button>
            </div>
            <table><thead><tr><th>الاسم</th><th>البريد</th><th></th></tr></thead><tbody id="memberBody"></tbody></table>
            <div class="buttons">
                <button class="btn btn-outline" onclick="finish()" style="flex:1;">تخطي</button>
                <button class="btn btn-primary" onclick="finish()" style="flex:1;">إنهاء</button>
            </div>
        </div>
    </div>
    <script src="js/components.js"></script>
    <script>
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        document.getElementById('inviteCodeDisplay').textContent = localStorage.getItem('inviteCode') || '---';
        let members = [];
        function addMember() { const name = document.getElementById('memberName').value.trim(); const email = document.getElementById('memberEmail').value.trim(); if (!name || !email) { showToast('املأ الحقول', 'warning'); return; } members.push({ name, email }); document.getElementById('memberName').value = ''; document.getElementById('memberEmail').value = ''; renderMembers(); }
        function renderMembers() { document.getElementById('memberBody').innerHTML = members.map((m, i) => `<tr><td>${m.name}</td><td>${m.email}</td><td><button class="btn-remove" onclick="members.splice(${i},1);renderMembers();">✕</button></td></tr>`).join(''); }
        function finish() { window.location.href = 'dashboard.html'; }
    </script>
</body>
</html>
