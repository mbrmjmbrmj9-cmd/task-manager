<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | Kanban</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        body { min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .project-title { font-size: 0.85rem; color: var(--text-light); }
        .view-nav { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 0.75rem; overflow-x: auto; }
        .view-nav a { padding: 0.5rem 0.85rem; font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
        .view-nav a:hover { color: var(--primary); }
        .view-nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select { height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0 0.5rem; font-family: inherit; font-size: 0.8rem; background: var(--bg); color: var(--text); }
        .toolbar input { flex: 1; min-width: 150px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(2px); }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: modalIn 0.2s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 1.5rem 1.5rem 0.75rem; }
        .modal-header h3 { font-size: 1.1rem; font-weight: 800; flex: 1; line-height: 1.5; }
        .modal-close { background: var(--secondary-light); border: none; font-size: 1rem; cursor: pointer; color: var(--text-light); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .modal-close:hover { background: var(--danger-light); color: var(--danger); }
        .modal-body { padding: 0.75rem 1.5rem 1.5rem; }
        .detail-section { margin-bottom: 1.25rem; }
        .detail-section label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-light); margin-bottom: 0.4rem; }
        .detail-section input, .detail-section textarea { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0.6rem 0.75rem; font-family: inherit; font-size: 0.88rem; background: var(--bg); color: var(--text); }
        .detail-section textarea { resize: vertical; min-height: 70px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .opt-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .opt-btn { padding: 0.45rem 0.75rem; border-radius: var(--radius-sm); border: 2px solid var(--border); cursor: pointer; font-size: 0.82rem; background: none; font-family: inherit; transition: all var(--transition-fast); }
        .opt-btn:hover { border-color: var(--primary); }
        .opt-btn.sel { border-color: var(--primary); background: var(--primary-light); }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; }
        .toggle-sw { width: 46px; height: 26px; background: var(--disabled); border-radius: 13px; cursor: pointer; position: relative; transition: background var(--transition); }
        .toggle-sw.on { background: var(--primary); }
        .toggle-sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: right var(--transition); }
        .toggle-sw.on::after { right: 23px; }
        .comment-item { background: var(--secondary-light); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem; }
        .comment-item .cu { font-weight: 700; font-size: 0.8rem; }
        .comment-item .ct { font-size: 0.85rem; margin-top: 0.25rem; }
        .comment-item .ctm { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.25rem; }
        .comment-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .comment-row input { flex: 1; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0 0.75rem; font-family: inherit; font-size: 0.85rem; background: var(--bg); color: var(--text); }
        .file-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; }
        .drop-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 0.75rem; transition: all var(--transition); }
        .drop-area:hover { border-color: var(--primary); color: var(--primary); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 0.75rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .kanban { flex-direction: column; } .column { min-width: auto; max-height: none; } .detail-grid { grid-template-columns: 1fr; } }
    </style>
<script src="js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/kanban.css">
    <script src="js/theme.js" defer></script>
    <script src="js/notifications.js" defer></script>
</head>
<body data-ui="app" class="kanban-page">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <aside id="sidebar" class="shell-rail"></aside>

    <main class="main">
        <div class="topbar">
            <div><h1>Kanban</h1><p class="project-title" id="projectTitle"></p></div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <div style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;" onclick="window.location.href='profile.html'">
                    <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:var(--secondary-light);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:var(--text-light);overflow:hidden;"></div>
                    <span id="topUsername" style="font-size:0.8rem;font-weight:600;"></span>
                </div>
                <select id="projectFilter" onchange="loadKanban()" style="height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);padding:0 0.5rem;font-family:inherit;font-size:0.8rem;background:var(--bg);color:var(--text);"><option value="">كل المشاريع</option></select>
                <!-- زر الإشعارات -->
<div style="position:relative;">
    <button class="btn btn-ghost btn-icon" id="notifBtn" style="width:36px;height:36px;position:relative;">
        🔔
        <span id="notifBadge" style="display:none;position:absolute;top:2px;left:2px;background:var(--danger);color:#fff;font-size:0.6rem;font-weight:700;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;"></span>
    </button>
    <div id="notifDropdown" style="display:none;position:absolute;top:42px;left:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:320px;max-height:400px;overflow-y:auto;z-index:500;">
        <div style="padding:0.85rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:0.9rem;">الإشعارات</strong>
            <button data-mark-all style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:0.75rem;font-weight:600;">تعليم الكل</button>
        </div>
        <div id="notifList"></div>
    </div>
</div>
                <button class="btn btn-ghost btn-icon" onclick="toggleDark()" id="darkBtn" style="width:36px;height:36px;">🌙</button>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="view-nav">
            <a href="tasks.html">📋 قائمة</a>
            <a href="kanban.html" class="active">📌 أعمدة</a>
            <a href="gantt.html">📈 Gantt</a>
            <a href="calendar.html">📅 تقويم</a>
            <a href="reports.html">📉 إحصائيات</a>
        </div>

        <div class="toolbar">
            <input type="search" id="searchInput" aria-label="البحث في المهام" placeholder="ابحث عن مهمة…" oninput="debouncedRender()" maxlength="120">
            <select id="assigneeFilter" aria-label="تصفية حسب المسؤول" onchange="renderBoard(allTasks)"><option value="">كل المسؤولين</option></select>
            <span id="boardCount" class="board-count" aria-live="polite"></span>
            <button class="btn btn-outline btn-sm" id="refreshBoard" onclick="loadKanban()">تحديث اللوحة</button>
        </div>

        <p class="board-instruction" id="boardInstruction">اسحب البطاقة إلى العمود المطلوب، أو استخدم قائمة النقل داخلها.</p>
        <div class="kanban" id="kanbanBoard" role="region" aria-label="لوحة Kanban" aria-describedby="boardInstruction" tabindex="0"></div>
        <p id="boardFeedback" class="board-feedback" role="status" aria-live="polite"></p>
    </main>

    <div class="modal-overlay" id="detailsModal" onclick="if(event.target===this)closeM('detailsModal')">
        <div class="modal">
            <div class="modal-header"><h3 id="detailsTitle"></h3><button class="modal-close" onclick="closeM('detailsModal')">✕</button></div>
            <div class="modal-body" id="detailsBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="quickAddModal" onclick="if(event.target===this)closeQuickAdd()">
        <div class="modal" style="max-width:400px;">
            <div class="modal-header"><h3>+ مهمة جديدة</h3><button class="modal-close" onclick="closeQuickAdd()">✕</button></div>
            <div class="modal-body">
                <div class="form-group"><label for="quickAddTitle">عنوان المهمة</label><input type="text" class="input" id="quickAddTitle" placeholder="أدخل العنوان" maxlength="200" onkeydown="if(event.key==='Enter'){event.preventDefault();submitQuickAdd();}"></div>
            </div>
            <div class="modal-footer" style="padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:0.5rem;">
                <button class="btn btn-outline" onclick="closeQuickAdd()">إلغاء</button>
                <button class="btn btn-primary" id="quickAddBtn" onclick="submitQuickAdd()">إنشاء</button>
            </div>
        </div>
    </div>

    <script src="js/components.js"></script>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = Nivora.apiBase;
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        function closeM(id) {
            document.getElementById(id).classList.remove('show');
            if (id === 'detailsModal') { currentTaskId = null; detailSequence++; }
        }
        function closeQuickAdd() { document.getElementById('quickAddModal').classList.remove('show'); document.getElementById('quickAddTitle').value = ''; }

        const statuses = ['new', 'ready', 'in-progress', 'review', 'done', 'blocked'];
        const labels = { 'new': 'متاحة', ready: 'جاهزة', 'in-progress': 'قيد التنفيذ', 'review': 'مراجعة', 'done': 'مكتملة', 'blocked': 'متعثرة' };
        const icons = { 'new': '📥', ready: '📋', 'in-progress': '⚙️', 'review': '👁️', 'done': '✅', 'blocked': '🚫' };
        const priorities = ['critical', 'high', 'medium', 'low'];
        const pLabels = { critical: 'حرجة', high: 'عالية', medium: 'متوسطة', low: 'منخفضة' };
        let allTasks = [], allProjects = [], currentTaskId = null, quickAddStatus = 'new';
        const debouncedRender = debounce(() => renderBoard(allTasks), 200);

        document.addEventListener('DOMContentLoaded', () => {
            const avatar = document.getElementById('topAvatar');
            const username = document.getElementById('topUsername');
            if (username) username.textContent = user.fullName || user.username || 'مستخدم';
            if (avatar) {
                if (user.avatar) avatar.innerHTML = `<img src="${safeImageUrl(user.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                else avatar.textContent = getInitials(user.fullName || user.username);
            }
        });

        async function loadProjects() {
            allProjects = await Nivora.api('/projects', { workspace: true, params: { view: 'options' } });
            const sel = document.getElementById('projectFilter');
            sel.innerHTML = '<option value="">كل المشاريع</option>' + allProjects.map(p => `<option value="${p._id}">${escapeHtml(p.name)}</option>`).join('');
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('projectId');
            if (pid) { sel.value = pid; document.getElementById('projectTitle').textContent = '📁 ' + (allProjects.find(p => p._id === pid)?.name || ''); }
        }

        let boardRequest;
        async function loadKanban() {
            boardRequest?.abort();
            const controller = new AbortController();
            boardRequest = controller;
            const board = document.getElementById('kanbanBoard');
            const refresh = document.getElementById('refreshBoard');
            document.getElementById('boardFeedback').textContent = '';
            board.setAttribute('aria-busy', 'true');
            refresh.disabled = true;
            if (!board.childElementCount) renderBoard([]);
            try {
                const pid = document.getElementById('projectFilter').value;
                const tasks = await Nivora.api('/tasks', { workspace: true, signal: controller.signal,
                    params: { projectId: pid, view: 'board' } });
                if (controller.signal.aborted) return;
                allTasks = tasks;
                if (pid) document.getElementById('projectTitle').textContent = '📁 ' + (allProjects.find(p => p._id === pid)?.name || '');
                else document.getElementById('projectTitle').textContent = '';
                const assignees = [...new Set(allTasks.map(t => t.assignee).filter(Boolean))];
                const assigneeFilter = document.getElementById('assigneeFilter');
                const selection = assigneeFilter.value;
                assigneeFilter.innerHTML = '<option value="">كل المسؤولين</option>' + assignees.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
                assigneeFilter.value = assignees.includes(selection) ? selection : '';
                board.removeAttribute('aria-busy');
                renderBoard(allTasks);
            } catch (err) {
                if (!controller.signal.aborted) {
                    board.removeAttribute('aria-busy');
                    renderBoard(allTasks);
                    document.getElementById('boardFeedback').textContent = err.status ? err.message : 'تعذر تحميل اللوحة. اضغط تحديث للمحاولة مجددًا.';
                }
            } finally {
                if (boardRequest === controller) {
                    board.removeAttribute('aria-busy');
                    refresh.disabled = false;
                }
            }
        }

        function renderBoard(tasks) {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const a = document.getElementById('assigneeFilter').value;
            let filtered = tasks;
            if (q) filtered = filtered.filter(t => t.title.toLowerCase().includes(q));
            if (a) filtered = filtered.filter(t => t.assignee === a);
            const grouped = new Map(statuses.map(status => [status, []]));
            for (const task of filtered) grouped.get(task.status)?.push(task);
            const visible = [...grouped.values()].reduce((total, tasks) => total + tasks.length, 0);
            document.getElementById('boardCount').textContent = visible.toLocaleString('ar-SA') + ' مهمة';
            const board = document.getElementById('kanbanBoard');
            const loading = board.getAttribute('aria-busy') === 'true';
            const scrollPositions = new Map([...board.querySelectorAll('.column')].map(column => [column.dataset.status, column.querySelector('.task-list').scrollTop]));
            board.innerHTML = statuses.map(status => {
                const columnTasks = grouped.get(status);
                return `<section class="column" data-status="${status}" aria-labelledby="column-${status}" ondragover="dragOverColumn(event)" ondragleave="leaveColumn(event)" ondrop="dropTask(event,'${status}')">
                    <header class="column-header">
                        <h2 id="column-${status}"><span class="column-dot" aria-hidden="true"></span>${labels[status]}</h2>
                        <span class="col-count" aria-label="عدد المهام">${columnTasks.length.toLocaleString('ar-SA')}</span>
                        <button class="column-add" type="button" aria-label="إضافة مهمة إلى ${labels[status]}" onclick="openQuickAdd('${status}')">+</button>
                    </header>
                    <div class="task-list">
                        ${columnTasks.length ? columnTasks.map(renderCard).join('') : loading ? '<div class="empty-column">جارٍ تحميل المهام…</div>' : '<div class="empty-column"><span>لا توجد مهام هنا</span><small>أضف مهمة أو انقل بطاقة إلى هذا العمود</small></div>'}
                        <div class="drop-zone">أفلت البطاقة هنا</div>
                    </div>
                    <button class="add-task-btn" type="button" onclick="openQuickAdd('${status}')"><span aria-hidden="true">+</span> إضافة مهمة</button>
                </section>`;
            }).join('');
            for (const column of board.querySelectorAll('.column')) {
                column.querySelector('.task-list').scrollTop = scrollPositions.get(column.dataset.status) || 0;
            }
        }

        const cardIcons = {
            grip: '<circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/>',
            date: '<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16"/>',
            comments: '<path d="M20 11a8 8 0 0 1-8 8H8l-5 3V11a8 8 0 0 1 17 0Z"/>',
            files: '<path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9"/>'
        };
        function cardIcon(name) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + cardIcons[name] + '</svg>';
        }
        function renderCard(t) {
            const due = Nivora.taskDateKey(t.dueDate);
            const today = Nivora.dateKey(new Date());
            const isOverdue = due && due < today && t.status !== 'done';
            const dueToday = due === today && t.status !== 'done';
            const cCount = t.comments?.length ?? t.commentCount ?? 0;
            const aCount = t.attachments?.length ?? t.attachmentCount ?? 0;
            const priority = Object.hasOwn(pLabels, t.priority) ? t.priority : 'medium';
            const project = allProjects.find(project => project._id === t.projectId)?.name || t.project;
            const busy = movingTasks.has(t._id);
            return `<article class="task-card" draggable="${!busy}" aria-busy="${busy}" data-id="${t._id}" aria-label="${escapeHtml(t.title)}" ondragstart="dragTask(event,'${t._id}')" ondragend="endDrag()">
                <div class="card-top">
                    <span class="priority-pill" data-priority="${priority}">${pLabels[priority]}</span>
                    <span class="card-grip" aria-hidden="true">${cardIcon('grip')}</span>
                </div>
                <button class="card-title-button" type="button" onclick="openDetails('${t._id}')">${escapeHtml(t.title)}</button>
                ${project && !document.getElementById('projectFilter').value ? `<p class="card-project">${escapeHtml(project)}</p>` : ''}
                ${due ? `<div class="card-date ${isOverdue ? 'overdue' : dueToday ? 'due-today' : ''}">${cardIcon('date')}<span>${isOverdue ? 'متأخرة · ' : dueToday ? 'اليوم · ' : ''}${formatDate(t.dueDate)}</span></div>` : ''}
                <div class="card-bottom">
                    <div class="card-assignee" title="${escapeHtml(t.assignee || 'دون إسناد')}">
                        <span class="avatar-sm" aria-hidden="true">${t.assignee ? escapeHtml(getInitials(t.assignee)) : '—'}</span>
                        <span class="assignee-name">${escapeHtml(t.assignee || 'دون إسناد')}</span>
                    </div>
                    ${cCount ? `<button class="card-count" type="button" aria-label="التعليقات، ${cCount}" onclick="openDetails('${t._id}','comments')">${cardIcon('comments')}${cCount}</button>` : ''}
                    ${aCount ? `<button class="card-count" type="button" aria-label="المرفقات، ${aCount}" onclick="openDetails('${t._id}','files')">${cardIcon('files')}${aCount}</button>` : ''}
                </div>
                <label class="card-move"><span>نقل إلى</span>
                    <select ${busy ? 'disabled' : ''} aria-label="نقل المهمة ${escapeHtml(t.title)}" onchange="moveCard('${t._id}',this.value)">
                        ${statuses.map(status => `<option value="${status}" ${t.status === status ? 'selected' : ''}>${labels[status]}</option>`).join('')}
                    </select>
                </label>
            </article>`;
        }

        let draggedTask = null;
        const movingTasks = new Set();
        function dragTask(event, id) {
            if (movingTasks.has(id)) { event.preventDefault(); return; }
            draggedTask = id;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', id);
            event.currentTarget.classList.add('dragging');
        }
        function endDrag() {
            draggedTask = null;
            document.querySelectorAll('.dragging, .drag-over').forEach(element => element.classList.remove('dragging', 'drag-over'));
        }
        function dragOverColumn(event) {
            if (!draggedTask) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('drag-over');
            const list = event.currentTarget.querySelector('.task-list');
            const bounds = list.getBoundingClientRect();
            if (event.clientY > bounds.bottom - 55) list.scrollTop += 14;
            if (event.clientY < bounds.top + 55) list.scrollTop -= 14;
            const board = document.getElementById('kanbanBoard');
            const boardBounds = board.getBoundingClientRect();
            if (event.clientX < boardBounds.left + 65) board.scrollLeft -= 18;
            if (event.clientX > boardBounds.right - 65) board.scrollLeft += 18;
        }
        function leaveColumn(event) {
            if (!event.currentTarget.contains(event.relatedTarget)) event.currentTarget.classList.remove('drag-over');
        }
        function storeTask(task) {
            const index = allTasks.findIndex(row => row._id === task._id);
            if (index >= 0) allTasks[index] = task;
            else allTasks.unshift(task);
            renderBoard(allTasks);
        }
        async function dropTask(event, status) {
            event.preventDefault();
            const id = event.dataTransfer.getData('text/plain');
            if (id !== draggedTask) return;
            endDrag();
            await moveCard(id, status);
        }
        async function moveCard(id, status) {
            const task = allTasks.find(task => task._id === id);
            if (!task || movingTasks.has(id) || !statuses.includes(status) || task.status === status) return;
            movingTasks.add(id);
            const card = document.querySelector('.task-card[data-id="' + id + '"]');
            card?.setAttribute('aria-busy', 'true');
            card?.querySelectorAll('button,select').forEach(control => { control.disabled = true; });
            const feedback = document.getElementById('boardFeedback');
            feedback.textContent = 'جارٍ نقل المهمة…';
            try {
                const result = await Nivora.api('/tasks/' + id, { method: 'PATCH', data: { status } });
                boardRequest?.abort();
                storeTask(result.task);
                feedback.textContent = 'نُقلت «' + task.title + '» إلى ' + labels[status] + '.';
            } catch (error) {
                renderBoard(allTasks);
                feedback.textContent = error.message;
                showToast(error.message, 'error');
            } finally {
                movingTasks.delete(id);
                const current = document.querySelector('.task-card[data-id="' + id + '"]');
                current?.setAttribute('aria-busy', 'false');
                current?.setAttribute('draggable', 'true');
                current?.querySelectorAll('button,select').forEach(control => { control.disabled = false; });
                current?.querySelector('select')?.focus({ preventScroll: true });
            }
        }

        function openQuickAdd(status) { quickAddStatus = status; document.getElementById('quickAddModal').classList.add('show'); document.getElementById('quickAddTitle').focus(); }
        async function submitQuickAdd() {
            const title = document.getElementById('quickAddTitle').value.trim();
            if (!title) { showToast('العنوان مطلوب', 'warning'); return; }
            const btn = document.getElementById('quickAddBtn');
            if (btn.disabled) return;
            setButtonLoading(btn, true, 'جاري...');
            const pid = document.getElementById('projectFilter').value;
            try {
                const task = await Nivora.api('/tasks', { method: 'POST',
                    data: { title, status: quickAddStatus, projectId: pid || null, workspaceId: Nivora.workspaceId() } });
                boardRequest?.abort();
                storeTask(task);
                closeQuickAdd();
                showToast('تمت الإضافة', 'success');
            } catch (error) { showToast(error.message, 'error'); }
            finally { setButtonLoading(btn, false); }
        }

        let detailSequence = 0;
        async function openDetails(id, tab) {
            currentTaskId = id;
            const sequence = ++detailSequence;
            const known = allTasks.find(task => task._id === id);
            if (!known) return;
            document.getElementById('detailsTitle').textContent = '📋 ' + known.title;
            document.getElementById('detailsBody').textContent = 'جارٍ تحميل تفاصيل المهمة…';
            document.getElementById('detailsModal').classList.add('show');
            try {
                const task = await Nivora.api('/tasks/' + id);
                if (sequence !== detailSequence || currentTaskId !== id) return;
                storeTask(task);
                renderDetails(task, tab);
            } catch (error) {
                if (sequence === detailSequence) document.getElementById('detailsBody').textContent = error.message;
            }
        }

        function renderDetails(t, tab) {
            const id = t._id;
            const cCount = t.comments?.length || 0;
            const aCount = t.attachments?.length || 0;
            const comments = t.comments || [];
            const attachments = t.attachments || [];
            document.getElementById('detailsTitle').textContent = '📋 ' + t.title;
            let html = `
                <div class="detail-section"><label>✎ العنوان</label><input type="text" id="detTitle" value="${escapeHtml(t.title)}" onchange="saveField('title',this.value)"></div>
                <div class="detail-section"><label>📝 الوصف</label><textarea id="detDesc" onchange="saveField('description',this.value)">${escapeHtml(t.description || '')}</textarea></div>
                <div class="detail-grid">
                    <div class="detail-section"><label>👤 المسؤول</label><input type="text" id="detAssignee" value="${escapeHtml(t.assignee || '')}" onchange="saveField('assignee',this.value)"></div>
                    <div class="detail-section"><label>📅 تاريخ الاستحقاق</label><input type="date" id="detDueDate" value="${t.dueDate ? new Date(t.dueDate).toISOString().split('T')[0] : ''}" onchange="saveField('dueDate',this.value)"></div>
                    <div class="detail-section"><label>📅 تاريخ البداية</label><input type="date" id="detStartDate" value="${t.startDate ? new Date(t.startDate).toISOString().split('T')[0] : ''}" onchange="saveField('startDate',this.value)"></div>
                </div>
                <div class="detail-section"><label>🚩 الأولوية</label><div class="opt-group">${priorities.map(p => `<button class="opt-btn ${t.priority === p ? 'sel' : ''}" onclick="chPri('${p}')">${pLabels[p]}</button>`).join('')}</div></div>
                <div class="detail-section"><label>● الحالة</label><div class="opt-group">${statuses.map(s => `<button class="opt-btn ${t.status === s ? 'sel' : ''}" onclick="chStat('${s}')">${icons[s]} ${labels[s]}</button>`).join('')}</div></div>
                <div class="detail-section">
                    <label>📎 الملفات (${aCount})</label>
                    ${attachments.length === 0 ? '<p class="detail-empty">لا توجد مرفقات</p>' : ''}
                    ${attachments.map(a => `<div class="file-item"><span>📎</span><a href="${Nivora.page('task.html', { id: currentTaskId, tab: 'attachments' })}">${escapeHtml(a.name)}</a><button class="btn-delete-sm" onclick="delAtt('${a._id}')">🗑️</button></div>`).join('')}
                    <div style="margin-top:0.75rem;display:flex;gap:0.5rem;"><input type="file" id="fileUpload" style="display:none;" onchange="upFileDet()"><button class="btn btn-primary btn-sm" onclick="document.getElementById('fileUpload').click()">📁 رفع ملف</button></div>
                    <div class="drop-area" ondragover="event.preventDefault()" ondrop="dropFile(event)">📥 أفلت الملفات هنا</div>
                    <a href="task.html?id=${id}&tab=attachments" class="btn btn-outline btn-sm" style="width:100%;text-align:center;text-decoration:none;margin-top:0.5rem;display:block;">📋 فتح الملفات كاملة</a>
                </div>
                <div class="detail-section">
                    <label>💬 التعليقات (${cCount})</label>
                    ${comments.length === 0 ? '<p class="detail-empty">لا توجد تعليقات</p>' : ''}
                    ${comments.map(c => `<div class="comment-item"><div class="cu">${escapeHtml(c.username || 'مستخدم')}</div><div class="ct">${escapeHtml(c.text)}</div><div class="ctm">${formatDateTime(c.createdAt)}</div></div>`).join('')}
                    <div class="comment-row"><input type="text" id="commentInput" placeholder="اكتب تعليقاً... @ للإشارة"><button class="btn btn-primary btn-sm" onclick="addCommentDet()">إرسال</button></div>
                    <a href="task.html?id=${id}&tab=comments" class="btn btn-outline btn-sm" style="width:100%;text-align:center;text-decoration:none;margin-top:0.5rem;display:block;">📋 فتح التعليقات كاملة</a>
                </div>`;
            document.getElementById('detailsBody').innerHTML = html;
            document.getElementById('detailsModal').classList.add('show');
            if (tab === 'comments') setTimeout(() => document.getElementById('commentInput')?.scrollIntoView({ behavior: 'smooth' }), 300);
            if (tab === 'files') setTimeout(() => document.querySelector('.drop-area')?.scrollIntoView({ behavior: 'smooth' }), 300);
        }

        let detailSave = Promise.resolve();
        function updateDetails(id, suffix, method, data, tab, redraw = true) {
            detailSave = detailSave.then(async () => {
                try {
                    const result = await Nivora.api('/tasks/' + id + suffix, { method, data });
                    const task = result.task || result;
                    boardRequest?.abort();
                    storeTask(task);
                    if (currentTaskId === id) {
                        document.getElementById('detailsTitle').textContent = '📋 ' + task.title;
                        if (redraw) renderDetails(task, tab);
                    }
                    return true;
                } catch (error) {
                    showToast(error.message, 'error');
                    return false;
                }
            });
            return detailSave;
        }
        function saveField(field, value) {
            if (!currentTaskId) return;
            return updateDetails(currentTaskId, '', 'PATCH', { [field]: value }, null, false);
        }
        function chPri(priority) {
            return updateDetails(currentTaskId, '', 'PATCH', { priority });
        }
        function chStat(status) {
            return updateDetails(currentTaskId, '', 'PATCH', { status });
        }
        async function addCommentDet() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            const button = input.nextElementSibling;
            if (!text || !currentTaskId || button.disabled) return;
            button.disabled = true;
            try {
                if (await updateDetails(currentTaskId, '/comments', 'POST', { text }, 'comments')) showToast('تمت الإضافة');
            } finally { button.disabled = false; }
        }
        async function uploadBoardFile(file) {
            if (!file || !currentTaskId) return;
            const input = document.getElementById('fileUpload');
            if (input.disabled) return;
            input.disabled = true;
            try { await updateDetails(currentTaskId, '/attachments/upload', 'POST', Nivora.uploadData(file), 'files'); }
            finally { input.disabled = false; }
        }
        function upFileDet() { uploadBoardFile(document.getElementById('fileUpload').files[0]); }
        function dropFile(event) { event.preventDefault(); uploadBoardFile(event.dataTransfer.files[0]); }
        function delAtt(aid) {
            const id = currentTaskId;
            confirmDialog({ title: 'حذف المرفق', message: 'حذف هذا المرفق؟', confirmText: 'حذف',
                onConfirm: () => updateDetails(id, '/attachments/' + aid, 'DELETE', undefined, 'files') });
        }
        const initialProject = new URLSearchParams(location.search).get('projectId');
        if (initialProject) {
            document.getElementById('projectFilter').add(new Option('المشروع المحدد', initialProject));
            document.getElementById('projectFilter').value = initialProject;
        }
        loadProjects().catch(error => showToast(error.message, 'error'));
        loadKanban();
    </script>
</body>
</html>
