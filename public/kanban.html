<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | Kanban</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select { height: 36px; border-radius: 8px; border: 1px solid var(--border); padding: 0 0.5rem; font-family: inherit; font-size: 0.8rem; background: var(--card); color: var(--text); }
        .toolbar input { flex: 1; min-width: 150px; }
        .kanban { display: flex; gap: 1rem; flex: 1; overflow-x: auto; padding-bottom: 1rem; }
        .column { flex: 1; min-width: 280px; background: #F1F5F9; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; max-height: calc(100vh - 250px); }
        body.dark .column { background: #1E293B; }
        .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .column-header h3 { font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .count { background: var(--card); padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
        .task-list { flex: 1; overflow-y: auto; }
        .task-card { background: var(--card); border-radius: 10px; padding: 0.85rem; margin-bottom: 0.5rem; border-right: 4px solid #E2E8F0; cursor: pointer; position: relative; transition: all 0.2s; }
        .task-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(-1px); }
        .task-card.dragging { opacity: 0.5; transform: rotate(3deg); }
        .task-card.priority-critical { border-right-color: #EF4444; }
        .task-card.priority-high { border-right-color: #F97316; }
        .task-card.priority-medium { border-right-color: #EAB308; }
        .task-card.priority-low { border-right-color: #22C55E; }
        .task-card .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .task-card .priority-badge { font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 600; }
        .task-card .priority-critical-label { background: #FEE2E2; color: #DC2626; }
        .task-card .priority-high-label { background: #FFF7ED; color: #EA580C; }
        .task-card .priority-medium-label { background: #FEF9C3; color: #CA8A04; }
        .task-card .priority-low-label { background: #F0FDF4; color: #16A34A; }
        .task-card .card-menu { background: none; border: none; cursor: pointer; color: var(--text-light); font-size: 1rem; padding: 0; line-height: 1; }
        .task-card .card-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.3rem; line-height: 1.4; }
        .task-card .card-desc { font-size: 0.75rem; color: var(--text-light); margin-bottom: 0.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .task-card .card-meta { display: flex; gap: 0.5rem; font-size: 0.72rem; color: var(--text-light); flex-wrap: wrap; align-items: center; margin-bottom: 0.5rem; }
        .task-card .card-meta span { display: flex; align-items: center; gap: 0.2rem; }
        .task-card .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: var(--text-light); border-top: 1px solid var(--border); padding-top: 0.5rem; margin-top: 0.25rem; }
        .task-card .card-footer .indicators { display: flex; gap: 0.75rem; }
        .task-card .card-footer .indicators span { display: flex; align-items: center; gap: 0.2rem; }
        .task-card .overdue-badge { background: #FEE2E2; color: #DC2626; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .task-card .done-badge { background: #DCFCE7; color: #16A34A; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .add-task-btn { margin-top: auto; padding: 0.5rem; text-align: center; border: 2px dashed var(--border); border-radius: 8px; cursor: pointer; font-size: 0.8rem; color: var(--text-light); transition: all 0.2s; }
        .add-task-btn:hover { border-color: var(--primary); color: var(--primary); background: #EFF6FF; }
        .column.drag-over { background: #DBEAFE; }
        body.dark .column.drag-over { background: #1E3A5F; }
        .dropdown-menu { position: absolute; top: 25px; left: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 50; min-width: 150px; display: none; }
        .dropdown-menu.show { display: block; }
        .dropdown-menu button { display: block; width: 100%; padding: 0.5rem 0.75rem; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 0.8rem; text-align: right; color: var(--text); }
        .dropdown-menu button:hover { background: #F1F5F9; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: var(--card); border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.15); animation: modalIn 0.2s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
        .modal-header h2 { font-size: 1.1rem; font-weight: 800; }
        .modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-light); }
        .modal-body { padding: 1.5rem; }
        .detail-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; font-size: 0.85rem; }
        .detail-row strong { color: var(--text-light); min-width: 80px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #16A34A; color: white; padding: 0.75rem 1.5rem; border-radius: 12px; z-index: 9999; font-weight: 600; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 1rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .kanban { flex-direction: column; } .column { min-width: auto; max-height: none; } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="logo"><span>📋 Nivora</span></div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
        <a href="kanban.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
    </aside>

    <main class="main">
        <div class="topbar">
            <div><h1>📌 Kanban</h1><p style="font-size:0.85rem;color:var(--text-light);" id="projectTitle"></p></div>
            <div style="display:flex;gap:0.5rem;">
                <select id="projectFilter" onchange="loadKanban()" style="height:36px;border-radius:8px;border:1px solid var(--border);padding:0 0.5rem;font-family:inherit;font-size:0.8rem;background:var(--card);color:var(--text);"><option value="">كل المشاريع</option></select>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" onclick="logout()" style="height:36px;">خروج</button>
            </div>
        </div>
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="🔍 بحث..." oninput="filterCards()">
            <select id="assigneeFilter" onchange="filterCards()"><option value="">👤 الكل</option></select>
            <button class="btn btn-outline" onclick="loadKanban()" style="height:36px;">🔄 تحديث</button>
        </div>
        <div class="kanban" id="kanbanBoard"></div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <!-- Modal تفاصيل المهمة -->
    <div class="modal-overlay" id="taskModal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalTitle">تفاصيل المهمة</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

        const statuses = ['new', 'in-progress', 'review', 'done', 'blocked'];
        const labels = { 'new': '📥 جديدة', 'in-progress': '🔄 قيد التنفيذ', 'review': '👁️ مراجعة', 'done': '✅ مكتملة', 'blocked': '🚫 متعثرة' };
        let allTasks = [], allProjects = [];

        async function loadProjects() {
            try {
                const res = await fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } });
                allProjects = await res.json();
                const sel = document.getElementById('projectFilter');
                sel.innerHTML = '<option value="">كل المشاريع</option>' + allProjects.map(p => `<option value="${p._id}">${p.name}</option>`).join('');
                const params = new URLSearchParams(window.location.search);
                const pid = params.get('projectId');
                if (pid) { sel.value = pid; document.getElementById('projectTitle').textContent = '📁 ' + (allProjects.find(p => p._id === pid)?.name || ''); }
            } catch (err) {}
        }

        async function loadKanban() {
            try {
                const pid = document.getElementById('projectFilter').value;
                let url = `${API_BASE}/tasks`; if (pid) url += `?projectId=${pid}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                allTasks = await res.json();
                if (pid) document.getElementById('projectTitle').textContent = '📁 ' + (allProjects.find(p => p._id === pid)?.name || '');
                else document.getElementById('projectTitle').textContent = '';
                const assignees = [...new Set(allTasks.map(t => t.assignee).filter(Boolean))];
                document.getElementById('assigneeFilter').innerHTML = '<option value="">👤 الكل</option>' + assignees.map(a => `<option value="${a}">${a}</option>`).join('');
                renderBoard(allTasks);
            } catch (err) { document.getElementById('kanbanBoard').innerHTML = '<p style="text-align:center;color:#DC2626;">خطأ</p>'; }
        }

        function renderBoard(tasks) {
            document.getElementById('kanbanBoard').innerHTML = statuses.map(s => {
                const filtered = tasks.filter(t => t.status === s);
                return `<div class="column" data-status="${s}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropTask(event,'${s}')">
                    <div class="column-header"><h3>${labels[s]} <span class="count">${filtered.length}</span></h3></div>
                    <div class="task-list">${filtered.map(t => renderCard(t)).join('')}</div>
                    <div class="add-task-btn" onclick="quickAdd('${s}')">+ إضافة مهمة</div>
                </div>`;
            }).join('');
        }

        function renderCard(t) {
            const isOverdue = t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done';
            const isDone = t.status === 'done';
            const priorityLabels = { critical: 'حرجة', high: 'عالية', medium: 'متوسطة', low: 'منخفضة' };
            const priorityClass = `priority-${t.priority || 'medium'}-label`;
            const doneCount = t.checklist?.filter(c => c.done).length || 0;
            const totalCount = t.checklist?.length || 0;
            const subtaskCount = allTasks.filter(st => st.parentTask === t._id).length;
            
            return `<div class="task-card priority-${t.priority || 'medium'}" draggable="true" data-id="${t._id}" ondragstart="dragTask(event,'${t._id}')" ondragend="this.classList.remove('dragging')" onclick="openTaskDetails('${t._id}')">
                <div class="card-header">
                    <span class="priority-badge ${priorityClass}">${priorityLabels[t.priority] || 'متوسطة'}</span>
                    <button class="card-menu" onclick="event.stopPropagation();toggleCardMenu(event,'${t._id}')">⋮</button>
                    <div class="dropdown-menu" id="menu-${t._id}">
                        <button onclick="event.stopPropagation();openTaskDetails('${t._id}')">📋 فتح التفاصيل</button>
                        <button onclick="event.stopPropagation();changeStatus('${t._id}','in-progress')">🔄 قيد التنفيذ</button>
                        <button onclick="event.stopPropagation();changeStatus('${t._id}','done')">✅ مكتملة</button>
                        <button onclick="event.stopPropagation();deleteTask('${t._id}')">🗑️ حذف</button>
                    </div>
                </div>
                <div class="card-title">${isOverdue ? '🔴 ' : ''}${t.title}</div>
                ${t.description ? `<div class="card-desc">${t.description}</div>` : ''}
                <div class="card-meta">
                    ${t.assignee ? `<span>👤 ${t.assignee}</span>` : ''}
                    ${t.dueDate ? `<span>📅 ${new Date(t.dueDate).toLocaleDateString('ar-SA')}</span>` : ''}
                </div>
                <div class="card-footer">
                    <div class="indicators">
                        ${totalCount > 0 ? `<span>☑ ${doneCount}/${totalCount}</span>` : ''}
                        ${subtaskCount > 0 ? `<span>↳ ${subtaskCount}</span>` : ''}
                        ${t.comments?.length > 0 ? `<span>💬 ${t.comments.length}</span>` : ''}
                        ${t.attachments?.length > 0 ? `<span>📎 ${t.attachments.length}</span>` : ''}
                    </div>
                    ${isOverdue ? '<span class="overdue-badge">⏰ متأخرة</span>' : ''}
                    ${isDone ? '<span class="done-badge">✓ مكتملة</span>' : ''}
                </div>
            </div>`;
        }

        function toggleCardMenu(e, id) { e.stopPropagation(); document.querySelectorAll('.dropdown-menu').forEach(m => { if (m.id !== 'menu-' + id) m.classList.remove('show'); }); document.getElementById('menu-' + id).classList.toggle('show'); }
        document.addEventListener('click', () => document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show')));

        function dragTask(e, id) { e.dataTransfer.setData('text/plain', id); e.target.classList.add('dragging'); }

        async function dropTask(e, newStatus) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            const taskId = e.dataTransfer.getData('text/plain'); if (!taskId) return;
            await fetch(`${API_BASE}/tasks/${taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status: newStatus }) });
            showToast('✅ تم تحديث الحالة'); loadKanban();
        }

        async function changeStatus(id, status) {
            await fetch(`${API_BASE}/tasks/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status }) });
            showToast('✅ تم التحديث'); loadKanban();
        }

        async function quickAdd(status) {
            const title = prompt('عنوان المهمة:'); if (!title) return;
            const pid = document.getElementById('projectFilter').value;
            await fetch(`${API_BASE}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ title, status, projectId: pid || null }) });
            showToast('✅ تمت الإضافة'); loadKanban();
        }

        async function deleteTask(id) { if (!confirm('حذف المهمة؟')) return; await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadKanban(); }

        function filterCards() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const assignee = document.getElementById('assigneeFilter').value;
            let filtered = allTasks;
            if (search) filtered = filtered.filter(t => t.title.toLowerCase().includes(search));
            if (assignee) filtered = filtered.filter(t => t.assignee === assignee);
            renderBoard(filtered);
        }

        async function openTaskDetails(id) {
            const t = allTasks.find(t => t._id === id); if (!t) return;
            const isOverdue = t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done';
            const priorityLabels = { critical: '🔴 حرجة', high: '🟠 عالية', medium: '🟡 متوسطة', low: '🟢 منخفضة' };
            const statusLabels = { 'new': '📥 جديدة', 'in-progress': '🔄 قيد التنفيذ', 'review': '👁️ مراجعة', 'done': '✅ مكتملة', 'blocked': '🚫 متعثرة' };
            const doneCount = t.checklist?.filter(c => c.done).length || 0;
            const totalCount = t.checklist?.length || 0;
            const subtasks = allTasks.filter(st => st.parentTask === t._id);
            
            document.getElementById('modalTitle').textContent = t.title;
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-row"><strong>الحالة:</strong> ${statusLabels[t.status] || t.status}</div>
                <div class="detail-row"><strong>الأولوية:</strong> ${priorityLabels[t.priority] || t.priority}</div>
                ${t.assignee ? `<div class="detail-row"><strong>المسؤول:</strong> 👤 ${t.assignee}</div>` : ''}
                ${t.project ? `<div class="detail-row"><strong>المشروع:</strong> 📁 ${t.project}</div>` : ''}
                ${t.dueDate ? `<div class="detail-row"><strong>التاريخ:</strong> 📅 ${new Date(t.dueDate).toLocaleDateString('ar-SA')} ${isOverdue ? '🔴 متأخرة' : ''}</div>` : ''}
                ${t.description ? `<div class="detail-row"><strong>الوصف:</strong> ${t.description}</div>` : ''}
                ${totalCount > 0 ? `<div class="detail-row"><strong>Checklist:</strong> ☑ ${doneCount}/${totalCount}</div>` : ''}
                ${subtasks.length > 0 ? `<div class="detail-row"><strong>مهام فرعية:</strong> ↳ ${subtasks.length}</div>` : ''}
                <div style="margin-top:1rem;display:flex;gap:0.5rem;">
                    <button class="btn btn-primary" onclick="window.location.href='task.html?id=${t._id}'">📋 فتح كامل</button>
                    <button class="btn btn-outline" onclick="closeModal()">إغلاق</button>
                </div>
            `;
            document.getElementById('taskModal').classList.add('show');
        }

        function closeModal() { document.getElementById('taskModal').classList.remove('show'); }

        loadProjects().then(() => loadKanban());
    </script>
</body>
</html>
