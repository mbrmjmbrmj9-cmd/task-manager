<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | Kanban</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        body { min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .project-title { font-size: 0.85rem; color: var(--text-light); }
        .view-nav { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 0.75rem; overflow-x: auto; }
        .view-nav a { padding: 0.5rem 0.85rem; font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
        .view-nav a:hover { color: var(--primary); }
        .view-nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select { height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0 0.5rem; font-family: inherit; font-size: 0.8rem; background: var(--bg); color: var(--text); }
        .toolbar input { flex: 1; min-width: 150px; }
        .kanban { display: flex; gap: 1rem; flex: 1; overflow-x: auto; padding-bottom: 1rem; min-height: 300px; }
        .column { flex: 1; min-width: 290px; background: var(--surface); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; max-height: calc(100vh - 310px); }
        .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding: 0 0.25rem; }
        .column-header h3 { font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .col-count { background: var(--card); padding: 0.2rem 0.6rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; }
        .task-list { flex: 1; overflow-y: auto; padding: 0 0.25rem; min-height: 60px; }
        .task-list::-webkit-scrollbar { width: 4px; }
        .task-list::-webkit-scrollbar-thumb { background: var(--disabled); border-radius: 4px; }
        .empty-column { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.8rem; }
        .drop-zone { text-align: center; padding: 1rem; margin: 0.5rem 0.25rem; border: 2px dashed var(--disabled); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 0.8rem; display: none; }
        .column.drag-over .drop-zone { display: block; }
        .column.drag-over { background: var(--primary-light); }
        .task-card { background: var(--card); border-radius: var(--radius-sm); padding: 0.7rem 0.75rem; margin-bottom: 0.5rem; border: 1px solid var(--border); cursor: pointer; position: relative; transition: all var(--transition); box-shadow: var(--shadow-xs); user-select: none; }
        .task-card:hover { box-shadow: var(--shadow-md); }
        .task-card.dragging { opacity: 0.5; transform: rotate(1.5deg); box-shadow: var(--shadow-lg); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
        .card-header-left { display: flex; align-items: center; gap: 0.3rem; }
        .card-header-right { display: flex; align-items: center; gap: 0.3rem; }
        .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 0.15rem; border-radius: var(--radius-xs); line-height: 1; transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
        .icon-btn:hover { background: var(--secondary-light); color: var(--text); }
        .status-label { font-size: 0.68rem; font-weight: 600; display: flex; align-items: center; gap: 0.2rem; white-space: nowrap; }
        .status-dot-sm { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .status-new .status-dot-sm { background: var(--primary); }
        .status-progress .status-dot-sm { background: var(--warning); }
        .status-review .status-dot-sm { background: #8B5CF6; }
        .status-done .status-dot-sm { background: var(--success); }
        .status-blocked .status-dot-sm { background: var(--danger); }
        .card-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem; line-height: 1.45; }
        .date-badge { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.68rem; padding: 0.2rem 0.5rem; border-radius: var(--radius-xs); border: 1px solid var(--border); color: var(--text-light); margin-bottom: 0.45rem; background: var(--secondary-light); }
        .date-badge.overdue { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.3rem; }
        .card-footer-left { display: flex; align-items: center; gap: 0.25rem; }
        .card-footer-right { display: flex; align-items: center; gap: 0.35rem; }
        .avatar-sm { width: 24px; height: 24px; border-radius: 50%; background: var(--secondary-light); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; color: var(--text-light); flex-shrink: 0; overflow: hidden; }
        .drag-handle { display: grid; grid-template-columns: repeat(3, 4px); grid-template-rows: repeat(3, 4px); gap: 2.5px; cursor: grab; padding: 2px; flex-shrink: 0; }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle span { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); display: block; }
        .indicators { display: flex; align-items: center; gap: 0.2rem; }
        .ind-btn { display: flex; align-items: center; gap: 0.1rem; font-size: 0.65rem; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 0.15rem 0.3rem; border-radius: var(--radius-xs); font-family: inherit; transition: all var(--transition-fast); white-space: nowrap; }
        .ind-btn:hover { background: var(--secondary-light); color: var(--text); }
        .pri-btn { font-size: 0.8rem; background: none; border: none; cursor: pointer; padding: 0.1rem 0.25rem; border-radius: var(--radius-xs); transition: all var(--transition-fast); }
        .pri-btn:hover { background: var(--secondary-light); }
        .pri-critical { color: var(--danger); } .pri-high { color: var(--warning); } .pri-medium { color: #EAB308; } .pri-low { color: var(--success); }
        .stat-btn { background: none; border: none; cursor: pointer; padding: 0.1rem; border-radius: 50%; transition: all var(--transition-fast); display: flex; }
        .stat-btn:hover { background: var(--secondary-light); }
        .add-task-btn { margin-top: auto; padding: 0.5rem; text-align: center; border: 2px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; transition: all var(--transition); }
        .add-task-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(2px); }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: modalIn 0.2s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 1.5rem 1.5rem 0.75rem; }
        .modal-header h3 { font-size: 1.1rem; font-weight: 800; flex: 1; line-height: 1.5; }
        .modal-close { background: var(--secondary-light); border: none; font-size: 1rem; cursor: pointer; color: var(--text-light); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .modal-close:hover { background: var(--danger-light); color: var(--danger); }
        .modal-body { padding: 0.75rem 1.5rem 1.5rem; }
        .detail-section { margin-bottom: 1.25rem; }
        .detail-section label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-light); margin-bottom: 0.4rem; }
        .detail-section input, .detail-section textarea { width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0.6rem 0.75rem; font-family: inherit; font-size: 0.88rem; background: var(--bg); color: var(--text); }
        .detail-section textarea { resize: vertical; min-height: 70px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .opt-group { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .opt-btn { padding: 0.45rem 0.75rem; border-radius: var(--radius-sm); border: 2px solid var(--border); cursor: pointer; font-size: 0.82rem; background: none; font-family: inherit; transition: all var(--transition-fast); }
        .opt-btn:hover { border-color: var(--primary); }
        .opt-btn.sel { border-color: var(--primary); background: var(--primary-light); }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; }
        .toggle-sw { width: 46px; height: 26px; background: var(--disabled); border-radius: 13px; cursor: pointer; position: relative; transition: background var(--transition); }
        .toggle-sw.on { background: var(--primary); }
        .toggle-sw::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: right var(--transition); }
        .toggle-sw.on::after { right: 23px; }
        .comment-item { background: var(--secondary-light); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem; }
        .comment-item .cu { font-weight: 700; font-size: 0.8rem; }
        .comment-item .ct { font-size: 0.85rem; margin-top: 0.25rem; }
        .comment-item .ctm { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.25rem; }
        .comment-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .comment-row input { flex: 1; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0 0.75rem; font-family: inherit; font-size: 0.85rem; background: var(--bg); color: var(--text); }
        .file-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; }
        .drop-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 0.75rem; transition: all var(--transition); }
        .drop-area:hover { border-color: var(--primary); color: var(--primary); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 0.75rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .kanban { flex-direction: column; } .column { min-width: auto; max-height: none; } .detail-grid { grid-template-columns: 1fr; } }
    </style>
</head>

        </div>
    </div>

    <script src="js/components.js"></script>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        function closeM(id) { document.getElementById(id).classList.remove('show'); }
        function closeQuickAdd() { document.getElementById('quickAddModal').classList.remove('show'); document.getElementById('quickAddTitle').value = ''; }

        const statuses = ['new', 'in-progress', 'review', 'done', 'blocked'];
        const labels = { 'new': 'متاحة', 'in-progress': 'قيد التنفيذ', 'review': 'مراجعة', 'done': 'مكتملة', 'blocked': 'متعثرة' };
        const icons = { 'new': '📥', 'in-progress': '⚙️', 'review': '👁️', 'done': '✅', 'blocked': '🚫' };
        const sCls = { 'new': 'status-new', 'in-progress': 'status-progress', 'review': 'status-review', 'done': 'status-done', 'blocked': 'status-blocked' };
        const priorities = ['critical', 'high', 'medium', 'low'];
        const pLabels = { critical: 'حرجة', high: 'عالية', medium: 'متوسطة', low: 'منخفضة' };
        const pCls = { critical: 'pri-critical', high: 'pri-high', medium: 'pri-medium', low: 'pri-low' };
        let allTasks = [], allProjects = [], currentTaskId = null, quickAddStatus = 'new';
        const debouncedRender = debounce(() => renderBoard(allTasks), 200);

        document.addEventListener('DOMContentLoaded', () => {
            const avatar = document.getElementById('topAvatar');
            const username = document.getElementById('topUsername');
            if (username) username.textContent = user.fullName || user.username || 'مستخدم';
            if (avatar) {
                if (user.avatar) avatar.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                else avatar.textContent = getInitials(user.fullName || user.username);
            }
        });

        async function loadProjects() {
            const res = await fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } });
            allProjects = await res.json();
            const sel = document.getElementById('projectFilter');
            sel.innerHTML = '<option value="">كل المشاريع</option>' + allProjects.map(p => `<option value="${p._id}">${p.name}</option>`).join('');
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('projectId');
            if (pid) { sel.value = pid; document.getElementById('projectTitle').textContent = '📁 ' + (allProjects.find(p => p._id === pid)?.name || ''); }
        }

        async function loadKanban() {
            showSkeleton('kanbanBoard', 'card', 5);
            try {
                const pid = document.getElementById('projectFilter').value;
                let url = `${API_BASE}/tasks`; if (pid) url += `?projectId=${pid}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                allTasks = await res.json();
                if (pid) document.getElementById('projectTitle').textContent = '📁 ' + (allProjects.find(p => p._id === pid)?.name || '');
                else document.getElementById('projectTitle').textContent = '';
                const assignees = [...new Set(allTasks.map(t => t.assignee).filter(Boolean))];
                document.getElementById('assigneeFilter').innerHTML = '<option value="">👤 الكل</option>' + assignees.map(a => `<option value="${a}">${a}</option>`).join('');
                renderBoard(allTasks);
            } catch (err) { showError('kanbanBoard', 'تعذر تحميل المهام', loadKanban); }
        }

        function renderBoard(tasks) {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const a = document.getElementById('assigneeFilter').value;
            let filtered = tasks;
            if (q) filtered = filtered.filter(t => t.title.toLowerCase().includes(q));
            if (a) filtered = filtered.filter(t => t.assignee === a);
            document.getElementById('kanbanBoard').innerHTML = statuses.map(s => {
                const colTasks = filtered.filter(t => t.status === s);
                return `<div class="column" data-status="${s}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropTask(event,'${s}')">
                    <div class="column-header"><h3>${icons[s]} ${labels[s]} <span class="col-count">${colTasks.length}</span></h3></div>
                    <div class="task-list">${colTasks.length === 0 ? '<div class="empty-column">لا توجد مهام</div>' : ''}${colTasks.map(t => renderCard(t)).join('')}<div class="drop-zone">📥 أسقط المهمة هنا</div></div>
                    <div class="add-task-btn" onclick="openQuickAdd('${s}')">+ إضافة مهمة</div>
                </div>`;
            }).join('');
        }

        function renderCard(t) {
            const cls = sCls[t.status] || 'status-new';
            const isOverdue = t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done';
            const cCount = t.comments?.length || 0;
            const aCount = t.attachments?.length || 0;
            const initial = (t.assignee || '?')[0];
            const pc = pCls[t.priority] || 'pri-medium';
            return `<div class="task-card ${cls}" draggable="true" data-id="${t._id}" ondragstart="dragTask(event,'${t._id}')" ondragend="this.classList.remove('dragging')" onclick="openDetails('${t._id}')">
                <div class="card-header">
                    <div class="card-header-left"><button class="icon-btn" onclick="event.stopPropagation();openDetails('${t._id}')">✎</button></div>
                    <div class="card-header-right"><span class="status-label">${labels[t.status]} <span class="status-dot-sm"></span></span></div>
                </div>
                <div class="card-title">${t.title}</div>
                ${t.dueDate ? `<div class="date-badge ${isOverdue ? 'overdue' : ''}">📅 ${formatDate(t.dueDate)}</div>` : ''}
                <div class="card-footer">
                    <div class="card-footer-left"><div class="avatar-sm">${initial}</div><div class="drag-handle" title="اسحب للنقل"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
                    <div class="card-footer-right">
                        <div class="indicators">
                            <button class="ind-btn" onclick="event.stopPropagation();openDetails('${t._id}','comments')">${cCount} 💬</button>
                            <button class="ind-btn" onclick="event.stopPropagation();openDetails('${t._id}','files')">${aCount} 📄</button>
                        </div>
                        <button class="pri-btn ${pc}" onclick="event.stopPropagation();openDetails('${t._id}','priority')">🚩</button>
                        <button class="stat-btn" onclick="event.stopPropagation();openDetails('${t._id}','status')"><span class="status-dot-sm"></span></button>
                    </div>
                </div>
            </div>`;
        }

        function dragTask(e, id) { e.dataTransfer.setData('text/plain', id); e.target.classList.add('dragging'); }
        async function dropTask(e, s) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const id = e.dataTransfer.getData('text/plain'); if (!id) return; await fetch(`${API_BASE}/tasks/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status: s }) }); showToast('تم تحديث الحالة', 'success'); loadKanban(); }

        function openQuickAdd(status) { quickAddStatus = status; document.getElementById('quickAddModal').classList.add('show'); document.getElementById('quickAddTitle').focus(); }
        async function submitQuickAdd() {
            const title = document.getElementById('quickAddTitle').value.trim();
            if (!title) { showToast('العنوان مطلوب', 'warning'); return; }
            const btn = document.getElementById('quickAddBtn');
            setButtonLoading(btn, true, 'جاري...');
            const pid = document.getElementById('projectFilter').value;
            await fetch(`${API_BASE}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ title, status: quickAddStatus, projectId: pid || null }) });
            setButtonLoading(btn, false);
            closeQuickAdd();
            showToast('تمت الإضافة', 'success');
            loadKanban();
        }

        async function refreshTask() { const r = await fetch(`${API_BASE}/tasks/${currentTaskId}`, { headers: { 'Authorization': `Bearer ${token}` } }); const u = await r.json(); const i = allTasks.findIndex(t => t._id === currentTaskId); if (i >= 0) allTasks[i] = u; return u; }

        function openDetails(id, tab) {
            currentTaskId = id;
            const t = allTasks.find(t => t._id === id); if (!t) return;
            const cCount = t.comments?.length || 0;
            const aCount = t.attachments?.length || 0;
            const comments = t.comments || [];
            const attachments = t.attachments || [];
            document.getElementById('detailsTitle').textContent = '📋 ' + t.title;
            let html = `
                <div class="detail-section"><label>✎ العنوان</label><input type="text" id="detTitle" value="${t.title}" onchange="saveField('title',this.value)"></div>
                <div class="detail-section"><label>📝 الوصف</label><textarea id="detDesc" onchange="saveField('description',this.value)">${t.description || ''}</textarea></div>
                <div class="detail-grid">
                    <div class="detail-section"><label>👤 المسؤول</label><input type="text" id="detAssignee" value="${t.assignee || ''}" onchange="saveField('assignee',this.value)"></div>
                    <div class="detail-section"><label>📅 تاريخ الاستحقاق</label><input type="date" id="detDueDate" value="${t.dueDate ? new Date(t.dueDate).toISOString().split('T')[0] : ''}" onchange="saveField('dueDate',this.value)"></div>
                    <div class="detail-section"><label>📅 تاريخ البداية</label><input type="date" id="detStartDate" value="${t.startDate ? new Date(t.startDate).toISOString().split('T')[0] : ''}" onchange="saveField('startDate',this.value)"></div>
                </div>
                <div class="detail-section"><label>🚩 الأولوية</label><div class="opt-group">${priorities.map(p => `<button class="opt-btn ${t.priority === p ? 'sel' : ''}" onclick="chPri('${p}')">${pLabels[p]}</button>`).join('')}</div></div>
                <div class="detail-section"><label>● الحالة</label><div class="opt-group">${statuses.map(s => `<button class="opt-btn ${t.status === s ? 'sel' : ''}" onclick="chStat('${s}')">${icons[s]} ${labels[s]}</button>`).join('')}</div></div>
                <div class="detail-section">
                    <label>📎 الملفات (${aCount})</label>
                    ${attachments.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">لا توجد مرفقات</p>' : ''}
                    ${attachments.map(a => `<div class="file-item"><span>📎</span><a href="${a.url}" target="_blank" style="color:var(--primary);text-decoration:none;flex:1;">${a.name}</a><button class="btn-delete-sm" onclick="delAtt('${a._id}')">🗑️</button></div>`).join('')}
                    <div style="margin-top:0.75rem;display:flex;gap:0.5rem;"><input type="file" id="fileUpload" style="display:none;" onchange="upFileDet()"><button class="btn btn-primary btn-sm" onclick="document.getElementById('fileUpload').click()">📁 رفع ملف</button></div>
                    <div class="drop-area" ondragover="event.preventDefault()" ondrop="dropFile(event)">📥 أفلت الملفات هنا</div>
                    <a href="task.html?id=${id}&tab=attachments" class="btn btn-outline btn-sm" style="width:100%;text-align:center;text-decoration:none;margin-top:0.5rem;display:block;">📋 فتح الملفات كاملة</a>
                </div>
                <div class="detail-section"><div class="toggle-row"><label>🔄 التكرار</label><div class="toggle-sw ${t.isRecurring ? 'on' : ''}" id="recurToggle" onclick="toggleRecur()"></div></div></div>
                <div class="detail-section">
                    <label>💬 التعليقات (${cCount})</label>
                    ${comments.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">لا توجد تعليقات</p>' : ''}
                    ${comments.map(c => `<div class="comment-item"><div class="cu">${c.username || 'مستخدم'}</div><div class="ct">${c.text}</div><div class="ctm">${formatDateTime(c.createdAt)}</div></div>`).join('')}
                    <div class="comment-row"><input type="text" id="commentInput" placeholder="اكتب تعليقاً... @ للإشارة"><button class="btn btn-primary btn-sm" onclick="addCommentDet()">إرسال</button></div>
                    <a href="task.html?id=${id}&tab=comments" class="btn btn-outline btn-sm" style="width:100%;text-align:center;text-decoration:none;margin-top:0.5rem;display:block;">📋 فتح التعليقات كاملة</a>
                </div>`;
            document.getElementById('detailsBody').innerHTML = html;
            document.getElementById('detailsModal').classList.add('show');
            if (tab === 'comments') setTimeout(() => document.getElementById('commentInput')?.scrollIntoView({ behavior: 'smooth' }), 300);
            if (tab === 'files') setTimeout(() => document.querySelector('.drop-area')?.scrollIntoView({ behavior: 'smooth' }), 300);
        }

        async function saveField(field, value) { if (!currentTaskId) return; await fetch(`${API_BASE}/tasks/${currentTaskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ [field]: value }) }); await refreshTask(); renderBoard(allTasks); showToast('تم الحفظ', 'success'); }
        async function chPri(p) { await saveField('priority', p); openDetails(currentTaskId); }
        async function chStat(s) { await saveField('status', s); openDetails(currentTaskId); }
        async function toggleRecur() { const t = allTasks.find(t => t._id === currentTaskId); if (!t) return; await saveField('isRecurring', !t.isRecurring); document.getElementById('recurToggle')?.classList.toggle('on'); }
        async function addCommentDet() { const inp = document.getElementById('commentInput'); const txt = inp.value.trim(); if (!txt || !currentTaskId) return; await fetch(`${API_BASE}/tasks/${currentTaskId}/comments`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ text: txt }) }); await refreshTask(); renderBoard(allTasks); showToast('تمت الإضافة', 'success'); openDetails(currentTaskId, 'comments'); }
        async function upFileDet() { const file = document.getElementById('fileUpload').files[0]; if (!file || !currentTaskId) return; const fd = new FormData(); fd.append('file', file); const ur = await fetch(`${API_BASE}/upload`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd }); const ud = await ur.json(); if (ur.ok) { await fetch(`${API_BASE}/tasks/${currentTaskId}/attachments`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(ud) }); await refreshTask(); renderBoard(allTasks); showToast('تم رفع الملف', 'success'); openDetails(currentTaskId, 'files'); } }
        async function dropFile(e) { e.preventDefault(); const file = e.dataTransfer.files[0]; if (!file || !currentTaskId) return; const fd = new FormData(); fd.append('file', file); const ur = await fetch(`${API_BASE}/upload`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd }); const ud = await ur.json(); if (ur.ok) { await fetch(`${API_BASE}/tasks/${currentTaskId}/attachments`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(ud) }); await refreshTask(); renderBoard(allTasks); showToast('تم رفع الملف', 'success'); openDetails(currentTaskId, 'files'); } }
        function delAtt(aid) { confirmDialog({ title: 'حذف المرفق', message: 'حذف هذا المرفق؟', confirmText: 'حذف', danger: true, onConfirm: async () => { await fetch(`${API_BASE}/tasks/${currentTaskId}/attachments/${aid}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); await refreshTask(); renderBoard(allTasks); openDetails(currentTaskId, 'files'); } }); }
// ========== نظام الإشعارات ==========
let notifications = [];

async function loadNotifications() {
    try {
        const res = await fetch(`${API_BASE}/notifications`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        notifications = data.notifications || data;
        renderNotifications();
        updateNotifBadge();
    } catch (err) {}
}

function renderNotifications() {
    const container = document.getElementById('notifList');
    if (!notifications.length) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">لا توجد إشعارات</p>';
        return;
    }
    container.innerHTML = notifications.slice(0, 20).map(n => `
        <div style="padding:0.75rem 1rem;border-bottom:1px solid var(--border-light);cursor:pointer;${n.isRead ? '' : 'background:var(--primary-light);'}" onclick="readNotification('${n._id}')">
            <div style="font-size:0.85rem;font-weight:600;">${n.message}</div>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.2rem;">${timeAgo(n.createdAt)}</div>
        </div>
    `).join('');
}

function updateNotifBadge() {
    const unread = notifications.filter(n => !n.isRead).length;
    const badge = document.getElementById('notifBadge');
    if (badge) {
        if (unread > 0) {
            badge.textContent = unread > 9 ? '9+' : unread;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }
}

function toggleNotifications() {
    const dd = document.getElementById('notifDropdown');
    if (!dd) return;
    const isVisible = dd.style.display === 'block';
    dd.style.display = isVisible ? 'none' : 'block';
    if (!isVisible) loadNotifications();
}

async function readNotification(id) {
    await fetch(`${API_BASE}/notifications/${id}/read`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } });
    loadNotifications();
}

async function markAllRead() {
    await fetch(`${API_BASE}/notifications/read-all`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } });
    loadNotifications();
}

// إغلاق الـ Dropdown عند النقر خارجه
document.addEventListener('click', function(e) {
    const dd = document.getElementById('notifDropdown');
    const btn = document.getElementById('notifBtn');
    if (dd && btn && !btn.contains(e.target) && !dd.contains(e.target)) {
        dd.style.display = 'none';
    }
});

// تحميل الإشعارات عند فتح الصفحة
loadNotifications();
        loadProjects().then(() => loadKanban());
    </script>
</body>
</html>
