<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | الفريق</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; text-align: right; }
        th { color: var(--text-light); font-weight: 600; }
        .role-badge { padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .role-owner { background: #FEF3C7; color: #92400E; }
        .role-admin { background: #EFF6FF; color: #2563EB; }
        .role-member { background: #F1F5F9; color: #64748B; }
        .invite-code { background: #EFF6FF; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 800; letter-spacing: 2px; display: inline-block; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        .btn-leave { color: #DC2626 !important; border-color: #DC2626 !important; }
        .btn-leave:hover { background: #FEE2E2 !important; }

        /* ========== Responsive ========== */
        @media (max-width: 1024px) {
            :root { --sidebar-w: 72px; }
            .sidebar { padding: 1rem 0.5rem; }
            .sidebar .logo { font-size: 1rem; text-align: center; }
            .sidebar .label, .sidebar .logo span { display: none; }
            .sidebar a { justify-content: center; padding: 0.5rem; }
        }
        @media (max-width: 768px) {
            :root { --sidebar-w: 0; }
            .sidebar { right: -260px; width: 260px; }
            .sidebar.open { right: 0; }
            .sidebar .label { display: inline; }
            .sidebar .logo span { display: inline; }
            .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; }
            .overlay.show { display: block; }
            .main { margin-right: 0; padding: 1rem; padding-bottom: 5rem; }
            .bottom-nav { display: flex; }
            table { font-size: 0.75rem; }
            th, td { padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo"><span>📋 Nivora</span></div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg><span class="label">Workflows</span></a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">القوالب</span></a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">الأرشيف</span></a>
        <a href="team.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
    </aside>

    <!-- ✅ قبل الـ main، نضيف View Navigation -->
<div class="view-nav">
    <a href="tasks.html">📋 قائمة</a>
    <a href="kanban.html">📌 أعمدة</a>
    <a href="tasks.html">📊 جدول</a>
    <a href="gantt.html">📈 Gantt</a>
    <a href="calendar.html">📅 تقويم</a>
    <a href="reports.html">📉 إحصائيات</a>
    <a href="chat.html">💬 محادثة</a>
</div>

    <!-- Main Content -->
    <main class="main">
        <div class="topbar">
            <h1>👥 إدارة الفريق</h1>
            <div style="display:flex;gap:0.5rem;">
                <!-- أيقونة المستخدم في الـ Topbar -->
<div style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;" onclick="window.location.href='profile.html'">
    <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#64748B;overflow:hidden;"></div>
    <span id="topUsername" style="font-size:0.8rem;font-weight:600;"></span>
</div>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" onclick="logout()" style="height:36px;">خروج</button>
            </div>
        </div>

        <!-- بطاقة رمز الدعوة + مغادرة الفريق -->
        <div class="card" style="margin-bottom:1.5rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
                <div>
                    <span style="color:var(--text-light);">رمز الدعوة:</span>
                    <span class="invite-code" id="inviteCodeDisplay">---</span>
                </div>
                <button class="btn btn-outline btn-leave" id="leaveWorkspaceBtn" onclick="leaveWorkspace()" style="height:36px;font-size:0.85rem;">
                    🚪 مغادرة الفريق
                </button>
            </div>
        </div>

        <!-- قائمة الأعضاء -->
        <div class="card">
            <h2 style="margin-bottom:1rem;">الأعضاء</h2>
            <table>
                <thead>
                    <tr><th>المستخدم</th><th>الدور</th><th>تاريخ الانضمام</th><th></th></tr>
                </thead>
                <tbody id="membersBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

        const API = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }

        let wsId = localStorage.getItem('workspaceId');

        async function getUserRole() {
            if (!wsId) return 'member';
            try {
                const res = await fetch(`${API}/workspaces/${wsId}/members`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return 'member';
                const members = await res.json();
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const current = members.find(m => (m.userId?._id || m.userId) === user.id);
                return current?.role || 'member';
            } catch (e) { return 'member'; }
        }

        async function loadMembers() {
            document.getElementById('inviteCodeDisplay').textContent = localStorage.getItem('inviteCode') || '---';
            const res = await fetch(`${API}/workspaces/${wsId}/members`, { headers: { 'Authorization': `Bearer ${token}` } });
            const members = await res.json();
            if (!members.length) { document.getElementById('membersBody').innerHTML = '<tr><td colspan="4" style="text-align:center;padding:2rem;">لا يوجد أعضاء</td></tr>'; return; }
            const role = await getUserRole();
            const isOwner = role === 'owner';
            const isAdmin = role === 'owner' || role === 'admin';
            document.getElementById('membersBody').innerHTML = members.map(m => {
                const mid = m.userId?._id || m.userId;
                return `<tr>
                    <td>${m.userId?.username || m.userId?.email || 'مستخدم'}</td>
                    <td>${m.role === 'owner' ? '<span class="role-badge role-owner">مالك</span>' : isOwner ? `<select onchange="changeRole('${mid}', this.value)" style="padding:0.2rem;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:0.8rem;"><option value="admin" ${m.role==='admin'?'selected':''}>مدير</option><option value="member" ${m.role==='member'?'selected':''}>عضو</option></select>` : `<span class="role-badge role-${m.role}">${m.role==='admin'?'مدير':'عضو'}</span>`}</td>
                    <td>${new Date(m.joinedAt).toLocaleDateString('ar-SA')}</td>
                    <td>${m.role !== 'owner' && isAdmin ? `<button class="btn btn-outline" style="height:24px;font-size:0.7rem;" onclick="removeMember('${mid}')">✕</button>` : ''}</td>
                </tr>`;
            }).join('');

            // إخفاء زر المغادرة للمالك
            if (role === 'owner') {
                document.getElementById('leaveWorkspaceBtn').style.display = 'none';
            }
        }

        async function changeRole(uid, role) { await fetch(`${API}/workspaces/${wsId}/members/${uid}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ role }) }); loadMembers(); }
        async function removeMember(uid) { if (!confirm('إزالة العضو؟')) return; await fetch(`${API}/workspaces/${wsId}/members/${uid}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); loadMembers(); }

        // ✅ مغادرة Workspace
        async function leaveWorkspace() {
            if (!wsId) return alert('لا توجد مساحة عمل');
            
            const role = await getUserRole();
            if (role === 'owner') {
                return alert('❌ المالك لا يستطيع مغادرة الفريق. يجب نقل الملكية أولاً أو حذف مساحة العمل.');
            }
            
            if (!confirm('هل أنت متأكد من مغادرة الفريق؟ لن تتمكن من الوصول إلى محتوياته إلا بدعوة جديدة.')) return;
            
            try {
                const res = await fetch(`${API}/workspaces/${wsId}/leave`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert('✅ تمت مغادرة الفريق بنجاح');
                    
                    const wssRes = await fetch(`${API}/workspaces`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const wss = await wssRes.json();
                    
                    const otherWs = wss.filter(w => w._id !== wsId);
                    
                    if (otherWs.length > 0) {
                        localStorage.setItem('workspaceId', otherWs[0]._id);
                        localStorage.setItem('inviteCode', otherWs[0].inviteCode || '');
                        window.location.href = 'index.html';
                    } else {
                        localStorage.removeItem('workspaceId');
                        localStorage.removeItem('inviteCode');
                        window.location.href = 'workspace.html';
                    }
                } else {
                    alert('❌ ' + (data.error || 'خطأ في مغادرة الفريق'));
                }
            } catch (err) {
                alert('❌ تعذر الاتصال بالخادم');
            }
        }

        if (!wsId || wsId === 'null') { fetch(`${API}/workspaces`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()).then(wss => { if (wss.length) { localStorage.setItem('workspaceId', wss[0]._id); localStorage.setItem('inviteCode', wss[0].inviteCode); wsId = wss[0]._id; loadMembers(); } else { window.location.href = 'workspace.html'; } }); }
        else { loadMembers(); }
   document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const avatar = document.getElementById('topAvatar');
    const username = document.getElementById('topUsername');
    
    if (username) {
        username.textContent = user.fullName || user.username || 'مستخدم';
    }
    
    if (avatar) {
        if (user.avatar) {
            avatar.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        } else {
            avatar.textContent = (user.fullName || user.username || 'م')[0];
        }
    }
});     
    </script>
</body>
</html>
