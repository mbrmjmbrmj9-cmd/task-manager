<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | لوحة القيادة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .kpi-card { padding: 1.25rem; }
        .kpi-card .kpi-value { font-size: 2rem; font-weight: 800; }
        .kpi-card .kpi-label { font-size: 0.85rem; color: var(--text-light); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; gap: 0.25rem; padding: 0.75rem; }
            .sidebar .logo { width: 100%; text-align: center; }
            .sidebar a { font-size: 0.75rem; padding: 0.4rem 0.6rem; }
            .sidebar a svg { width: 16px; height: 16px; }
            body { flex-direction: column; }
            .main { margin-right: 0; padding: 1rem; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .topbar h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">📋 Nivora</div>
        <a href="index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>لوحة القيادة</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>المهام</a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>المشاريع</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>Gantt</a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>التقويم</a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>التقارير</a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>Workflows</a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>القوالب</a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>الأرشيف</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>الفريق</a>
    </aside>

    <main class="main">
        <div class="topbar">
            <h1>لوحة القيادة</h1>
            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                <span id="usernameDisplay" style="font-weight:600;"></span>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" id="logoutBtn" style="height:36px;">خروج</button>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="card kpi-card"><div class="kpi-value" id="totalTasks" style="color:#2563EB;">0</div><div class="kpi-label">إجمالي المهام</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="doneTasks" style="color:#22C55E;">0</div><div class="kpi-label">مكتملة</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="pendingTasks" style="color:#F97316;">0</div><div class="kpi-label">قيد الانتظار</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="overdueTasks" style="color:#EF4444;">0</div><div class="kpi-label">متأخرة</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="projectCount" style="color:#7C3AED;">0</div><div class="kpi-label">المشاريع</div></div>
        </div>

        <div class="card" style="text-align:center;padding:3rem 1rem;color:var(--text-light);">
            <div style="font-size:3rem;margin-bottom:1rem;">📋</div>
            <h3 style="color:var(--text);margin-bottom:0.5rem;">لا توجد مهام بعد</h3>
            <p>أنشئ مهمتك الأولى وابدأ بتنظيم أعمالك</p>
            <a href="tasks.html" class="btn btn-primary" style="display:inline-block;margin-top:1rem;">➕ مهمة جديدة</a>
        </div>
    </main>

    <script>
        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        const displayName = user.fullName || user.email || user.username || 'مستخدم';
        document.getElementById('usernameDisplay').textContent = displayName;
        document.getElementById('logoutBtn').addEventListener('click', logout);
        async function loadStats() { try { const [tasksRes, projectsRes] = await Promise.all([fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }), fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } })]); const tasks = await tasksRes.json(); const projects = await projectsRes.json(); document.getElementById('totalTasks').textContent = tasks.length; document.getElementById('doneTasks').textContent = tasks.filter(t => t.status === 'done').length; document.getElementById('pendingTasks').textContent = tasks.filter(t => t.status !== 'done' && t.status !== 'archived').length; document.getElementById('overdueTasks').textContent = tasks.filter(t => t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done').length; document.getElementById('projectCount').textContent = projects.length; } catch (e) {} }
        loadStats();
    </script>
</body>
</html>
