<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | لوحة القيادة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --sidebar-w: 240px;
            --primary: #2563EB;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #0F172A;
            --text-light: #64748B;
            --border: #E2E8F0;
            --shadow: 0 1px 3px rgba(0,0,0,0.04);
        }
        body.dark { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --text-light: #94A3B8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s; }

        /* Sidebar */
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; transition: width 0.3s, right 0.3s; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }

        /* Main */
        .main { margin-right: var(--sidebar-w); padding: 2rem; transition: margin-right 0.3s; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 0.75rem; }
        .topbar h1 { font-size: 1.5rem; font-weight: 800; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .kpi-card { padding: 1.25rem 1.5rem; }
        .kpi-card .kpi-value { font-size: 2rem; font-weight: 800; }
        .kpi-card .kpi-label { font-size: 0.85rem; color: var(--text-light); margin-top: 0.25rem; }

        /* Bottom Nav (Mobile) */
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }

        /* Overlay */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }

        /* Responsive */
        @media (max-width: 1024px) {
            :root { --sidebar-w: 72px; }
            .sidebar { padding: 1rem 0.5rem; }
            .sidebar .logo { font-size: 1rem; text-align: center; }
            .sidebar .label, .sidebar .logo span { display: none; }
            .sidebar a { justify-content: center; padding: 0.5rem; }
        }
        @media (max-width: 768px) {
            :root { --sidebar-w: 0; }
            .sidebar { right: -260px; width: 260px; }
            .sidebar.open { right: 0; }
            .sidebar .label { display: inline; }
            .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; }
            .overlay.show { display: block; }
            .main { margin-right: 0; padding: 1rem; padding-bottom: 5rem; }
            .bottom-nav { display: flex; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .topbar h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo"><span>📋 Nivora</span></div>
        <a href="index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg><span class="label">Workflows</span></a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">القوالب</span></a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">الأرشيف</span></a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
    </aside>

    <!-- Main -->
    <main class="main">
        <div class="topbar">
            <h1>لوحة القيادة</h1>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <span id="usernameDisplay" style="font-weight:600;font-size:0.9rem;"></span>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <button class="btn btn-outline" id="logoutBtn" style="height:36px;">خروج</button>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="card kpi-card"><div class="kpi-value" id="totalTasks" style="color:#2563EB;">0</div><div class="kpi-label">إجمالي المهام</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="doneTasks" style="color:#16A34A;">0</div><div class="kpi-label">مكتملة</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="pendingTasks" style="color:#D97706;">0</div><div class="kpi-label">قيد الانتظار</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="overdueTasks" style="color:#DC2626;">0</div><div class="kpi-label">متأخرة</div></div>
            <div class="card kpi-card"><div class="kpi-value" id="projectCount" style="color:#7C3AED;">0</div><div class="kpi-label">المشاريع</div></div>
        </div>

        <div class="card" style="text-align:center;padding:3rem 1rem;color:var(--text-light);">
            <div style="font-size:3rem;margin-bottom:1rem;">📋</div>
            <h3 style="color:var(--text);margin-bottom:0.5rem;">لا توجد مهام بعد</h3>
            <p>أنشئ مهمتك الأولى وابدأ بتنظيم أعمالك</p>
            <a href="tasks.html" class="btn btn-primary" style="display:inline-block;margin-top:1rem;">➕ مهمة جديدة</a>
        </div>
    </main>

    <!-- Bottom Nav (Mobile) -->
    <nav class="bottom-nav">
        <a href="index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

        const API_BASE = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        const displayName = user.fullName || user.email || user.username || 'مستخدم';
        document.getElementById('usernameDisplay').textContent = displayName;
        document.getElementById('logoutBtn').addEventListener('click', logout);
        async function loadStats() { try { const [tasksRes, projectsRes] = await Promise.all([fetch(`${API_BASE}/tasks`, { headers: { 'Authorization': `Bearer ${token}` } }), fetch(`${API_BASE}/projects`, { headers: { 'Authorization': `Bearer ${token}` } })]); const tasks = await tasksRes.json(); const projects = await projectsRes.json(); document.getElementById('totalTasks').textContent = tasks.length; document.getElementById('doneTasks').textContent = tasks.filter(t => t.status === 'done').length; document.getElementById('pendingTasks').textContent = tasks.filter(t => t.status !== 'done' && t.status !== 'archived').length; document.getElementById('overdueTasks').textContent = tasks.filter(t => t.dueDate && new Date(t.dueDate) < new Date() && t.status !== 'done').length; document.getElementById('projectCount').textContent = projects.length; } catch (e) {} }
        loadStats();
    </script>
</body>
</html>
