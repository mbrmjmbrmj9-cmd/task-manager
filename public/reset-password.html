<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إعادة تعيين كلمة المرور</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563EB; --bg: #F8FAFC; --card: #FFFFFF; --text: #1E293B; --text-light: #64748B; --border: #E2E8F0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: var(--card); border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.06); width: 100%; max-width: 440px; border: 1px solid var(--border); text-align: center; }
        .card h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.5rem; }
        .card p { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .input-group { position: relative; margin-bottom: 1rem; }
        .input-group input { width: 100%; height: 48px; padding: 0 1rem; border-radius: 12px; border: 1px solid var(--border); font-family: inherit; font-size: 0.9rem; background: var(--bg); color: var(--text); }
        .input-group input:focus { outline: none; border-color: var(--primary); }
        .btn { width: 100%; height: 48px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 1rem; background: var(--primary); color: white; }
        .btn:hover { background: #1D4ED8; }
        .error-msg { background: #FEE2E2; color: #DC2626; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
        .success-msg { background: #DCFCE7; color: #16A34A; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
        .toggle-password { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; background: none; border: none; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>إعادة تعيين كلمة المرور</h1>
        <p>أدخل كلمة المرور الجديدة</p>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <div class="input-group"><input type="password" id="newPassword" placeholder="كلمة المرور الجديدة"><button class="toggle-password" onclick="togglePassword('newPassword', this)">👁️</button></div>
        <div class="input-group"><input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور"></div>
        <button class="btn" onclick="resetPassword()">حفظ كلمة المرور</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (!token) { document.getElementById('errorMsg').textContent = 'رابط غير صالح'; document.getElementById('errorMsg').style.display = 'block'; }

        function togglePassword(id, btn) { const input = document.getElementById(id); const isPassword = input.type === 'password'; input.type = isPassword ? 'text' : 'password'; btn.textContent = isPassword ? '🙈' : '👁️'; }

        async function resetPassword() {
            const password = document.getElementById('newPassword').value; const confirm = document.getElementById('confirmPassword').value;
            const err = document.getElementById('errorMsg'); const success = document.getElementById('successMsg');
            if (!password || !confirm) { err.textContent = 'املأ جميع الحقول'; err.style.display = 'block'; return; }
            if (password !== confirm) { err.textContent = 'كلمتا المرور غير متطابقتين'; err.style.display = 'block'; return; }
            if (password.length < 8) { err.textContent = 'كلمة المرور 8 أحرف على الأقل'; err.style.display = 'block'; return; }
            try {
                const res = await fetch('http://localhost:3000/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
                const data = await res.json();
                if (res.ok) { success.textContent = '✅ تم تغيير كلمة المرور بنجاح. جارٍ التوجيه...'; success.style.display = 'block'; err.style.display = 'none'; setTimeout(() => { window.location.href = 'login.html'; }, 3000); }
                else { err.textContent = data.error; err.style.display = 'block'; }
            } catch (e) { err.textContent = 'تعذر الاتصال بالخادم'; err.style.display = 'block'; }
        }
    </script>
</body>
</html>
