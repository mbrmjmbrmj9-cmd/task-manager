<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | إعادة تعيين كلمة المرور</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: var(--card); border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); width: 100%; max-width: 440px; border: 1px solid var(--border); text-align: center; }
        .card h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.5rem; }
        .card p { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="card">
        <h1>إعادة تعيين كلمة المرور</h1>
        <p>أدخل كلمة المرور الجديدة</p>
        <div class="form-group"><input type="password" class="input" id="newPassword" placeholder="كلمة المرور الجديدة"></div>
        <div class="form-group"><input type="password" class="input" id="confirmPassword" placeholder="تأكيد كلمة المرور"></div>
        <button class="btn btn-primary btn-block" id="resetBtn" onclick="resetPassword()">حفظ</button>
    </div>
    <script src="js/components.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (!token) { showToast('رابط غير صالح', 'error'); }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        async function resetPassword() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (!password || !confirm) { showToast('املأ جميع الحقول', 'warning'); return; }
            if (password !== confirm) { showToast('غير متطابقتين', 'warning'); return; }
            if (password.length < 8) { showToast('8 أحرف على الأقل', 'warning'); return; }
            const btn = document.getElementById('resetBtn'); setButtonLoading(btn, true, 'جاري...');
            try {
                const res = await fetch('https://nivora-t9ov.onrender.com/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
                const data = await res.json();
                if (res.ok) { showToast('تم التغيير', 'success'); setTimeout(() => window.location.href = 'login.html', 2000); }
                else { showToast(data.error, 'error'); }
            } catch (e) { showToast('تعذر الاتصال', 'error'); }
            setButtonLoading(btn, false);
        }
    </script>
</body>
</html>
