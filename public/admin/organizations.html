<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المؤسسات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; min-height: 100vh; background: #0F172A; font-family: 'Cairo', sans-serif; color: #fff; }
        .sidebar { width: 240px; background: #1E293B; padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 200; transition: right 0.3s ease; overflow-y: auto; }
        .sidebar .logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; padding: 0 0.75rem; }
        .sidebar .logo img { width: 34px; height: 34px; flex-shrink: 0; }
        .sidebar .logo span { color: #EF4444; font-weight: 800; font-size: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 0.2rem; font-size: 0.9rem; transition: all 0.15s; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
        .topbar h1 { font-size: 1.4rem; font-weight: 800; }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .toolbar input { flex: 1; min-width: 180px; height: 38px; border-radius: 8px; border: 1px solid #334155; background: #1E293B; color: #fff; padding: 0 0.75rem; font-family: inherit; font-size: 0.85rem; }
        .toolbar input:focus { outline: none; border-color: #EF4444; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #334155; text-align: right; font-size: 0.85rem; }
        th { color: #94A3B8; font-weight: 600; background: #1E293B; }
        .badge { padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; }
        .badge-active { background: rgba(34,197,94,0.15); color: #22C55E; }
        .badge-suspended { background: rgba(239,68,68,0.15); color: #EF4444; }
        .badge-expired { background: rgba(245,158,11,0.15); color: #F59E0B; }
        select { padding: 0.3rem 0.4rem; border-radius: 6px; background: #1E293B; color: #fff; border: 1px solid #334155; font-family: inherit; font-size: 0.8rem; }
        .btn-sm { padding: 0.3rem 0.6rem; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; font-size: 0.75rem; transition: all 0.15s; }
        .btn-green { background: rgba(34,197,94,0.15); color: #22C55E; }
        .btn-green:hover { background: #22C55E; color: #fff; }
        .btn-red { background: rgba(239,68,68,0.15); color: #EF4444; }
        .btn-red:hover { background: #EF4444; color: #fff; }
        .btn-view { background: rgba(59,130,246,0.15); color: #3B82F6; }
        .btn-view:hover { background: #3B82F6; color: #fff; }
        .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        .admin-overlay.show { display: block; }
        .admin-menu-btn { display: none; position: fixed; top: 12px; right: 12px; z-index: 150; background: #1E293B; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1.2rem; }
        @media (max-width: 1024px) { .sidebar { width: 60px; padding: 1rem 0.5rem; } .sidebar .logo span, .sidebar a span { display: none; } .sidebar .logo img { margin: 0 auto; } .sidebar a { justify-content: center; } .main { margin-right: 60px; } }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { right: -260px; width: 260px; padding: 1.5rem 1rem; } .sidebar.open { right: 0; } .sidebar .logo span, .sidebar a span { display: inline; } .sidebar a { justify-content: flex-start; } .main { margin-right: 0; padding: 1rem; } .admin-menu-btn { display: flex; } table { font-size: 0.7rem; } th, td { padding: 0.5rem; } }
    </style>
</head>
<body>
    <div class="admin-overlay" id="adminOverlay" onclick="closeSidebar()"></div>
    <button class="admin-menu-btn" id="adminMenuBtn" onclick="openSidebar()">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="logo"><img src="../img/logo.svg" alt="Nivora"><span>Nivora Admin</span></div>
        <a href="dashboard.html"><span>📊</span><span>لوحة القيادة</span></a>
        <a href="organizations.html" class="active"><span>🏢</span><span>المؤسسات</span></a>
        <a href="subscriptions.html"><span>💳</span><span>الاشتراكات</span></a>
        <a href="users.html"><span>👥</span><span>المستخدمون</span></a>
        <a href="features.html"><span>🚩</span><span>Feature Flags</span></a>
        <a href="usage.html"><span>📊</span><span>الاستخدام</span></a>
        <a href="tickets.html"><span>🎫</span><span>التذاكر</span></a>
        <a href="health.html"><span>🖥</span><span>صحة النظام</span></a>
        <a href="#" onclick="logout()"><span>🚪</span><span>خروج</span></a>
    </aside>

    <div class="main">
        <div class="topbar"><h1>🏢 المؤسسات</h1></div>
        <div class="toolbar"><input type="text" id="searchInput" placeholder="🔍 بحث عن مؤسسة..." oninput="renderOrgs()"></div>
        <table>
            <thead><tr><th>الاسم</th><th>المالك</th><th>الخطة</th><th>الحالة</th><th>المستخدمين</th><th>إجراءات</th></tr></thead>
            <tbody id="orgBody"></tbody>
        </table>
    </div>

    <script src="../js/components.js"></script>
    <script>
        const API = 'https://nivora-t9ov.onrender.com/api/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';

        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('adminOverlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('adminOverlay').classList.remove('show'); }
        function updateMobileUI() { const btn = document.getElementById('adminMenuBtn'); btn.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; if (window.innerWidth > 768) closeSidebar(); }
        window.addEventListener('resize', updateMobileUI); updateMobileUI();

        let allOrgs = [];

        function showSkeleton() { document.getElementById('orgBody').innerHTML = Array(4).fill('<tr><td><div class="skeleton" style="height:14px;width:80%;"></div></td><td><div class="skeleton" style="height:14px;width:60%;"></div></td><td><div class="skeleton" style="height:14px;width:50px;"></div></td><td><div class="skeleton" style="height:14px;width:50px;"></div></td><td><div class="skeleton" style="height:14px;width:40px;"></div></td><td><div class="skeleton" style="height:28px;width:100px;"></div></td></tr>').join(''); }

        async function loadOrgs() {
            showSkeleton();
            try {
                const res = await fetch(`${API}/organizations`, { headers: { 'Authorization': `Bearer ${token}` } });
                const response = await res.json();
                allOrgs = response.data || response;
                renderOrgs();
            } catch (err) {
                showError('orgBody', 'تعذر تحميل المؤسسات', loadOrgs);
            }
        }

        function renderOrgs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = q ? allOrgs.filter(o => (o.name || '').toLowerCase().includes(q) || (o.ownerId?.username || '').toLowerCase().includes(q)) : allOrgs;
            document.getElementById('orgBody').innerHTML = filtered.length === 0 ? '<tr><td colspan="6" style="text-align:center;padding:3rem;color:#94A3B8;">لا توجد مؤسسات</td></tr>' : filtered.map(o => `<tr><td>${o.name || '-'}</td><td>${o.ownerId?.username || '-'}</td><td><select onchange="changePlan('${o._id}', this.value)"><option value="free" ${o.plan==='free'?'selected':''}>Free</option><option value="pro" ${o.plan==='pro'?'selected':''}>Pro</option><option value="business" ${o.plan==='business'?'selected':''}>Business</option></select></td><td><span class="badge badge-${o.status||'active'}">${o.status||'active'}</span></td><td>${o.maxUsers||'-'}</td><td><button class="btn-sm btn-view" onclick="viewOrg('${o._id}')">👁️</button> <button class="btn-sm btn-green" onclick="changeStatus('${o._id}','active')">تفعيل</button> <button class="btn-sm btn-red" onclick="changeStatus('${o._id}','suspended')">تعليق</button></td></tr>`).join('');
        }

        function viewOrg(id) { showToast('عرض التفاصيل - قريبًا', 'info'); }
        async function changePlan(id, plan) { await fetch(`${API}/organizations/${id}/plan`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ plan }) }); showToast('تم تغيير الخطة', 'success'); }
        function changeStatus(id, status) { confirmDialog({ title: status === 'active' ? 'تفعيل المؤسسة' : 'تعليق المؤسسة', message: status === 'active' ? 'تفعيل هذه المؤسسة؟' : 'تعليق هذه المؤسسة؟ لن يتمكن المستخدمون من الدخول.', confirmText: status === 'active' ? 'تفعيل' : 'تعليق', danger: status === 'suspended', onConfirm: async () => { await fetch(`${API}/organizations/${id}/status`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ status }) }); showToast('تم التحديث', 'success'); loadOrgs(); } }); }

        loadOrgs();
    </script>
</body>
</html>
