<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المؤسسات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background: #0F172A; font-family: 'Cairo', sans-serif; color: white; }
        .sidebar { width: 240px; background: #1E293B; padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; }
        .sidebar h2 { color: #EF4444; margin-bottom: 1.5rem; }
        .sidebar a { display: block; padding: 0.6rem 0.75rem; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: white; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        h1 { margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #334155; text-align: right; font-size: 0.85rem; }
        th { color: #94A3B8; }
        .badge { padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.75rem; }
        .badge-active { background: #22C55E; color: white; }
        .badge-suspended { background: #EF4444; color: white; }
        .badge-expired { background: #F59E0B; color: white; }
        select { padding: 0.3rem; border-radius: 6px; background: #1E293B; color: white; border: 1px solid #334155; font-family: inherit; }
        .btn-sm { padding: 0.3rem 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; font-size: 0.75rem; }
        .btn-red { background: #EF4444; color: white; }
        .btn-green { background: #22C55E; color: white; }
        @media (max-width: 1024px) {
    .sidebar { width: 60px; padding: 1rem 0.5rem; }
    .sidebar h2 { font-size: 0.8rem; text-align: center; }
    .sidebar a { font-size: 0; justify-content: center; padding: 0.5rem; }
    .main { margin-right: 60px; padding: 1.5rem; }
}
@media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { position: fixed; right: -260px; width: 260px; top: 0; bottom: 0; z-index: 200; transition: right 0.3s ease; padding: 1.5rem 1rem; }
    .sidebar.open { right: 0; }
    .sidebar h2 { font-size: 1rem; }
    .sidebar a { font-size: 0.9rem; justify-content: flex-start; padding: 0.6rem 0.75rem; }
    .main { margin-right: 0; padding: 1rem; }
    h1 { font-size: 1.2rem; }
    table { font-size: 0.75rem; }
    th, td { padding: 0.5rem; }
    .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
    .admin-overlay.show { display: block; }
    .admin-menu-btn { display: flex !important; position: fixed; top: 12px; right: 12px; z-index: 150; background: #1E293B; color: white; border: 1px solid #334155; border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1.2rem; }
}
@media (max-width: 480px) {
    table { display: block; overflow-x: auto; }
}
    </style>
</head>
<body>
    <div class="admin-overlay" id="adminOverlay" onclick="closeSidebar()"></div>
<button class="admin-menu-btn" id="adminMenuBtn" onclick="openSidebar()" style="display:none;">☰</button>
    <aside class="sidebar">
    <h2>🔐 Nivora Admin</h2>
    <a href="dashboard.html">📊 لوحة القيادة</a>
    <a href="organizations.html">🏢 المؤسسات</a>
    <a href="subscriptions.html">💳 الاشتراكات</a>
    <a href="users.html">👥 المستخدمون</a>
    <a href="features.html">🚩 Feature Flags</a>
    <a href="usage.html">📊 الاستخدام</a>
    <a href="tickets.html">🎫 التذاكر</a>
    <a href="health.html">🖥 صحة النظام</a>
    <a href="#" onclick="logout()">🚪 خروج</a>
</aside>

    <div class="main">
        <h1>🏢 المؤسسات</h1>
        <table>
            <thead><tr><th>الاسم</th><th>المالك</th><th>الخطة</th><th>الحالة</th><th>المستخدمين</th><th>إجراءات</th></tr></thead>
            <tbody id="orgBody"></tbody>
        </table>
    </div>

    <script>
        const API = 'https://nivora-t9ov.onrender.com/api/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }

        async function loadOrgs() {
            const res = await fetch(`${API}/organizations`, { headers: { 'Authorization': `Bearer ${token}` } });
            const orgs = await res.json();
            document.getElementById('orgBody').innerHTML = orgs.map(o => `
                <tr>
                    <td>${o.name || '-'}</td>
                    <td>${o.ownerId?.username || '-'}</td>
                    <td>
                        <select onchange="changePlan('${o._id}', this.value)">
                            <option value="free" ${o.plan === 'free' ? 'selected' : ''}>Free</option>
                            <option value="pro" ${o.plan === 'pro' ? 'selected' : ''}>Pro</option>
                            <option value="business" ${o.plan === 'business' ? 'selected' : ''}>Business</option>
                        </select>
                    </td>
                    <td><span class="badge badge-${o.status || 'active'}">${o.status || 'active'}</span></td>
                    <td>${o.maxUsers || '-'}</td>
                    <td>
                        <button class="btn-sm btn-green" onclick="changeStatus('${o._id}', 'active')">تفعيل</button>
                        <button class="btn-sm btn-red" onclick="changeStatus('${o._id}', 'suspended')">تعليق</button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="6" style="text-align:center;padding:2rem;">لا توجد مؤسسات</td></tr>';
        }

        async function changePlan(id, plan) {
            await fetch(`${API}/organizations/${id}/plan`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ plan })
            });
        }

        async function changeStatus(id, status) {
            await fetch(`${API}/organizations/${id}/status`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status })
            });
            loadOrgs();
        }
function openSidebar() { document.querySelector('.sidebar').classList.add('open'); document.getElementById('adminOverlay').classList.add('show'); }
function closeSidebar() { document.querySelector('.sidebar').classList.remove('open'); document.getElementById('adminOverlay').classList.remove('show'); }
function updateMobileUI() { const btn = document.getElementById('adminMenuBtn'); if (window.innerWidth <= 768) { btn.style.display = 'flex'; } else { btn.style.display = 'none'; closeSidebar(); } }
window.addEventListener('resize', updateMobileUI);
updateMobileUI();
        loadOrgs();
    </script>
</body>
</html>
