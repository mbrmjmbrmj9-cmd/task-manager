<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | لوحة المدير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; min-height: 100vh; background: #0F172A; font-family: 'Cairo', sans-serif; color: #fff; }
        .sidebar { width: 240px; background: #1E293B; padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 200; transition: right 0.3s ease; overflow-y: auto; }
        .sidebar .logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; padding: 0 0.75rem; }
        .sidebar .logo img { width: 34px; height: 34px; flex-shrink: 0; }
        .sidebar .logo span { color: #EF4444; font-weight: 800; font-size: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 0.2rem; font-size: 0.9rem; transition: all 0.15s; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
        .topbar h1 { font-size: 1.4rem; font-weight: 800; }
        .topbar-actions { display: flex; gap: 0.5rem; }
        .btn-refresh { background: #1E293B; border: 1px solid #334155; border-radius: 8px; padding: 0.5rem 0.75rem; cursor: pointer; color: #94A3B8; font-family: inherit; font-size: 0.8rem; transition: all 0.15s; }
        .btn-refresh:hover { background: #334155; color: #fff; }
        .quick-actions { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .quick-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; background: #1E293B; border: 1px solid #334155; border-radius: 8px; cursor: pointer; color: #94A3B8; font-family: inherit; font-size: 0.8rem; text-decoration: none; transition: all 0.15s; }
        .quick-btn:hover { background: #334155; color: #fff; transform: translateY(-1px); }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #1E293B; padding: 1.25rem; border-radius: 12px; display: flex; align-items: center; gap: 1rem; transition: all 0.15s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
        .stat-info .value { font-size: 1.7rem; font-weight: 800; line-height: 1; }
        .stat-info .label { color: #94A3B8; font-size: 0.78rem; margin-top: 0.2rem; }
        .alert-item { padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 0.4rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; }
        .alert-warning { background: rgba(245,158,11,0.1); color: #F59E0B; border-right: 3px solid #F59E0B; }
        .alert-danger { background: rgba(239,68,68,0.1); color: #EF4444; border-right: 3px solid #EF4444; }
        .alert-info { background: rgba(59,130,246,0.1); color: #3B82F6; border-right: 3px solid #3B82F6; }
        .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.7rem; border-bottom: 1px solid #334155; text-align: right; font-size: 0.85rem; }
        th { color: #94A3B8; font-weight: 600; }
        .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        .admin-overlay.show { display: block; }
        .admin-menu-btn { display: none; position: fixed; top: 12px; right: 12px; z-index: 150; background: #1E293B; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1.2rem; }
        @media (max-width: 1024px) { .sidebar { width: 60px; padding: 1rem 0.5rem; } .sidebar .logo span, .sidebar a span { display: none; } .sidebar .logo img { margin: 0 auto; } .sidebar a { justify-content: center; padding: 0.5rem; } .main { margin-right: 60px; } }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { right: -260px; width: 260px; padding: 1.5rem 1rem; } .sidebar.open { right: 0; } .sidebar .logo span, .sidebar a span { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .main { margin-right: 0; padding: 1rem; } .admin-menu-btn { display: flex; } .stats { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; } .stat-card { padding: 0.85rem; gap: 0.5rem; } .stat-icon { width: 32px; height: 32px; font-size: 1rem; } .stat-info .value { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="admin-overlay" id="adminOverlay" onclick="closeSidebar()"></div>
    <button class="admin-menu-btn" id="adminMenuBtn" onclick="openSidebar()">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="logo"><img src="../img/logo.svg" alt="Nivora"><span>Nivora Admin</span></div>
        <a href="dashboard.html" class="active"><span>📊</span><span>لوحة القيادة</span></a>
        <a href="organizations.html"><span>🏢</span><span>المؤسسات</span></a>
        <a href="subscriptions.html"><span>💳</span><span>الاشتراكات</span></a>
        <a href="users.html"><span>👥</span><span>المستخدمون</span></a>
        <a href="features.html"><span>🚩</span><span>Feature Flags</span></a>
        <a href="usage.html"><span>📊</span><span>الاستخدام</span></a>
        <a href="tickets.html"><span>🎫</span><span>التذاكر</span></a>
        <a href="health.html"><span>🖥</span><span>صحة النظام</span></a>
        <a href="#" onclick="logout()"><span>🚪</span><span>خروج</span></a>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>📊 لوحة القيادة</h1>
            <div class="topbar-actions">
                <button class="btn-refresh" onclick="loadDashboard()">🔄 تحديث</button>
            </div>
        </div>

        <div class="quick-actions">
            <a href="organizations.html" class="quick-btn">🏢 المؤسسات</a>
            <a href="users.html" class="quick-btn">👥 المستخدمون</a>
            <a href="subscriptions.html" class="quick-btn">💳 الاشتراكات</a>
            <a href="tickets.html" class="quick-btn">🎫 التذاكر</a>
        </div>

        <div id="alertsContainer" style="margin-bottom:1rem;"></div>

        <div class="stats" id="statsGrid"></div>
<div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
    <input type="text" id="auditSearch" placeholder="🔍 بحث باسم المستخدم..." style="flex:1;min-width:150px;height:34px;border-radius:8px;border:1px solid #334155;background:#1E293B;color:#fff;padding:0 0.75rem;font-family:inherit;font-size:0.8rem;" oninput="loadAuditLogs()">
    <select id="auditAction" style="height:34px;border-radius:8px;border:1px solid #334155;background:#1E293B;color:#fff;padding:0 0.5rem;font-family:inherit;font-size:0.8rem;" onchange="loadAuditLogs()">
        <option value="">كل الإجراءات</option>
    </select>
</div>
        <h2 class="section-title" style="margin-top:1.5rem;">📋 آخر النشاطات</h2>
        
        <table>
            <thead><tr><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th><th>الوقت</th></tr></thead>
            <tbody id="auditBody"></tbody>
        </table>
    </div>

    <script src="../js/components.js"></script>
    <script>
        const API = 'https://nivora-t9ov.onrender.com/api/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';

        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('adminOverlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('adminOverlay').classList.remove('show'); }
        function updateMobileUI() { const btn = document.getElementById('adminMenuBtn'); btn.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; if (window.innerWidth > 768) closeSidebar(); }
        window.addEventListener('resize', updateMobileUI);
        updateMobileUI();

        function showSkeleton() {
            document.getElementById('statsGrid').innerHTML = Array(6).fill('<div class="stat-card"><div class="stat-icon skeleton" style="width:44px;height:44px;"></div><div class="stat-info"><div class="skeleton" style="height:24px;width:60px;margin-bottom:6px;"></div><div class="skeleton" style="height:12px;width:40px;"></div></div></div>').join('');
            document.getElementById('auditBody').innerHTML = Array(5).fill('<tr><td><div class="skeleton" style="height:14px;width:70%;"></div></td><td><div class="skeleton" style="height:14px;width:50px;"></div></td><td><div class="skeleton" style="height:14px;width:80%;"></div></td><td><div class="skeleton" style="height:14px;width:60px;"></div></td></tr>').join('');
        }

        async function loadDashboard() {
            showSkeleton();
            try {
                const [stats, logs] = await Promise.all([
                    fetch(`${API}/advanced-stats`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
                    fetch(`${API}/audit-logs`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()).then(d => d.data || d)
                ]);

                const statsData = [
                    { icon: '🏢', color: '#3B82F6', bg: 'rgba(59,130,246,0.1)', label: 'المؤسسات', value: stats.totalOrgs },
                    { icon: '👥', color: '#22C55E', bg: 'rgba(34,197,94,0.1)', label: 'المستخدمين', value: stats.totalUsers },
                    { icon: '💰', color: '#F59E0B', bg: 'rgba(245,158,11,0.1)', label: 'الإيرادات', value: '$' + stats.totalRevenue },
                    { icon: '⭐', color: '#8B5CF6', bg: 'rgba(139,92,246,0.1)', label: 'اشتراكات نشطة', value: stats.activeSubs },
                    { icon: '📈', color: '#EC4899', bg: 'rgba(236,72,153,0.1)', label: 'إيرادات الشهر', value: '$' + stats.revenueThisMonth },
                    { icon: '🆕', color: '#14B8A6', bg: 'rgba(20,184,166,0.1)', label: 'اشتراكات جديدة', value: stats.newSubsThisMonth }
                ];

                document.getElementById('statsGrid').innerHTML = statsData.map(s => `
                    <div class="stat-card">
                        <div class="stat-icon" style="background:${s.bg};color:${s.color};">${s.icon}</div>
                        <div class="stat-info"><div class="value" style="color:${s.color};">${s.value}</div><div class="label">${s.label}</div></div>
                    </div>`).join('');

                const logsData = Array.isArray(logs) ? logs : [];
                document.getElementById('auditBody').innerHTML = logsData.length === 0 ? '<tr><td colspan="4" style="text-align:center;padding:2rem;color:#94A3B8;">لا توجد سجلات</td></tr>' : logsData.map(l => `<tr><td>${l.username || '-'}</td><td>${l.action}</td><td>${l.details || '-'}</td><td>${new Date(l.createdAt).toLocaleString('ar-SA')}</td></tr>`).join('');
            } catch (err) {
                document.getElementById('statsGrid').innerHTML = '<div class="alert-danger" style="padding:1rem;border-radius:8px;">❌ تعذر تحميل البيانات</div>';
            }
        }

        async function loadAlerts() {
            try {
                const res = await fetch(`${API}/alerts`, { headers: { 'Authorization': `Bearer ${token}` } });
                const alerts = await res.json();
                document.getElementById('alertsContainer').innerHTML = alerts.map(a => `<div class="alert-item alert-${a.type}">${a.type === 'danger' ? '🔴' : a.type === 'warning' ? '🟡' : '🔵'} ${a.text}</div>`).join('');
            } catch (err) {}
        }

        async function loadAuditLogs() {
    const search = document.getElementById('auditSearch').value.trim();
    const action = document.getElementById('auditAction').value;
    let url = `${API}/audit-logs?limit=50`;
    if (search) url += `&username=${encodeURIComponent(search)}`;
    if (action) url += `&action=${encodeURIComponent(action)}`;

    try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const logs = data.data || [];
        const actions = data.actions || [];

        // تحديث قائمة الإجراءات
        const actionSelect = document.getElementById('auditAction');
        if (actionSelect.options.length === 1) {
            actions.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a;
                opt.textContent = a;
                actionSelect.appendChild(opt);
            });
        }

        document.getElementById('auditBody').innerHTML = logs.length === 0 ? '<tr><td colspan="4" style="text-align:center;padding:2rem;color:#94A3B8;">لا توجد سجلات</td></tr>' : logs.map(l => `<tr><td>${l.username || '-'}</td><td>${l.action}</td><td>${l.details || '-'}</td><td>${new Date(l.createdAt).toLocaleString('ar-SA')}</td></tr>`).join('');
    } catch (err) {}
}
        loadAlerts();
        loadDashboard();

        // تحديث تلقائي كل 30 ثانية
        setInterval(() => { loadAlerts(); loadDashboard(); }, 30000);
    </script>
</body>
</html>
