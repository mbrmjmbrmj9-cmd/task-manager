<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المستخدمون</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; min-height: 100vh; background: var(--bg); font-family: 'Cairo', sans-serif; color: var(--text); }
        .sidebar { width: 240px; background: var(--card); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 200; transition: right 0.3s ease; overflow-y: auto; }
        .sidebar .logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; padding: 0 0.75rem; }
        .sidebar .logo img { width: 34px; height: 34px; flex-shrink: 0; }
        .sidebar .logo span { color: #EF4444; font-weight: 800; font-size: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; color: var(--text-light); text-decoration: none; border-radius: 8px; margin-bottom: 0.2rem; font-size: 0.9rem; transition: all 0.15s; }
        .sidebar a:hover, .sidebar a.active { background: var(--border); color: var(--text); }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
        .topbar h1 { font-size: 1.4rem; font-weight: 800; }
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .toolbar input { flex: 1; min-width: 180px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 0 0.75rem; font-family: inherit; font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.7rem; border-bottom: 1px solid var(--border); text-align: right; font-size: 0.85rem; }
        th { color: var(--text-light); font-weight: 600; background: var(--card); }
        .badge { padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.72rem; }
        .badge-admin { background: rgba(239,68,68,0.15); color: #EF4444; }
        .badge-user { background: rgba(59,130,246,0.15); color: #3B82F6; }
        .badge-super { background: rgba(168,85,247,0.15); color: #A855F7; }
        .badge-active { background: rgba(34,197,94,0.15); color: #22C55E; }
        .badge-inactive { background: rgba(100,116,139,0.15); color: var(--text-muted); }
        .avatar-cell { width: 30px; height: 30px; border-radius: 50%; background: var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; margin-left: 0.4rem; vertical-align: middle; overflow: hidden; }
        .avatar-cell img { width: 100%; height: 100%; object-fit: cover; }
        .btn-sm { padding: 0.25rem 0.5rem; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; font-size: 0.7rem; transition: all 0.15s; }
        .btn-view { background: rgba(59,130,246,0.15); color: #3B82F6; }
        .btn-view:hover { background: #3B82F6; color: var(--text); }
        .btn-toggle { background: rgba(245,158,11,0.15); color: #F59E0B; }
        .btn-toggle:hover { background: #F59E0B; color: var(--text); }
        .btn-delete { background: rgba(239,68,68,0.15); color: #EF4444; }
        .btn-delete:hover { background: #EF4444; color: var(--text); }
        select.role-select { padding: 0.25rem; border-radius: 6px; background: var(--card); color: var(--text); border: 1px solid var(--border); font-family: inherit; font-size: 0.75rem; }
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        .admin-overlay.show { display: block; }
        .admin-menu-btn { display: none; position: fixed; top: 12px; right: 12px; z-index: 150; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1.2rem; }
        @media (max-width: 1024px) { .sidebar { width: 60px; padding: 1rem 0.5rem; } .sidebar .logo span, .sidebar a span { display: none; } .sidebar .logo img { margin: 0 auto; } .sidebar a { justify-content: center; } .main { margin-right: 60px; } }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { right: -260px; width: 260px; padding: 1.5rem 1rem; } .sidebar.open { right: 0; } .sidebar .logo span, .sidebar a span { display: inline; } .sidebar a { justify-content: flex-start; } .main { margin-right: 0; padding: 1rem; } .admin-menu-btn { display: flex; } table { font-size: 0.65rem; } th, td { padding: 0.4rem; } }
    </style>
<script src="../js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../js/theme.js" defer></script>
</head>
<body data-ui="app" data-area="admin">
    <div class="admin-overlay" id="adminOverlay" onclick="closeSidebar()"></div>
    <button class="admin-menu-btn" id="adminMenuBtn" onclick="openSidebar()">☰</button>

    <aside id="sidebar" class="shell-rail"></aside>

    <div class="main">
        <div class="topbar"><h1>👥 المستخدمون</h1></div>
        <div class="toolbar"><input type="text" id="searchInput" placeholder="🔍 بحث عن مستخدم..." oninput="renderUsers()"></div>
        <table>
            <thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>تاريخ التسجيل</th><th>إجراءات</th></tr></thead>
            <tbody id="userBody"></tbody>
        </table>
    </div>

    <script src="../js/components.js"></script>
    <script>
        const API = Nivora.apiBase + '/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';

        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('adminOverlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('adminOverlay').classList.remove('show'); }
        function updateMobileUI() { const btn = document.getElementById('adminMenuBtn'); btn.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; if (window.innerWidth > 768) closeSidebar(); }
        window.addEventListener('resize', updateMobileUI); updateMobileUI();

        let allUsers = [];

        function showSkeleton() { document.getElementById('userBody').innerHTML = Array(5).fill('<tr><td><div class="skeleton" style="height:14px;width:70%;"></div></td><td><div class="skeleton" style="height:14px;width:50px;"></div></td><td><div class="skeleton" style="height:14px;width:50px;"></div></td><td><div class="skeleton" style="height:14px;width:60px;"></div></td><td><div class="skeleton" style="height:28px;width:120px;"></div></td></tr>').join(''); }

        async function loadUsers() {
            showSkeleton();
            try {
                const res = await fetch(`${API}/users`, { headers: { 'Authorization': `Bearer ${token}` } });
                const response = await res.json();
                allUsers = response.data || response;
                renderUsers();
            } catch (err) { showError('userBody', 'تعذر تحميل المستخدمين', loadUsers); }
        }

        function renderUsers() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = q ? allUsers.filter(u => (u.username || '').toLowerCase().includes(q)) : allUsers;
            const roleBadge = role => role === 'super_admin' ? 'badge-super' : role === 'admin' ? 'badge-admin' : 'badge-user';
            const roleText = role => role === 'super_admin' ? 'مدير عام' : role === 'admin' ? 'مدير' : 'مستخدم';
            document.getElementById('userBody').innerHTML = filtered.length === 0 ? '<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-light);">لا يوجد مستخدمون</td></tr>' : filtered.map(u => {
                const isActive = u.isActive !== false;
                return `<tr>
                    <td><span class="avatar-cell">${u.avatar ? `<img src="${safeImageUrl(u.avatar)}">` : (u.username || 'م')[0]}</span>${escapeHtml(u.username)}</td>
                    <td>${u.role === 'super_admin' ? '<span class="badge badge-super">مدير عام</span>' : `<select class="role-select" onchange="changeRole('${u._id}', this.value)"><option value="user" ${escapeHtml(u.role==='user'?'selected':'')}>مستخدم</option><option value="admin" ${escapeHtml(u.role==='admin'?'selected':'')}>مدير</option></select>`}</td>
                    <td><span class="badge ${isActive ? 'badge-active' : 'badge-inactive'}">${isActive ? 'نشط' : 'معطل'}</span></td>
                    <td>${new Date(u.createdAt).toLocaleDateString('ar-SA')}</td>
                    <td>
                        <button class="btn-sm btn-toggle" onclick="toggleActive('${u._id}')">${isActive ? 'تعطيل' : 'تفعيل'}</button>
                        ${u.role !== 'super_admin' ? `<button class="btn-sm btn-delete" onclick="deleteUser('${u._id}')">حذف</button>` : ''}
                    </td>
                </tr>`;
            }).join('');
        }

        async function toggleActive(id) {
            confirmDialog({ title: 'تغيير حالة المستخدم', message: 'هل تريد تغيير حالة هذا المستخدم؟', confirmText: 'تأكيد', danger: false, onConfirm: async () => {
                await fetch(`${API}/users/${id}/toggle-active`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } });
                showToast('تم التحديث', 'success');
                loadUsers();
            }});
        }

        function deleteUser(id) {
            confirmDialog({ title: 'حذف المستخدم', message: 'سيتم حذف المستخدم نهائيًا. هل أنت متأكد؟', confirmText: 'حذف نهائي', danger: true, onConfirm: async () => {
                await fetch(`${API}/users/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                showToast('تم الحذف', 'success');
                loadUsers();
            }});
        }

        async function changeRole(id, role) {
            await fetch(`${API}/users/${id}/role`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ role }) });
            showToast('تم تغيير الدور', 'success');
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
