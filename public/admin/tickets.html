<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | تذاكر الدعم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background: #0F172A; font-family: 'Cairo', sans-serif; color: white; }
        .sidebar { width: 240px; background: #1E293B; padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; }
        .sidebar h2 { color: #EF4444; margin-bottom: 1.5rem; }
        .sidebar a { display: block; padding: 0.6rem 0.75rem; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: white; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        h1 { margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #334155; text-align: right; font-size: 0.85rem; }
        th { color: #94A3B8; }
        .badge { padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.75rem; }
        .badge-open { background: #F59E0B; color: white; }
        .badge-resolved { background: #22C55E; color: white; }
        select { padding: 0.3rem; border-radius: 6px; background: #1E293B; color: white; border: 1px solid #334155; font-family: inherit; }
    </style>
</head>
<body>
    <aside class="sidebar">
    <h2>🔐 Nivora Admin</h2>
    <a href="dashboard.html">📊 لوحة القيادة</a>
    <a href="organizations.html">🏢 المؤسسات</a>
    <a href="subscriptions.html">💳 الاشتراكات</a>
    <a href="users.html">👥 المستخدمون</a>
    <a href="features.html">🚩 Feature Flags</a>
    <a href="usage.html">📊 الاستخدام</a>
    <a href="tickets.html">🎫 التذاكر</a>
    <a href="health.html">🖥 صحة النظام</a>
    <a href="#" onclick="logout()">🚪 خروج</a>
</aside>

    <div class="main">
        <h1>🎫 تذاكر الدعم</h1>
        <table>
            <thead><tr><th>المؤسسة</th><th>المستخدم</th><th>الموضوع</th><th>الأولوية</th><th>الحالة</th><th>إجراء</th></tr></thead>
            <tbody id="ticketBody"></tbody>
        </table>
    </div>

    <script>
        const API = 'http://localhost:3000/api/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }

        async function loadTickets() {
            const res = await fetch(`${API}/tickets`, { headers: { 'Authorization': `Bearer ${token}` } });
            const tickets = await res.json();
            document.getElementById('ticketBody').innerHTML = tickets.map(t => `
                <tr>
                    <td>${t.organizationId?.name || '-'}</td>
                    <td>${t.userId?.username || '-'}</td>
                    <td>${t.subject}</td>
                    <td>${t.priority === 'urgent' ? '🔴' : t.priority === 'high' ? '🟠' : '🟡'}</td>
                    <td><span class="badge badge-${t.status === 'open' ? 'open' : 'resolved'}">${t.status}</span></td>
                    <td>
                        <select onchange="updateTicket('${t._id}', this.value)">
                            <option value="">تغيير...</option>
                            <option value="resolved">✅ حل</option>
                            <option value="closed">🚫 إغلاق</option>
                        </select>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="6" style="text-align:center;padding:2rem;">لا توجد تذاكر</td></tr>';
        }

        async function updateTicket(id, status) {
            if (!status) return;
            await fetch(`${API}/tickets/${id}`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ status })
            });
            loadTickets();
        }

        loadTickets();
    </script>
</body>
</html>
