<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | الاستخدام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background: #0F172A; font-family: 'Cairo', sans-serif; color: white; }
        .sidebar { width: 240px; background: #1E293B; padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; }
        .sidebar h2 { color: #EF4444; margin-bottom: 1.5rem; }
        .sidebar a { display: block; padding: 0.6rem 0.75rem; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: white; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        h1 { margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #334155; text-align: right; font-size: 0.85rem; }
        th { color: #94A3B8; }
        .bar { height: 8px; border-radius: 4px; background: #334155; }
        .bar-fill { height: 100%; border-radius: 4px; }
    </style>
</head>
<body>
    <aside class="sidebar">
    <h2>🔐 Nivora Admin</h2>
    <a href="dashboard.html">📊 لوحة القيادة</a>
    <a href="organizations.html">🏢 المؤسسات</a>
    <a href="subscriptions.html">💳 الاشتراكات</a>
    <a href="users.html">👥 المستخدمون</a>
    <a href="features.html">🚩 Feature Flags</a>
    <a href="usage.html">📊 الاستخدام</a>
    <a href="tickets.html">🎫 التذاكر</a>
    <a href="health.html">🖥 صحة النظام</a>
    <a href="#" onclick="logout()">🚪 خروج</a>
</aside>

    <div class="main">
        <h1>📊 استخدام المؤسسات</h1>
        <div id="usageContent" style="color:#94A3B8;">اختر مؤسسة من صفحة المؤسسات لعرض الاستخدام.</div>
    </div>

    <script>
        const API = 'http://localhost:3000/api/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }

        async function loadUsage() {
            const params = new URLSearchParams(window.location.search);
            const orgId = params.get('orgId');
            if (!orgId) return;

            const [orgRes, usageRes] = await Promise.all([
                fetch(`${API}/organizations`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
                fetch(`${API}/usage/${orgId}`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json())
            ]);

            const org = orgRes.find(o => o._id === orgId);
            document.getElementById('usageContent').innerHTML = `
                <h2 style="margin-bottom:1rem;">${org?.name || 'مؤسسة'}</h2>
                ${usageRes.length > 0 ? usageRes.map(u => `
                    <div style="margin-bottom:1rem;">
                        <strong>${u.metric}</strong>: ${u.value}
                        <div class="bar"><div class="bar-fill" style="width:${Math.min(u.value, 100)}%;background:#3B82F6;"></div></div>
                    </div>
                `).join('') : '<p>لا توجد بيانات استخدام</p>'}
            `;
        }

        loadUsage();
    </script>
</body>
</html>
