<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | Feature Flags</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; background: #0F172A; font-family: 'Cairo', sans-serif; color: white; margin: 0; }
        .sidebar { width: 240px; background: #1E293B; padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 200; transition: right 0.3s ease; }
        .sidebar h2 { color: #EF4444; margin-bottom: 1.5rem; font-size: 1.1rem; }
        .sidebar a { display: block; padding: 0.6rem 0.75rem; color: #94A3B8; text-decoration: none; border-radius: 8px; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: white; }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        h1 { margin-bottom: 1rem; font-size: 1.4rem; }
        .add-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .add-form input { padding: 0.5rem; border-radius: 6px; background: #1E293B; color: white; border: 1px solid #334155; font-family: inherit; flex: 1; min-width: 120px; }
        .add-form button { padding: 0.5rem 1rem; background: #22C55E; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .flag-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; background: #1E293B; border-radius: 8px; margin-bottom: 0.5rem; }
        .flag-row .name { font-weight: 600; }
        .flag-row .desc { color: #94A3B8; font-size: 0.8rem; }
        .toggle { width: 50px; height: 26px; background: #334155; border-radius: 13px; cursor: pointer; position: relative; transition: background 0.3s; }
        .toggle.on { background: #22C55E; }
        .toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: right 0.3s; }
        .toggle.on::after { right: 27px; }
        .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        .admin-overlay.show { display: block; }
        .admin-menu-btn { display: none; position: fixed; top: 12px; right: 12px; z-index: 150; background: #1E293B; color: white; border: 1px solid #334155; border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1.2rem; }
        .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @media (max-width: 1024px) { .sidebar { width: 60px; padding: 1rem 0.5rem; } .sidebar h2 { font-size: 0.8rem; text-align: center; } .sidebar a { font-size: 0; justify-content: center; padding: 0.5rem; } .main { margin-right: 60px; } }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { right: -260px; width: 260px; padding: 1.5rem 1rem; } .sidebar.open { right: 0; } .sidebar h2 { font-size: 1rem; } .sidebar a { font-size: 0.9rem; justify-content: flex-start; padding: 0.6rem 0.75rem; } .main { margin-right: 0; padding: 1rem; } .admin-menu-btn { display: flex; } h1 { font-size: 1.2rem; } .add-form { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="admin-overlay" id="adminOverlay" onclick="closeSidebar()"></div>
    <button class="admin-menu-btn" id="adminMenuBtn" onclick="openSidebar()">☰</button>
    <aside class="sidebar" id="sidebar">
        <h2>🔐 Nivora Admin</h2>
        <a href="dashboard.html">📊 لوحة القيادة</a>
        <a href="organizations.html">🏢 المؤسسات</a>
        <a href="subscriptions.html">💳 الاشتراكات</a>
        <a href="users.html">👥 المستخدمون</a>
        <a href="features.html" class="active">🚩 Feature Flags</a>
        <a href="usage.html">📊 الاستخدام</a>
        <a href="tickets.html">🎫 التذاكر</a>
        <a href="health.html">🖥 صحة النظام</a>
        <a href="#" onclick="logout()">🚪 خروج</a>
    </aside>
    <div class="main">
        <h1>🚩 Feature Flags</h1>
        <div class="add-form"><input type="text" id="flagName" placeholder="اسم الميزة"><input type="text" id="flagDesc" placeholder="الوصف"><button onclick="addFlag()">➕ إضافة</button></div>
        <div id="flagsList"></div>
    </div>
    <script>
        const API = 'https://nivora-t9ov.onrender.com/api/admin';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('adminOverlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('adminOverlay').classList.remove('show'); }
        function updateMobileUI() { const btn = document.getElementById('adminMenuBtn'); btn.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; if (window.innerWidth > 768) closeSidebar(); }
        window.addEventListener('resize', updateMobileUI); updateMobileUI();

        function showSkeleton() { document.getElementById('flagsList').innerHTML = Array(3).fill('<div class="flag-row"><div><div class="skeleton" style="height:14px;width:120px;margin-bottom:4px;"></div><div class="skeleton" style="height:10px;width:200px;"></div></div><div class="skeleton" style="width:50px;height:26px;border-radius:13px;"></div></div>').join(''); }
        async function loadFlags() { showSkeleton(); try { const res = await fetch(`${API}/feature-flags`,{headers:{'Authorization':`Bearer ${token}`}}); const flags = await res.json(); document.getElementById('flagsList').innerHTML = flags.length === 0 ? '<p style="text-align:center;color:#94A3B8;padding:2rem;">لا توجد ميزات</p>' : flags.map(f => `<div class="flag-row"><div><div class="name">${f.name}</div><div class="desc">${f.description||''}</div></div><div class="toggle ${f.enabled?'on':''}" onclick="toggleFlag('${f.name}',${!f.enabled})"></div></div>`).join(''); } catch (err) { document.getElementById('flagsList').innerHTML = '<p style="text-align:center;color:#EF4444;">خطأ</p>'; } }
        async function addFlag() { const name=document.getElementById('flagName').value.trim(), desc=document.getElementById('flagDesc').value.trim(); if(!name) return; await fetch(`${API}/feature-flags`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({name,enabled:false,description:desc})}); document.getElementById('flagName').value=''; document.getElementById('flagDesc').value=''; loadFlags(); }
        async function toggleFlag(name,enabled){ await fetch(`${API}/feature-flags`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({name,enabled})}); loadFlags(); }
        loadFlags();
    </script>
</body>
</html>
