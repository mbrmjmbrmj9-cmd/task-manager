<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | صحة النظام</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; min-height: 100vh; background: var(--bg); font-family: 'Cairo', sans-serif; color: var(--text); }
        .sidebar { width: 240px; background: var(--card); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 200; transition: right 0.3s ease; overflow-y: auto; }
        .sidebar .logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; padding: 0 0.75rem; }
        .sidebar .logo img { width: 34px; height: 34px; flex-shrink: 0; }
        .sidebar .logo span { color: #EF4444; font-weight: 800; font-size: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; color: var(--text-light); text-decoration: none; border-radius: 8px; margin-bottom: 0.2rem; font-size: 0.9rem; transition: all 0.15s; }
        .sidebar a:hover, .sidebar a.active { background: var(--border); color: var(--text); }
        .main { margin-right: 240px; flex: 1; padding: 2rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
        .topbar h1 { font-size: 1.4rem; font-weight: 800; }
        .btn-refresh { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.75rem; cursor: pointer; color: var(--text-light); font-family: inherit; font-size: 0.8rem; transition: all 0.15s; }
        .btn-refresh:hover { background: var(--border); color: var(--text); }
        .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .health-card { background: var(--card); padding: 1.5rem; border-radius: 12px; text-align: center; border: 1px solid var(--border); transition: all 0.15s; }
        .health-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .health-card .status { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .health-card .name { font-weight: 700; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .health-card .detail { color: var(--text-light); font-size: 0.8rem; }
        .last-check { text-align: center; color: var(--text-muted); font-size: 0.78rem; margin-top: 1.5rem; }
        .admin-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        .admin-overlay.show { display: block; }
        .admin-menu-btn { display: none; position: fixed; top: 12px; right: 12px; z-index: 150; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0.6rem; cursor: pointer; font-size: 1.2rem; }
        @media (max-width: 1024px) { .sidebar { width: 60px; padding: 1rem 0.5rem; } .sidebar .logo span, .sidebar a span { display: none; } .sidebar .logo img { margin: 0 auto; } .sidebar a { justify-content: center; } .main { margin-right: 60px; } }
        @media (max-width: 768px) { body { flex-direction: column; } .sidebar { right: -260px; width: 260px; padding: 1.5rem 1rem; } .sidebar.open { right: 0; } .sidebar .logo span, .sidebar a span { display: inline; } .sidebar a { justify-content: flex-start; } .main { margin-right: 0; padding: 1rem; } .admin-menu-btn { display: flex; } .health-grid { grid-template-columns: 1fr; } }
    </style>
<script src="../js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../js/theme.js" defer></script>
</head>
<body data-ui="app" data-area="admin">
    <div class="admin-overlay" id="adminOverlay" onclick="closeSidebar()"></div>
    <button class="admin-menu-btn" id="adminMenuBtn" onclick="openSidebar()">☰</button>

    <aside id="sidebar" class="shell-rail"></aside>

    <div class="main">
        <div class="topbar">
            <h1>🖥 صحة النظام</h1>
            <button class="btn-refresh" onclick="checkHealth()">🔄 إعادة الفحص</button>
        </div>

        <div class="health-grid" id="healthGrid"></div>
        <p class="last-check" id="lastCheck"></p>
    </div>

    <script src="../js/components.js"></script>
    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'login.html';

        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('adminOverlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('adminOverlay').classList.remove('show'); }
        function updateMobileUI() { const btn = document.getElementById('adminMenuBtn'); btn.style.display = window.innerWidth <= 768 ? 'flex' : 'none'; if (window.innerWidth > 768) closeSidebar(); }
        window.addEventListener('resize', updateMobileUI); updateMobileUI();

        let checking = false;
        async function checkHealth() {
            if (checking) return;
            checking = true;
            const cards = document.getElementById('healthGrid');
            const checked = document.getElementById('lastCheck');
            try {
                const res = await fetch(Nivora.url('/health'));
                const result = await res.json();
                if (result.server !== 'ok') throw new Error('تعذر الوصول إلى الخادم');
                cards.innerHTML = '<div class="health-card"><div class="name">الخادم</div><div class="detail">يستجيب</div></div>' +
                    '<div class="health-card"><div class="name">قاعدة البيانات</div><div class="detail">' + (result.database === 'ready' ? 'متصلة' : 'غير متاحة') + '</div></div>';
            } catch {
                cards.textContent = 'تعذر التحقق من صحة النظام.';
            } finally {
                checked.textContent = 'آخر فحص: ' + new Date().toLocaleString('ar-SA');
                checking = false;
            }
        }
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
