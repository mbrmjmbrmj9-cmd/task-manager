<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | لوحة المدير</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EF4444">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #0F172A; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; position: relative; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 25% 50%, rgba(239,68,68,0.08) 0%, transparent 50%), radial-gradient(circle at 75% 50%, rgba(239,68,68,0.06) 0%, transparent 50%); z-index: -1; }
        .container { width: 100%; max-width: 420px; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo img { width: 60px; height: 60px; margin-bottom: 1rem; }
        .logo h1 { font-size: 1.5rem; font-weight: 800; color: #EF4444; }
        .logo p { color: #94A3B8; font-size: 0.9rem; margin-top: 0.3rem; }
        .card { background: #1E293B; border-radius: 20px; padding: 2.5rem 2rem; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .card h2 { font-size: 1.2rem; font-weight: 800; text-align: center; margin-bottom: 0.4rem; }
        .card .sub { text-align: center; color: #94A3B8; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .input-group { position: relative; margin-bottom: 1rem; }
        .input-group .icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #64748B; pointer-events: none; }
        .input-group input { width: 100%; height: 50px; padding: 0 2.75rem; border-radius: 12px; border: 1.5px solid #334155; background: #0F172A; color: #fff; font-family: inherit; font-size: 0.9rem; transition: all 0.2s; }
        .input-group input:focus { outline: none; border-color: #EF4444; box-shadow: 0 0 0 4px rgba(239,68,68,0.1); }
        .input-group input::placeholder { color: #64748B; }
        .btn-login { width: 100%; height: 52px; border-radius: 12px; border: none; background: #EF4444; color: #fff; font-family: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
        .btn-login:hover { background: #DC2626; transform: translateY(-1px); box-shadow: 0 8px 25px rgba(239,68,68,0.3); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg { background: rgba(239,68,68,0.1); color: #EF4444; padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.85rem; display: none; border-right: 3px solid #EF4444; animation: shake 0.3s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .back-link { display: block; text-align: center; color: #94A3B8; text-decoration: none; font-size: 0.85rem; margin-top: 1.5rem; }
        .back-link:hover { color: #fff; }
        @media (max-width: 480px) { .card { padding: 2rem 1.5rem; } .logo img { width: 50px; height: 50px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../img/logo.svg" alt="Nivora">
            <h1>لوحة المدير</h1>
            <p>منطقة محمية - للمدير فقط</p>
        </div>

        <div class="card">
            <h2>🔐 تسجيل الدخول</h2>
            <p class="sub">أدخل بيانات المدير للمتابعة</p>

            <div class="error-msg" id="errorMsg"></div>

            <div class="input-group">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
                <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="email">
            </div>

            <div class="input-group">
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
            </div>

            <button class="btn-login" id="loginBtn" onclick="login()">دخول</button>
        </div>

        <a href="../index.html" class="back-link">← العودة للموقع</a>
    </div>

    <script src="../js/components.js"></script>
    <script>
        const API = 'https://nivora-t9ov.onrender.com/api/admin';

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                err.textContent = 'املأ جميع الحقول';
                err.style.display = 'block';
                return;
            }

            setButtonLoading(btn, true, 'جارٍ الدخول...');

            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    showToast('تم تسجيل الدخول', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 500);
                } else {
                    err.textContent = data.error || 'بيانات غير صحيحة';
                    err.style.display = 'block';
                    setTimeout(() => err.style.display = 'none', 3000);
                }
            } catch (e) {
                err.textContent = 'تعذر الاتصال بالخادم';
                err.style.display = 'block';
            }

            setButtonLoading(btn, false);
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
