<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nivora | المحادثة</title>
    <link rel="stylesheet" href="css/workspace.css">
    <script src="js/config.js" defer></script>
    <script src="js/chat.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js" defer></script>
</head>
<body data-ui="app" class="workspace-shell">
    <a class="skip-link" href="#content">انتقل إلى المحتوى</a>
    <aside id="sidebar" class="shell-rail"></aside>
    <main id="content" class="workspace-content chat-content">
        <div class="breadcrumb"><a id="backToProject" href="teams.html">فرق العمل</a></div>
        <header class="project-heading">
            <div>
                <h1 id="chatTitle"><span aria-hidden="true">💬</span> المحادثة</h1>
                <p class="project-description" id="roomName"></p>
            </div>
            <button id="refreshChat" class="workspace-button quiet" type="button">تحديث</button>
        </header>
        <p id="chatStatus" class="workspace-status" role="status" aria-live="polite" hidden></p>
        <section class="workspace-panel chat-panel" aria-labelledby="chatTitle">
            <button id="olderMessages" class="workspace-button quiet" type="button" hidden>عرض رسائل أقدم</button>
            <ol id="messages" class="chat-messages" aria-label="الرسائل"></ol>
            <form id="chatForm" class="chat-form" hidden>
                <label class="workspace-label">الرسالة
                    <textarea name="text" class="workspace-input" rows="2" maxlength="4000" required></textarea>
                </label>
                <div class="dialog-actions">
                    <button id="cancelEdit" class="workspace-button quiet" type="button" hidden>إلغاء التعديل</button>
                    <button id="submitMessage" class="workspace-button primary" type="submit">إرسال</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
