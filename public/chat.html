<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المحادثة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root { --sidebar-w: 240px; }
        body { min-height: 100vh; display: flex; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .topbar { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .topbar h1 { font-size: 1.2rem; font-weight: 800; }
        .online-users { font-size: 0.85rem; color: var(--text-light); display: flex; align-items: center; gap: 0.35rem; }
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .messages { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .msg { max-width: 72%; padding: 0.6rem 0.85rem; border-radius: 14px; position: relative; animation: msgIn 0.2s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.mine { background: var(--primary); color: #fff; margin-right: auto; border-bottom-left-radius: 4px; }
        .msg.other { background: var(--secondary-light); color: var(--text); margin-left: auto; border-bottom-right-radius: 4px; }
        .msg .user { font-size: 0.7rem; font-weight: 700; margin-bottom: 0.2rem; opacity: 0.8; }
        .msg .text { font-size: 0.88rem; line-height: 1.5; }
        .msg .time { font-size: 0.6rem; opacity: 0.6; margin-top: 0.25rem; text-align: left; }
        .msg .actions { position: absolute; top: -8px; left: 8px; display: none; gap: 0.15rem; }
        .msg:hover .actions { display: flex; }
        .msg .actions button { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xs); cursor: pointer; font-size: 0.65rem; padding: 0.1rem 0.35rem; color: var(--text-light); }
        .msg .actions button:hover { background: var(--secondary-light); }
        .msg .reactions { display: flex; gap: 0.2rem; margin-top: 0.3rem; flex-wrap: wrap; }
        .msg .reaction { background: rgba(255,255,255,0.2); padding: 0.1rem 0.4rem; border-radius: var(--radius-xs); font-size: 0.75rem; cursor: pointer; }
        .msg.other .reaction { background: rgba(0,0,0,0.06); }
        .system-msg { text-align: center; font-size: 0.75rem; color: var(--text-muted); padding: 0.25rem; }
        .typing-indicator { font-size: 0.75rem; color: var(--text-muted); padding: 0.25rem 1.5rem; font-style: italic; }
        .input-row { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; border-top: 1px solid var(--border); align-items: center; background: var(--card); position: relative; }
        .input-row input { flex: 1; height: 44px; border-radius: 22px; border: 1px solid var(--border); padding: 0 1rem; font-family: inherit; font-size: 0.9rem; background: var(--bg); color: var(--text); }
        .input-row input:focus { outline: none; border-color: var(--primary); }
        .emoji-btn { cursor: pointer; font-size: 1.3rem; background: none; border: none; padding: 0.25rem; }
        .emoji-picker { display: none; position: absolute; bottom: 65px; right: 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem; z-index: 20; box-shadow: var(--shadow-lg); }
        .emoji-picker.show { display: flex; gap: 0.3rem; flex-wrap: wrap; width: 260px; }
        .emoji-picker span { cursor: pointer; font-size: 1.3rem; padding: 0.25rem; border-radius: var(--radius-xs); }
        .emoji-picker span:hover { background: var(--primary-light); }
        .empty-chat { text-align: center; color: var(--text-muted); padding: 3rem; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 400px; box-shadow: var(--shadow-xl); animation: modalIn 0.2s ease; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 1.1rem; font-weight: 800; }
        .modal-close { background: var(--secondary-light); border: none; font-size: 1rem; cursor: pointer; color: var(--text-light); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--danger-light); color: var(--danger); }
        .modal-body { padding: 1.25rem 1.5rem; }
        .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.5rem; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; z-index: 200; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; } .bottom-nav { display: flex; } .topbar { padding: 0.75rem 1rem; } .topbar h1 { font-size: 1rem; } .messages { padding: 0.75rem; } .msg { max-width: 85%; } .input-row { padding: 0.75rem 1rem; } }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo"><span>📋 Nivora</span></div>
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="label">لوحة القيادة</span></a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg><span class="label">المهام</span></a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">المشاريع</span></a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg><span class="label">Kanban</span></a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">Gantt</span></a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">التقويم</span></a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="label">التقارير</span></a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg><span class="label">Workflows</span></a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">القوالب</span></a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg><span class="label">الأرشيف</span></a>
        <a href="chat.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="label">المحادثة</span></a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg><span class="label">الفريق</span></a>
        <a href="teams.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg><span class="label">فرق العمل</span></a>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>💬 المحادثة</h1>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <div style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;" onclick="window.location.href='profile.html'">
                    <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:var(--secondary-light);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:var(--text-light);overflow:hidden;"></div>
                    <span id="topUsername" style="font-size:0.8rem;font-weight:600;"></span>
                </div>
                <span class="online-users"><span class="online-dot"></span> <span id="onlineCount">1</span> متصل</span>
                <button class="btn btn-ghost btn-icon" onclick="toggleDark()" id="darkBtn" style="width:32px;height:32px;">🌙</button>
                <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
            </div>
        </div>
        <div class="messages" id="messages"><div class="empty-chat">💬 لا توجد رسائل بعد</div></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="input-row">
            <div class="emoji-picker" id="emojiPicker">
                <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('✅')">✅</span><span onclick="addEmoji('🚀')">🚀</span><span onclick="addEmoji('💡')">💡</span>
            </div>
            <button class="emoji-btn" onclick="toggleEmoji()">😀</button>
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
            <button class="btn btn-primary" onclick="sendMessage()" style="height:44px;border-radius:22px;padding:0 1.5rem;">إرسال</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>الرئيسية</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>مهام</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>فريق</a>
        <a href="#" onclick="openSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>المزيد</a>
    </nav>

    <div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
        <div class="modal">
            <div class="modal-header"><h3>تعديل الرسالة</h3><button class="modal-close" onclick="closeEditModal()">✕</button></div>
            <div class="modal-body"><input type="text" class="input" id="editMsgInput" placeholder="نص الرسالة"></div>
            <div class="modal-footer"><button class="btn btn-outline" onclick="closeEditModal()">إلغاء</button><button class="btn btn-primary" onclick="submitEdit()">حفظ</button></div>
        </div>
    </div>

    <script src="js/components.js"></script>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        const socket = io('https://nivora-t9ov.onrender.com');
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = 'login.html';
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        const username = user.fullName || user.username || 'مستخدم';
        let messages = [], onlineCount = 1, editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            const avatar = document.getElementById('topAvatar');
            const un = document.getElementById('topUsername');
            if (un) un.textContent = username;
            if (avatar) {
                if (user.avatar) avatar.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                else avatar.textContent = getInitials(username);
            }
        });

        socket.emit('join', username);
        socket.on('user-joined', (name) => { onlineCount++; updateOnlineCount(); addSystemMsg(`${name} انضم`); });
        socket.on('user-left', (name) => { onlineCount = Math.max(1, onlineCount - 1); updateOnlineCount(); addSystemMsg(`${name} غادر`); });
        socket.on('chat-message', (msg) => { msg._id = Date.now().toString(); messages.push(msg); renderMessages(); });
        socket.on('edit-message', (data) => { const m = messages.find(m => m._id === data._id); if (m) { m.text = data.text; m.edited = true; renderMessages(); } });
        socket.on('delete-message', (id) => { messages = messages.filter(m => m._id !== id); renderMessages(); });
        socket.on('react-message', (data) => { const m = messages.find(m => m._id === data._id); if (m) { m.reactions = m.reactions || {}; m.reactions[data.emoji] = (m.reactions[data.emoji] || 0) + 1; renderMessages(); } });
        socket.on('typing', (name) => { document.getElementById('typingIndicator').textContent = `${name} يكتب...`; });
        socket.on('stop-typing', () => { document.getElementById('typingIndicator').textContent = ''; });

        function updateOnlineCount() { document.getElementById('onlineCount').textContent = onlineCount; }
        function renderMessages() {
            const c = document.getElementById('messages');
            if (messages.length === 0) { c.innerHTML = '<div class="empty-chat">💬 لا توجد رسائل بعد</div>'; return; }
            c.innerHTML = messages.map(m => {
                const isMine = m.username === username;
                const reactions = m.reactions ? Object.entries(m.reactions).map(([e, cnt]) => `<span class="reaction" onclick="addReaction('${m._id}','${e}')">${e} ${cnt}</span>`).join('') : '';
                return `<div class="msg ${isMine ? 'mine' : 'other'}"><div class="user">${m.username}${m.edited ? ' (معدلة)' : ''}</div><div class="text">${m.text}</div>${reactions ? `<div class="reactions">${reactions}</div>` : ''}<div class="time">${new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}</div><div class="actions">${isMine ? `<button onclick="openEditModal('${m._id}')">✏️</button><button onclick="deleteMsg('${m._id}')">🗑️</button>` : ''}<button onclick="addReaction('${m._id}','👍')">👍</button></div></div>`;
            }).join('');
            c.scrollTop = c.scrollHeight;
        }

        function addSystemMsg(text) { const d = document.createElement('div'); d.className = 'system-msg'; d.textContent = text; document.getElementById('messages').appendChild(d); document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; }
        function sendMessage() { const input = document.getElementById('msgInput'); const text = input.value.trim(); if (!text) return; socket.emit('chat-message', { username, text }); input.value = ''; socket.emit('stop-typing'); }
        function openEditModal(id) { editingId = id; const m = messages.find(m => m._id === id); if (!m) return; document.getElementById('editMsgInput').value = m.text; document.getElementById('editModal').classList.add('show'); document.getElementById('editMsgInput').focus(); }
        function closeEditModal() { document.getElementById('editModal').classList.remove('show'); editingId = null; }
        function submitEdit() { const text = document.getElementById('editMsgInput').value.trim(); if (!text || !editingId) return; socket.emit('edit-message', { id: editingId, text }); closeEditModal(); showToast('تم التعديل', 'success'); }
        function deleteMsg(id) { confirmDialog({ title: 'حذف الرسالة', message: 'حذف هذه الرسالة؟', confirmText: 'حذف', danger: true, onConfirm: () => { socket.emit('delete-message', id); } }); }
        function addReaction(id, emoji) { socket.emit('react-message', { id, emoji }); }
        function toggleEmoji() { document.getElementById('emojiPicker').classList.toggle('show'); }
        function addEmoji(emoji) { document.getElementById('msgInput').value += emoji; document.getElementById('msgInput').focus(); }

        document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        let typingTimeout;
        document.getElementById('msgInput').addEventListener('input', () => { socket.emit('typing', username); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => socket.emit('stop-typing'), 2000); });
        document.addEventListener('click', (e) => { if (!e.target.closest('.emoji-btn') && !e.target.closest('.emoji-picker')) document.getElementById('emojiPicker').classList.remove('show'); });

        updateOnlineCount();
    </script>
</body>
</html>
