<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | المحادثة</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { display: flex; min-height: 100vh; background: var(--bg); }
        .sidebar { width: 240px; background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .sidebar a:hover, .sidebar a.active { background: #EFF6FF; color: var(--primary); }
        .main { margin-right: 240px; flex: 1; display: flex; flex-direction: column; height: 100vh; }
        .topbar { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 1.2rem; font-weight: 800; }
        .search-row { padding: 0.5rem 1.5rem; border-bottom: 1px solid var(--border); }
        .search-row input { width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--border); padding: 0 0.75rem; font-family: inherit; font-size: 0.85rem; background: var(--bg); color: var(--text); }
        .online-users { font-size: 0.85rem; color: var(--text-light); }
        .pinned { padding: 0.5rem 1.5rem; background: #FEF3C7; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .pinned strong { cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
        .msg { margin-bottom: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 12px; max-width: 70%; position: relative; }
        .msg.mine { background: #2563EB; color: white; margin-right: auto; }
        .msg.other { background: #F1F5F9; color: #1E293B; margin-left: auto; }
        .msg .user { font-size: 0.75rem; font-weight: 700; margin-bottom: 0.25rem; }
        .msg .text { font-size: 0.9rem; }
        .msg .time { font-size: 0.65rem; opacity: 0.7; margin-top: 0.25rem; }
        .msg .actions { display: none; position: absolute; top: 5px; left: 5px; gap: 0.25rem; }
        .msg:hover .actions { display: flex; }
        .msg .actions button { background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 0.15rem; border-radius: 4px; }
        .msg .actions button:hover { background: rgba(0,0,0,0.1); }
        .msg .reactions { display: flex; gap: 0.25rem; margin-top: 0.25rem; flex-wrap: wrap; }
        .msg .reaction { background: rgba(0,0,0,0.1); padding: 0.1rem 0.35rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
        .typing-indicator { font-size: 0.8rem; color: var(--text-light); padding: 0.5rem 1.5rem; font-style: italic; }
        .input-row { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; border-top: 1px solid var(--border); align-items: center; }
        .input-row input { flex: 1; }
        .emoji-btn { cursor: pointer; font-size: 1.2rem; }
        .emoji-picker { display: none; position: absolute; bottom: 60px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem; z-index: 10; }
        .emoji-picker.show { display: flex; gap: 0.25rem; flex-wrap: wrap; width: 250px; }
        .emoji-picker span { cursor: pointer; font-size: 1.2rem; padding: 0.2rem; }
        .emoji-picker span:hover { background: #EFF6FF; border-radius: 4px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">📋 Nivora</div>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>لوحة القيادة</a>
        <a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>المهام</a>
        <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>المشاريع</a>
        <a href="kanban.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>Kanban</a>
        <a href="gantt.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>Gantt</a>
        <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>التقويم</a>
        <a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>التقارير</a>
        <a href="workflows.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>Workflows</a>
        <a href="templates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>القوالب</a>
        <a href="archive.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>الأرشيف</a>
        <a href="team.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>الفريق</a>
        <a href="chat.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>المحادثة</a>
    </aside>

    <div class="main">
        <div class="topbar">
            <h1>💬 المحادثة</h1>
            <div style="display:flex;gap:0.5rem;align-items:center;">
                <button class="btn btn-outline" onclick="toggleLang()" id="langBtn" style="height:36px;">🌐 EN</button>
                <button class="btn btn-outline" onclick="toggleDark()" id="darkBtn" style="height:36px;">🌙</button>
                <span class="online-users" id="onlineUsers">🟢 0 متصل</span>
            </div>
        </div>
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="🔍 بحث في المحادثة..." oninput="filterMessages()">
        </div>
        <div class="pinned" id="pinnedMessage" style="display:none;">
            📌 <strong id="pinnedText"></strong>
            <button onclick="unpinMessage()" style="background:none;border:none;cursor:pointer;margin-right:0.5rem;">✕</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="input-row" style="position:relative;">
            <div class="emoji-picker" id="emojiPicker">
                <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('😢')">😢</span>
                <span onclick="addEmoji('👀')">👀</span><span onclick="addEmoji('✅')">✅</span>
            </div>
            <span class="emoji-btn" onclick="toggleEmoji()">😀</span>
            <input type="text" class="input" id="msgInput" placeholder="اكتب رسالة...">
            <button class="btn btn-primary" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        const socket = io('http://localhost:3000');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const username = user.fullName || user.username || 'مستخدم';
        let messages = [];
        let pinned = null;
        let editingId = null;
        let onlineCount = 1;

        socket.emit('join', username);

        socket.on('user-joined', (name) => { onlineCount++; updateOnlineCount(); addSystemMessage(`${name} انضم`); });
        socket.on('user-left', (name) => { onlineCount--; updateOnlineCount(); addSystemMessage(`${name} غادر`); });
        socket.on('chat-message', (msg) => { msg.id = Date.now().toString(); messages.push(msg); renderMessages(); });
        socket.on('edit-message', (data) => { const msg = messages.find(m => m.id === data.id); if (msg) { msg.text = data.text; msg.edited = true; renderMessages(); } });
        socket.on('delete-message', (id) => { messages = messages.filter(m => m.id !== id); renderMessages(); });
        socket.on('react-message', (data) => { const msg = messages.find(m => m.id === data.id); if (msg) { if (!msg.reactions) msg.reactions = {}; msg.reactions[data.emoji] = (msg.reactions[data.emoji] || 0) + 1; renderMessages(); } });
        socket.on('pin-message', (msg) => { pinned = msg; document.getElementById('pinnedMessage').style.display = 'block'; document.getElementById('pinnedText').textContent = msg.text; });
        socket.on('typing', (name) => { document.getElementById('typingIndicator').textContent = `${name} يكتب...`; });
        socket.on('stop-typing', () => { document.getElementById('typingIndicator').textContent = ''; });

        function updateOnlineCount() { document.getElementById('onlineUsers').innerHTML = `🟢 ${onlineCount} متصل`; }

        function renderMessages(filter = '') {
            const container = document.getElementById('messages');
            const filtered = filter ? messages.filter(m => m.text.includes(filter)) : messages;
            container.innerHTML = filtered.map(m => {
                const isMine = m.username === username;
                const reactions = m.reactions ? Object.entries(m.reactions).map(([e, c]) => `<span class="reaction" onclick="addReaction('${m.id}','${e}')">${e} ${c}</span>`).join('') : '';
                return `<div class="msg ${isMine ? 'mine' : 'other'}" data-id="${m.id}"><div class="user">${m.username}${m.edited ? ' <small>(معدلة)</small>' : ''}</div><div class="text">${m.text}</div>${reactions ? `<div class="reactions">${reactions}</div>` : ''}<div class="time">${new Date().toLocaleTimeString('ar-SA')}</div><div class="actions">${isMine ? `<button onclick="editMessage('${m.id}')">✏️</button><button onclick="deleteMessage('${m.id}')">🗑️</button>` : ''}<button onclick="addReaction('${m.id}','👍')">👍</button><button onclick="pinMessage('${m.id}')">📌</button></div></div>`;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) { const div = document.createElement('div'); div.style.cssText = 'text-align:center;color:var(--text-light);font-size:0.8rem;margin:0.5rem 0;'; div.textContent = text; document.getElementById('messages').appendChild(div); }
        function sendMessage() { const input = document.getElementById('msgInput'); const text = input.value.trim(); if (!text) return; if (editingId) { socket.emit('edit-message', { id: editingId, text }); editingId = null; input.placeholder = 'اكتب رسالة...'; } else { socket.emit('chat-message', { username, text }); } input.value = ''; socket.emit('stop-typing'); }
        function editMessage(id) { const msg = messages.find(m => m.id === id); if (!msg) return; document.getElementById('msgInput').value = msg.text; document.getElementById('msgInput').placeholder = 'تعديل الرسالة...'; editingId = id; document.getElementById('msgInput').focus(); }
        function deleteMessage(id) { if (!confirm('حذف الرسالة؟')) return; socket.emit('delete-message', id); messages = messages.filter(m => m.id !== id); renderMessages(); }
        function addReaction(id, emoji) { socket.emit('react-message', { id, emoji }); }
        function pinMessage(id) { const msg = messages.find(m => m.id === id); if (msg) socket.emit('pin-message', msg); }
        function unpinMessage() { pinned = null; document.getElementById('pinnedMessage').style.display = 'none'; }
        function filterMessages() { renderMessages(document.getElementById('searchInput').value); }
        function toggleEmoji() { document.getElementById('emojiPicker').classList.toggle('show'); }
        function addEmoji(emoji) { document.getElementById('msgInput').value += emoji; document.getElementById('msgInput').focus(); }

        function toggleDark() { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('dark', isDark); document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
        if (typeof currentLang !== 'undefined') { document.getElementById('langBtn').innerHTML = currentLang === 'ar' ? '🌐 EN' : '🌐 AR'; }

        let typingTimeout;
        document.getElementById('msgInput').addEventListener('input', () => { socket.emit('typing', username); clearTimeout(typingTimeout); typingTimeout = setTimeout(() => socket.emit('stop-typing'), 2000); });
        document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        document.addEventListener('click', (e) => { if (!e.target.closest('.emoji-btn') && !e.target.closest('.emoji-picker')) { document.getElementById('emojiPicker').classList.remove('show'); } });

        updateOnlineCount();
    </script>
</body>
</html>
