<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | مساحة العمل</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .container { width: 100%; max-width: 520px; }
        .logo { text-align: center; margin-bottom: 2rem; font-size: 2rem; font-weight: 800; color: var(--primary); }
        .card { background: var(--card); border-radius: var(--radius-xl); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border); text-align: center; }
        .card h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
        .card p { color: var(--text-light); font-size: 0.9rem; margin-bottom: 2rem; }
        .options { display: flex; gap: 1rem; }
        .option { flex: 1; background: var(--card); border-radius: var(--radius); padding: 2rem 1.25rem; box-shadow: var(--shadow-sm); cursor: pointer; transition: all var(--transition); border: 2px solid var(--border); text-decoration: none; color: inherit; }
        .option:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        .option .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .option h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.35rem; }
        .option p { font-size: 0.82rem; color: var(--text-light); margin-bottom: 0; }
        .back-link { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--card); padding: 0.5rem 1rem; border-radius: var(--radius-full); color: var(--text-light); text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .dark-toggle { position: fixed; top: 1rem; left: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; cursor: pointer; font-size: 1.1rem; }
        @media (max-width: 500px) { .options { flex-direction: column; } .card { padding: 2rem 1.5rem; } }
    </style>
</head>
<body>
    <button class="dark-toggle" onclick="toggleDark()" id="darkBtn">🌙</button>
    <div class="container">
        <a href="login.html" class="back-link">← رجوع لتسجيل الدخول</a>
        <div class="logo">📋 Nivora</div>
        <div class="card">
            <h1>مرحباً بك في Nivora</h1>
            <p>اختر الطريقة التي تريد البدء بها</p>
            <div class="options">
                <a href="setup-account.html" class="option"><div class="icon">🏢</div><h2>إنشاء فريق جديد</h2><p>أنشئ مساحة عمل لفريقك</p></a>
                <a href="join-workspace.html" class="option"><div class="icon">👥</div><h2>الانضمام لفريق</h2><p>انضم برمز الدعوة</p></a>
            </div>
        </div>
    </div>
    <script src="js/components.js"></script>
    <script>
        function toggleDark() { document.body.classList.toggle('dark'); const d = document.body.classList.contains('dark'); localStorage.setItem('dark', d); document.getElementById('darkBtn').textContent = d ? '☀️' : '🌙'; }
        if (localStorage.getItem('dark') === 'true') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }
    </script>
</body>
</html>
