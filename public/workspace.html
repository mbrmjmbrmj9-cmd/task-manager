<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | مساحة العمل</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #F1F5F9; font-family: 'Cairo', sans-serif; }
        .card { width: 90%; max-width: 520px; background: #FFFFFF; border-radius: 32px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.05); text-align: center; }
        .card h1 { font-size: 1.5rem; font-weight: 800; color: #1E293B; margin-bottom: 2rem; }
        .options { display: flex; gap: 1rem; }
        @media (max-width: 500px) { .options { flex-direction: column; } }
        .option { flex: 1; background: #FFFFFF; border-radius: 20px; padding: 1.5rem; box-shadow: 0 4px 16px rgba(0,0,0,0.04); cursor: pointer; transition: all 0.25s; border: 2px solid transparent; text-decoration: none; color: inherit; }
        .option:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.08); border-color: #2563EB; }
        .option .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .option h2 { font-size: 1.1rem; font-weight: 800; color: #1E293B; margin-bottom: 0.25rem; }
        .option p { font-size: 0.85rem; color: #64748B; }
    </style>
</head>
<body>
    <div class="card">
        <h1>هل أنت مستخدم جديد أم تريد الانضمام لفريق موجود؟</h1>
        <div class="options">
            <a href="setup-account.html" class="option"><div class="icon">🏢</div><h2>إنشاء فريق جديد</h2><p>أنشئ مساحة عمل لفريقك وادعُ الأعضاء</p></a>
            <a href="join-workspace.html" class="option"><div class="icon">👥</div><h2>الانضمام لفريق موجود</h2><p>انضم إلى فريق تم إنشاؤه مسبقاً برمز الدعوة</p></a>
        </div>
    </div>
</body>
</html>
