<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | الملف الشخصي</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
        .card { width: 400px; padding: 2rem; text-align: center; }
        .card h2 { margin-bottom: 1.5rem; }
        .avatar-large { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 0.5rem; background: #E2E8F0; cursor: pointer; }
        .btn-full { width: 100%; margin-top: 0.5rem; }
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 16px; }
        .lightbox .close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><span class="close">&times;</span><img id="lightboxImg" src=""></div>

    <div class="card">
        <a href="index.html" style="display:block;text-align:right;color:var(--primary);text-decoration:none;margin-bottom:1rem;">← رجوع</a>
        <h2>الملف الشخصي</h2>

        <div id="currentAvatar">
            <img id="avatarLarge" class="avatar-large" src="" onclick="openLightbox(this.src)" title="اضغط للتكبير">
            <p style="color:var(--text-light);font-size:0.8rem;margin-top:0.25rem;">اضغط على الصورة للتكبير</p>
            <input type="file" id="avatarInput" style="display:none;" accept="image/*" onchange="previewAndSave()">
            <button class="btn btn-primary btn-full" onclick="document.getElementById('avatarInput').click()">📷 تغيير الصورة</button>
            <button class="btn btn-outline btn-full" onclick="removeAvatar()">🗑️ إزالة</button>
        </div>

        <div id="noAvatar">
            <img class="avatar-large" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='35' r='20' fill='%2394A3B8'/><ellipse cx='50' cy='80' rx='35' ry='25' fill='%2394A3B8'/></svg>">
            <p style="color:var(--text-light);margin-top:0.5rem;">لا توجد صورة شخصية</p>
            <input type="file" id="avatarInput2" style="display:none;" accept="image/*" onchange="previewAndSave()">
            <button class="btn btn-primary btn-full" onclick="document.getElementById('avatarInput2').click()">📷 إضافة صورة</button>
        </div>
    </div>

    <script>
        const API = 'https://nivora-t9ov.onrender.com/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (user.avatar) { document.getElementById('noAvatar').style.display = 'none'; document.getElementById('avatarLarge').src = user.avatar; }
        else { document.getElementById('currentAvatar').style.display = 'none'; }

        function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('show'); }

        async function previewAndSave() {
            const input = document.querySelector('input[type="file"]:not([style*="none"])') || document.querySelector('input[type="file"]');
            const file = input.files[0]; if (!file) return;
            const formData = new FormData(); formData.append('file', file);
            const res = await fetch('https://nivora-t9ov.onrender.com/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) { await fetch(`${API}/auth/avatar`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ avatar: data.url }) }); user.avatar = data.url; localStorage.setItem('user', JSON.stringify(user)); location.reload(); }
        }

        async function removeAvatar() {
            if (!confirm('إزالة الصورة الشخصية؟')) return;
            await fetch(`${API}/auth/avatar`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ avatar: '' }) });
            user.avatar = ''; localStorage.setItem('user', JSON.stringify(user)); location.reload();
        }
    </script>
</body>
</html>
