<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | الملف الشخصي</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --sidebar-w: 240px; }
        body { min-height: 100vh; }
        .sidebar { width: var(--sidebar-w); background: var(--card); border-left: 1px solid var(--border); padding: 1.5rem 1rem; position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar .logo { font-size: 1.3rem; font-weight: 800; padding: 0 0.75rem; margin-bottom: 1rem; color: var(--primary); }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; border-radius: 8px; color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
        .sidebar a:hover, .sidebar a.active { background: var(--primary-light); color: var(--primary); }
        .sidebar a svg { width: 20px; height: 20px; flex-shrink: 0; }
        .sidebar .label { transition: opacity 0.2s; }
        .main { margin-right: var(--sidebar-w); padding: 1.5rem; min-height: 100vh; }
        .back-link { display: inline-block; color: var(--primary); text-decoration: none; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .page-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
        .avatar-section { text-align: center; }
        .avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 0.5rem; background: var(--secondary-light); cursor: pointer; }
        .avatar-actions { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.75rem; flex-wrap: wrap; }
        .security-log { max-height: 300px; overflow-y: auto; }
        .log-item { padding: 0.6rem 0.7rem; border-radius: var(--radius-sm); font-size: 0.8rem; margin-bottom: 0.35rem; background: var(--secondary-light); }
        .log-item .log-action { font-weight: 700; }
        .log-item .log-time { font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 0.15rem; }
        .msg { text-align: center; margin-top: 0.5rem; font-size: 0.85rem; display: none; padding: 0.5rem; border-radius: var(--radius-sm); }
        .msg.success { display: block; background: var(--success-light); color: var(--success); }
        .msg.error { display: block; background: var(--danger-light); color: var(--danger); }
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: var(--radius); }
        .lightbox .close { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 2rem; cursor: pointer; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 0.5rem 1rem; z-index: 90; justify-content: space-around; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-light); text-decoration: none; font-size: 0.65rem; font-weight: 500; }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a svg { width: 22px; height: 22px; }
        @media (max-width: 1024px) { :root { --sidebar-w: 72px; } .sidebar { padding: 1rem 0.5rem; } .sidebar .logo { font-size: 1rem; text-align: center; } .sidebar .label, .sidebar .logo span { display: none; } .sidebar a { justify-content: center; padding: 0.5rem; } }
        @media (max-width: 768px) { :root { --sidebar-w: 0; } .sidebar { right: -260px; width: 260px; } .sidebar.open { right: 0; } .sidebar .label { display: inline; } .sidebar a { justify-content: flex-start; padding: 0.6rem 0.75rem; } .overlay.show { display: block; } .main { margin-right: 0; padding: 0.75rem; padding-bottom: 5rem; } .bottom-nav { display: flex; } .profile-grid { grid-template-columns: 1fr; } }
    </style>
<script src="js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js" defer></script>
</head>
<body data-ui="app">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    <div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><span class="close">&times;</span><img id="lightboxImg" src=""></div>

    <aside id="sidebar" class="shell-rail"></aside>

    <main class="main">
        <a href="dashboard.html" class="back-link">← العودة للرئيسية</a>
        <h1 class="page-title">الملف الشخصي</h1>
        <div class="profile-grid">
            <div class="card avatar-section">
                <h3>الصورة الشخصية</h3>
                <img id="avatarLarge" class="avatar-large" src="" onclick="openLightbox(this.src)">
                <p style="font-size:0.8rem;color:var(--text-muted);">اضغط للتكبير</p>
                <div class="avatar-actions">
                    <input type="file" id="avatarInput" style="display:none;" accept="image/*" onchange="uploadAvatar()">
                    <button class="btn btn-primary btn-sm" onclick="document.getElementById('avatarInput').click()">📷 تغيير</button>
                    <button class="btn btn-outline btn-sm" onclick="removeAvatar()">🗑️ إزالة</button>
                </div>
            </div>
            <div class="card">
                <h3>تعديل البيانات</h3>
                <div class="form-group"><label>الاسم الكامل</label><input type="text" class="input" id="fullName" onchange="saveProfile()"></div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" class="input" id="email" onchange="saveProfile()"></div>
                <p class="msg" id="profileMsg"></p>
            </div>
            <div class="card">
                <h3>تغيير كلمة المرور</h3>
                <div class="form-group"><label>الحالية</label><input type="password" class="input" id="currentPassword"></div>
                <div class="form-group"><label>الجديدة</label><input type="password" class="input" id="newPassword"></div>
                <div class="form-group"><label>التأكيد</label><input type="password" class="input" id="confirmPassword"></div>
                <button class="btn btn-primary" onclick="changePassword()" style="width:100%;">تغيير</button>
                <p class="msg" id="passwordMsg"></p>
            </div>
            <div class="card">
                <h3>سجل الأمان</h3>
                <div class="security-log" id="securityLog"><p style="color:var(--text-muted);text-align:center;">جارٍ التحميل...</p></div>
            </div>
        </div>
    </main>

    <script src="js/components.js"></script>
    <script>
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('show'); }
        const API = Nivora.apiBase;
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        let user = JSON.parse(localStorage.getItem('user') || '{}');

        async function loadProfile() {
            try {
                const res = await fetch(`${API}/auth/profile`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) { user = await res.json(); localStorage.setItem('user', JSON.stringify(user)); }
            } catch (err) {}
            document.getElementById('fullName').value = user.fullName || '';
            document.getElementById('email').value = user.email || user.username || '';
            document.getElementById('avatarLarge').src = user.avatar || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="35" r="20" fill="%2394A3B8"/><ellipse cx="50" cy="80" rx="35" ry="25" fill="%2394A3B8"/></svg>';
            loadSecurityLog();
        }

        async function saveProfile() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const msg = document.getElementById('profileMsg');
            try {
                const res = await fetch(`${API}/auth/profile`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ fullName, email }) });
                if (res.ok) { msg.className = 'msg success'; msg.textContent = 'تم الحفظ'; user.fullName = fullName; user.email = email; localStorage.setItem('user', JSON.stringify(user)); }
                else { const d = await res.json(); msg.className = 'msg error'; msg.textContent = d.error || 'خطأ'; }
                setTimeout(() => msg.className = 'msg', 3000);
            } catch (err) { showToast('خطأ', 'error'); }
        }

        async function changePassword() {
            const current = document.getElementById('currentPassword').value;
            const newP = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('passwordMsg');
            if (!current || !newP || !confirm) { msg.className = 'msg error'; msg.textContent = 'جميع الحقول مطلوبة'; return; }
            if (newP !== confirm) { msg.className = 'msg error'; msg.textContent = 'غير متطابقتين'; return; }
            if (newP.length < 8) { msg.className = 'msg error'; msg.textContent = '8 أحرف على الأقل'; return; }
            try {
                const res = await fetch(`${API}/auth/change-password`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ currentPassword: current, newPassword: newP }) });
                if (res.ok) { msg.className = 'msg success'; msg.textContent = 'تم تغيير كلمة المرور. سجّل الدخول مجددًا.'; localStorage.removeItem('token'); setTimeout(() => location.href = 'login.html', 1000); document.getElementById('currentPassword').value = ''; document.getElementById('newPassword').value = ''; document.getElementById('confirmPassword').value = ''; }
                else { const d = await res.json(); msg.className = 'msg error'; msg.textContent = d.error || 'خطأ'; }
                setTimeout(() => msg.className = 'msg', 3000);
            } catch (err) { showToast('خطأ في الاتصال', 'error'); }
        }

        async function uploadAvatar() {
            const file = document.getElementById('avatarInput').files[0]; if (!file) return;
            const fd = new FormData(); fd.append('file', file);
            const uploadRes = await fetch(`${API}/upload`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd });
            const uploadData = await uploadRes.json();
            if (uploadRes.ok) {
                await fetch(`${API}/auth/avatar`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ avatar: uploadData.url }) });
                user.avatar = uploadData.url; localStorage.setItem('user', JSON.stringify(user));
                document.getElementById('avatarLarge').src = uploadData.url;
                showToast('تم التحديث', 'success');
            }
        }

        function removeAvatar() {
            confirmDialog({ title: 'إزالة الصورة', message: 'إزالة الصورة الشخصية؟', confirmText: 'إزالة', danger: true, onConfirm: async () => {
                await fetch(`${API}/auth/avatar`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ avatar: '' }) });
                user.avatar = ''; localStorage.setItem('user', JSON.stringify(user));
                document.getElementById('avatarLarge').src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="35" r="20" fill="%2394A3B8"/><ellipse cx="50" cy="80" rx="35" ry="25" fill="%2394A3B8"/></svg>';
                showToast('تمت الإزالة', 'success');
            } });
        }

        async function loadSecurityLog() {
            try {
                const res = await fetch(`${API}/auth/security-log`, { headers: { 'Authorization': `Bearer ${token}` } });
                const logs = await res.json();
                const c = document.getElementById('securityLog');
                if (!logs || logs.length === 0) { c.innerHTML = '<p style="color:var(--text-muted);">لا يوجد نشاط</p>'; return; }
                c.innerHTML = logs.reverse().map(l => `<div class="log-item"><span class="log-action">${escapeHtml(l.action === 'login_success' ? '✅ دخول' : l.action === 'login_failed' ? '❌ فشل' : l.action === 'password_changed' ? '🔒 تغيير' : l.action === 'password_reset' ? '🔄 استعادة' : l.action)}</span><span class="log-time">${formatDateTime(l.timestamp || l.createdAt)}</span></div>`).join('');
            } catch (err) { document.getElementById('securityLog').innerHTML = '<p style="color:var(--text-muted);">تعذر التحميل</p>'; }
        }

        loadProfile();
    </script>
</body>
</html>
