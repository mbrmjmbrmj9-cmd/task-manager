<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivora | انضمام</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #F1F5F9; font-family: 'Cairo', sans-serif; }
        .card { width: 90%; max-width: 480px; background: #FFFFFF; border-radius: 32px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .back { display: inline-block; background: #F1F5F9; padding: 0.4rem 1rem; border-radius: 20px; color: #64748B; text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .card h1 { font-size: 1.4rem; font-weight: 800; color: #1E293B; text-align: center; margin-bottom: 0.5rem; }
        .card .sub { text-align: center; color: #64748B; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .input-group { position: relative; margin-bottom: 1rem; }
        .input-group input { padding-right: 2.5rem; }
        .btn-full { width: 100%; height: 48px; border-radius: 12px; font-size: 1rem; }
        .btn-success { background: #22C55E; color: white; border: none; cursor: pointer; font-family: inherit; font-weight: 700; }
        .btn-success:hover { background: #16A34A; }
    </style>
</head>
<body>
    <div class="card">
        <a href="workspace.html" class="back">← رجوع</a>
        <h1>الانضمام لفريق موجود</h1>
        <p class="sub">أدخل رمز الدعوة للانضمام</p>
        <div class="input-group"><input type="text" class="input" id="inviteCode" placeholder="رمز الدعوة"></div>
        <button class="btn-full btn-success" onclick="join()">انضمام</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function join() {
            const code = document.getElementById('inviteCode').value.trim();
            if (!code) return alert('الرمز مطلوب');
            const res = await fetch('https://nivora-t9ov.onrender.com/api/workspaces/join', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ code })
            });
            if (res.ok) {
                const ws = await res.json();
                localStorage.setItem('workspaceId', ws._id);
                window.location.href = 'index.html';
            } else {
                const data = await res.json();
                alert(data.error);
            }
        }
    </script>
</body>
</html>
